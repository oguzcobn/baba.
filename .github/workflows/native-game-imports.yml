name: Build standalone imported games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-game-imports.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Offroad sources
        run: |
          git init /tmp/offroad
          git -C /tmp/offroad fetch --depth=1 https://github.com/Arz-Gev/offroad.git 482c83b0c15c3ef40a4fc2c444f0f3103a286064
          git -C /tmp/offroad checkout --detach FETCH_HEAD
          cd /tmp/offroad
          test "$(git rev-parse HEAD)" = 482c83b0c15c3ef40a4fc2c444f0f3103a286064
          npm ci
          npm run simtest
          npm run build -- --base /baba./games/offroad/
          test -s dist/index.html
          cp LICENSE README.md dist/
          printf '{"id":"offroad","source":"482c83b0c15c3ef40a4fc2c444f0f3103a286064"}\n' > dist/baba-build.json
      - name: Fetch pinned Fish Tank sources
        run: |
          git init /tmp/fish-tank
          git -C /tmp/fish-tank fetch --depth=1 https://github.com/maxlibin/threejs-fish-tank.git 932a475b7580d5dff3fb006cf0a09f8b806bc9a5
          git -C /tmp/fish-tank checkout --detach FETCH_HEAD
          cd /tmp/fish-tank
          test "$(git rev-parse HEAD)" = 932a475b7580d5dff3fb006cf0a09f8b806bc9a5
          corepack yarn install --frozen-lockfile
          corepack yarn test
          corepack yarn build --base /baba./games/threejs-fish-tank/
          test -s dist/index.html
          cp LICENSE ASSETS.md README.md dist/
          printf '{"id":"threejs-fish-tank","source":"932a475b7580d5dff3fb006cf0a09f8b806bc9a5"}\n' > dist/baba-build.json
      - name: Stage complete builds for review
        run: |
          mkdir -p games/offroad games/threejs-fish-tank
          cp -a /tmp/offroad/dist/. games/offroad/
          cp -a /tmp/fish-tank/dist/. games/threejs-fish-tank/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "baba-native-build-${GITHUB_RUN_ID}"
          git add -f games/offroad games/threejs-fish-tank
          git commit -m "Stage pinned Offroad and Fish Tank standalone builds with upstream credits"
          git push origin HEAD
