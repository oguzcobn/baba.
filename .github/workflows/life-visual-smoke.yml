name: HAYAT visual smoke
on:
  pull_request:
    paths:
      - 'js/life-game.js'
      - 'css/life-game.css'
      - 'index.html'
      - 'tests/mobile.spec.cjs'
      - '.github/workflows/life-visual-smoke.yml'
  workflow_dispatch:
jobs:
  life-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/life-game.js && node --check tests/mobile.spec.cjs
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/baba-http.log 2>&1 &
      - run: npx playwright test tests/mobile.spec.cjs --grep "HAYAT. animated city scene|HAYAT. premium mobile navigation|HAYAT. name-aware avatars" --reporter=line --workers=1
