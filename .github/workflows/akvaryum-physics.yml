name: AKVARYUM physics checks
on:
  push:
    branches: [main]
    paths:
      - 'games/akvaryum/**'
      - 'tests/akvaryum-physics.cjs'
      - '.github/workflows/akvaryum-physics.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/akvaryum-physics.cjs
