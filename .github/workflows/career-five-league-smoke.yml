name: Career five-league smoke
on:
  pull_request:
    paths:
      - 'js/career.js'
      - 'css/career.css'
      - 'index.html'
      - 'tests/mobile.spec.cjs'
      - '.github/workflows/career-five-league-smoke.yml'
  workflow_dispatch:
jobs:
  career-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/career.js && node --check tests/mobile.spec.cjs
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/baba-http.log 2>&1 &
      - run: npx playwright test tests/mobile.spec.cjs --grep "Manager Career five European leagues" --reporter=line --workers=1
