name: Damen Tersane Tycoon tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'games/dsan-shipyard/**'
      - 'tests/dsan-shipyard.spec.cjs'
      - 'sw.js'
  push:
    branches: [main]
    paths:
      - 'games/dsan-shipyard/**'
      - 'tests/dsan-shipyard.spec.cjs'
      - '.github/workflows/dsan-shipyard.yml'
jobs:
  shipyard:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for f in games/dsan-shipyard/js/*.js; do node --check "$f"; done && node tests/sw-safety.cjs
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/baba-http.log 2>&1 &
      - run: npx playwright test tests/dsan-shipyard.spec.cjs --reporter=line --workers=2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsan-shipyard-results
          path: test-results/
