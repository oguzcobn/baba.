name: Mobile browser smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'js/lab.js'
      - 'css/features.css'
      - 'tests/lab-catalog.cjs'
      - 'tests/lab-models.cjs'
      - 'js/lab-runtime.js'
      - 'css/lab-runtime.css'
      - 'js/games.js'
      - 'js/career.js'
      - 'js/career-birthdates.js'
      - 'data/career-birthdates.json'
      - 'tests/career-birthdates.cjs'
      - 'css/football-premium.css'
      - 'games/arcade/**'
      - 'img/library/*.svg'
      - 'js/oyunlar.js'
      - 'tests/arcade-import.spec.cjs'
      - 'tests/oyunlar-library.spec.cjs'
      - 'games/rota-conference/**'
      - 'tests/rota-conference.spec.cjs'
      - 'games/yilan-arenasi/index.html'
      - 'games/kafa-topu/index.html'
      - 'games/yayla-savunmasi/**'
      - 'tests/arcade-import.spec.cjs'
      - 'tests/oyunlar-library.spec.cjs'
      - 'tests/arcade-games.spec.cjs'
      - 'tests/lab-contrast.spec.cjs'
      - 'tests/mobile.spec.cjs'
      - 'tests/game-cover-editor.spec.cjs'
      - 'sw.js'
  push:
    branches: [test/mobile-playwright-smoke-20261112, main]
    paths:
      - '.github/workflows/mobile-smoke.yml'
      - 'tests/mobile.spec.cjs'
      - 'games/rota-conference/**'
      - 'tests/rota-conference.spec.cjs'
      - 'tests/match2d-browser.spec.cjs'
      - 'tests/match-rules.cjs'
      - 'tests/arcade-games.spec.cjs'
      - 'tests/arcade-import.spec.cjs'
      - 'tests/oyunlar-library.spec.cjs'
      - 'tests/lab-catalog.cjs'
      - 'js/**'
      - 'data/career-birthdates.json'
      - 'tests/career-birthdates.cjs'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/match-rules.cjs && node tests/lab-catalog.cjs && node tests/lab-models.cjs && node --check js/lab-runtime.js && node tests/career-birthdates.cjs && node --check js/career.js && node --check js/career-birthdates.js && node --check js/draft.js
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/baba-http.log 2>&1 &
      - run: npx playwright test tests/mobile.spec.cjs tests/game-cover-editor.spec.cjs --reporter=line --workers=2
      - run: npx playwright test tests/arcade-games.spec.cjs tests/lab-contrast.spec.cjs --reporter=line --workers=2
      - run: npx playwright test tests/arcade-import.spec.cjs tests/oyunlar-library.spec.cjs tests/rota-conference.spec.cjs --reporter=line --workers=2
      - run: npx playwright test tests/match2d-browser.spec.cjs --reporter=line --workers=1 --retries=1
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-and-match-replay-results
          path: test-results/
