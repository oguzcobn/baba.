<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MÜDAFİ: Ağır Ceza Dosyası — 2026/418 E. "Liman Gecesi" | Av. Kaan</title>
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.css" />
  <!-- Three.js for Interactive 3D Main Menu Scene -->
  <script src="vendor/three.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-noir: #0a0c12;
      --bg-mahogany: #1b1313;
      --bg-leather: #281c1a;
      --parchment: #f5f0e6;
      --ink: #1c1917;
      --gold: #c9a227;
      --gold-light: #ebd075;
      --crimson: #991b1b;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-noir);
      background-image:
        radial-gradient(circle at 20% 10%, rgba(201, 162, 39, 0.09), transparent 42%),
        radial-gradient(circle at 80% 88%, rgba(153, 27, 27, 0.11), transparent 46%),
        linear-gradient(180deg, #090b10 0%, #11141e 100%);
      color: #ebe6dd;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-serif-display { font-family: 'Playfair Display', Georgia, serif; }
    .font-legal { font-family: 'Merriweather', Georgia, serif; }

    /* Prestige Mahogany & Glass Cards */
    .mahogany-card {
      background: linear-gradient(155deg, rgba(39, 27, 25, 0.92), rgba(18, 14, 16, 0.96));
      border: 1px solid rgba(201, 162, 39, 0.28);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .parchment-card {
      background: linear-gradient(180deg, #f8f3e9 0%, #ede4d1 100%);
      color: var(--ink);
      border: 1px solid #d2c2a3;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.48), inset 0 0 42px rgba(139, 108, 66, 0.14);
    }

    /* Suspicious Clause in UYAP Indictment */
    .suspicious-clause {
      background: rgba(201, 162, 39, 0.24);
      border-bottom: 2px dashed #991b1b;
      cursor: pointer;
      padding: 1px 5px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .suspicious-clause:hover {
      background: rgba(153, 27, 27, 0.2);
      color: #7f1d1d;
    }
    .suspicious-clause.inspected {
      background: rgba(22, 163, 74, 0.18);
      border-bottom: 2px solid #15803d;
    }

    /* Stamps */
    .stamp {
      display: inline-block;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 3px solid currentColor;
      padding: 0.22rem 0.72rem;
      border-radius: 6px;
      transform: rotate(-6deg);
      box-shadow: inset 0 0 0 1px currentColor;
    }

    /* Buttons */
    .btn-gold {
      background: linear-gradient(180deg, #deb841 0%, #a57d15 100%);
      color: #161108;
      font-weight: 700;
      border: 1px solid #f4dc85;
      box-shadow: 0 4px 16px rgba(201, 162, 39, 0.34);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(201, 162, 39, 0.48);
    }

    .btn-crimson {
      background: linear-gradient(180deg, #c62828 0%, #7f1d1d 100%);
      color: #fef2f2;
      font-weight: 700;
      border: 1px solid #f87171;
      box-shadow: 0 4px 18px rgba(185, 28, 28, 0.45);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-crimson:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .btn-noir {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(201, 162, 39, 0.3);
      color: #ebe6dd;
      transition: all 0.16s ease;
    }
    .btn-noir:hover:not(:disabled) {
      background: rgba(201, 162, 39, 0.15);
      border-color: rgba(201, 162, 39, 0.72);
    }

    /* =====================================================================
       3D PERSPECTIVE SPATIAL MENU BAR (FLOATING GLASSMORPHIC DOCK)
       ===================================================================== */
    .spatial-dock-stage {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      perspective: 950px;
      width: auto;
      max-width: calc(100vw - 16px);
      pointer-events: none;
    }

    .spatial-dock-bar {
      pointer-events: auto;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 8px 12px 10px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(35, 25, 25, 0.76) 0%, rgba(14, 12, 17, 0.9) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(235, 208, 117, 0.32);
      border-bottom: 3px solid rgba(110, 82, 24, 0.65);
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.78),
        0 6px 14px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 244, 210, 0.25),
        inset 0 -8px 20px rgba(0, 0, 0, 0.45);
      transform: rotateX(15deg);
      transform-style: preserve-3d;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .spatial-dock-bar::-webkit-scrollbar { display: none; }

    .spatial-dock-bar:hover {
      transform: rotateX(7deg) translateY(-2px);
      box-shadow:
        0 26px 54px rgba(0, 0, 0, 0.85),
        0 0 28px rgba(201, 162, 39, 0.16),
        inset 0 1px 1px rgba(255, 244, 210, 0.32);
    }

    .dock-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      padding: 8px 11px 7px;
      border-radius: 15px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(201, 162, 39, 0.22);
      color: #e6dfd4;
      cursor: pointer;
      transform-origin: bottom center;
      transform: translateZ(0px);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
    }

    .dock-item:hover {
      transform: translateY(-10px) translateZ(26px) scale(1.12);
      background: linear-gradient(180deg, rgba(201, 162, 39, 0.28), rgba(127, 29, 29, 0.22));
      border-color: rgba(235, 208, 117, 0.85);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(201, 162, 39, 0.35);
      color: #fff8e1;
      z-index: 10;
    }

    .dock-item.active {
      background: linear-gradient(180deg, rgba(201, 162, 39, 0.3), rgba(201, 162, 39, 0.08));
      border-color: #ebd075;
      color: #fef3c7;
      box-shadow: 0 8px 20px rgba(201, 162, 39, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .dock-item.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #f4dc85, transparent);
      box-shadow: 0 0 10px #f4dc85;
    }

    .dock-item.dock-crimson {
      background: linear-gradient(180deg, rgba(185, 28, 28, 0.65), rgba(127, 29, 29, 0.85));
      border-color: rgba(248, 113, 113, 0.6);
      color: #fef2f2;
    }
    .dock-item.dock-crimson:hover {
      background: linear-gradient(180deg, rgba(220, 38, 38, 0.88), rgba(127, 29, 29, 0.95));
      border-color: #fca5a5;
      box-shadow: 0 12px 26px rgba(220, 38, 38, 0.45);
    }

    .dock-divider {
      width: 1px;
      height: 36px;
      background: linear-gradient(180deg, transparent, rgba(201, 162, 39, 0.45), transparent);
      margin: 0 2px;
      align-self: center;
      flex-shrink: 0;
    }

    /* Visual Novel Stage & Portrait Animations */
    .vn-stage {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(201, 162, 39, 0.34);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65), inset 0 0 60px rgba(0, 0, 0, 0.45);
      background: #0d0f16;
    }

    @keyframes portraitSpeak {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }
    .portrait-speaking {
      animation: portraitSpeak 0.65s ease-in-out infinite;
    }

    @keyframes portraitEnter {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .portrait-enter {
      animation: portraitEnter 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes flashBoom {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }
    .animate-flash {
      animation: flashBoom 0.48s ease-out forwards;
    }

    @keyframes stampSlam {
      0% { transform: scale(2.8) rotate(-14deg); opacity: 0; }
      55% { transform: scale(0.92) rotate(-5deg); opacity: 1; }
      75% { transform: scale(1.05) rotate(-7deg); opacity: 1; }
      100% { transform: scale(1) rotate(-6deg); opacity: 1; }
    }
    .animate-stamp { animation: stampSlam 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px) translateY(3px); }
      30% { transform: translateX(8px) translateY(-3px); }
      45% { transform: translateX(-6px) translateY(2px); }
      60% { transform: translateX(6px) translateY(-2px); }
      75% { transform: translateX(-3px); }
    }
    .animate-shake { animation: screenShake 0.42s ease-in-out; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeSlideUp 0.28s ease-out forwards; }

    @keyframes rainFall {
      0% { transform: translateY(-20px); }
      100% { transform: translateY(20px); }
    }
    .rain-layer { animation: rainFall 0.45s linear infinite; }

    @keyframes pulseGold {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201, 162, 39, 0.48); }
      50% { box-shadow: 0 0 0 11px rgba(201, 162, 39, 0); }
    }
    .pulse-gold { animation: pulseGold 2.2s infinite; }

    /* CSS 3D Fallback for Title Screen when Three.js is unavailable */
    .css-3d-fallback {
      background:
        radial-gradient(circle at 68% 34%, rgba(235, 190, 90, 0.22), transparent 44%),
        radial-gradient(circle at 25% 75%, rgba(153, 27, 27, 0.22), transparent 48%),
        linear-gradient(180deg, #0b0d14 0%, #1b1212 65%, #2b1a14 100%);
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #12141c; }
    ::-webkit-scrollbar-thumb { background: #4a3932; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #c9a227; }

    @media (max-width: 640px) {
      .dock-item { min-width: 56px; padding: 7px 8px 6px; }
      .spatial-dock-bar { padding: 6px 8px 8px; gap: 4px; }
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-600/40 selection:text-amber-100">

  <!-- Main Application Shell -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Dramatic Flash Layer -->
  <div id="flash-overlay" class="fixed inset-0 z-50 hidden bg-amber-100 pointer-events-none"></div>

  <!-- Dramatic Fullscreen Splash Overlay (Objection / Contradiction / Gavel + Evidence Card) -->
  <div id="dramatic-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/78 backdrop-blur-sm pointer-events-none p-4">
    <div id="dramatic-content" class="text-center max-w-xl w-full"></div>
  </div>

  <!-- Modal Root -->
  <div id="modal-root" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/82 backdrop-blur-sm p-3 sm:p-6 overflow-y-auto">
    <div id="modal-box" class="w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl animate-fade-in"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <script>
    /* =========================================================================
       1. WEB AUDIO API PROCEDURAL SOUND ENGINE (No External Audio URLs)
       ========================================================================= */
    const SoundEngine = (() => {
      let ctx = null;
      let lastTickTime = 0;

      function getCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function isMuted() {
        return !!(window.gameState && window.gameState.muted);
      }

      function playClick() {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(540, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(190, c.currentTime + 0.04);
        gain.gain.setValueAtTime(0.07, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.042);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.045);
      }

      function playTypeTick() {
        if (isMuted()) return;
        const now = performance.now();
        if (now - lastTickTime < 48) return;
        lastTickTime = now;
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(760 + Math.random() * 140, c.currentTime);
        gain.gain.setValueAtTime(0.018, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + 0.018);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.02);
      }

      function playPaper() {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const bufferSize = Math.floor(c.sampleRate * 0.16);
        const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.34));
        }
        const noise = c.createBufferSource();
        noise.buffer = buffer;
        const filter = c.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1850;
        filter.Q.value = 1.2;
        const gain = c.createGain();
        gain.gain.setValueAtTime(0.13, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.16);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);
        noise.start();
      }

      function playGavel(doubleHit = false) {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const hit = (offset) => {
          const t = c.currentTime + offset;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(170, t);
          osc.frequency.exponentialRampToValueAtTime(46, t + 0.16);
          gain.gain.setValueAtTime(0.38, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.19);

          const osc2 = c.createOscillator();
          const g2 = c.createGain();
          osc2.type = 'square';
          osc2.frequency.setValueAtTime(430, t);
          osc2.frequency.exponentialRampToValueAtTime(105, t + 0.05);
          g2.gain.setValueAtTime(0.11, t);
          g2.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc2.connect(g2);
          g2.connect(c.destination);
          osc2.start(t);
          osc2.stop(t + 0.07);
        };
        hit(0);
        if (doubleHit) hit(0.22);
      }

      function playObjection() {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const freqs = [220, 277.18, 329.63, 440];
        freqs.forEach((f, idx) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = idx % 2 === 0 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(f, c.currentTime);
          const filter = c.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2400, c.currentTime);
          filter.frequency.exponentialRampToValueAtTime(520, c.currentTime + 0.55);
          gain.gain.setValueAtTime(0.085, c.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.6);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(c.destination);
          osc.start();
          osc.stop(c.currentTime + 0.62);
        });
      }

      function playContradiction() {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const notes = [329.63, 392.0, 493.88, 659.25];
        notes.forEach((f, i) => {
          const t = c.currentTime + i * 0.055;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);
          gain.gain.setValueAtTime(0.13, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.48);
        });
      }

      function playError() {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(145, c.currentTime);
        osc.frequency.linearRampToValueAtTime(108, c.currentTime + 0.28);
        gain.gain.setValueAtTime(0.11, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.32);
      }

      function playVerdict(positive) {
        if (isMuted()) return;
        const c = getCtx();
        if (!c) return;
        const chord = positive ? [261.63, 329.63, 392.0, 523.25] : [220, 261.63, 311.13, 415.3];
        chord.forEach((f, idx) => {
          const t = c.currentTime + idx * 0.08;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          gain.gain.setValueAtTime(0.11, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(t);
          osc.stop(t + 1.15);
        });
      }

      return { playClick, playTypeTick, playPaper, playGavel, playObjection, playContradiction, playError, playVerdict };
    })();

    /* =========================================================================
       2. THREE.JS 3D INTERACTIVE LAW OFFICE / COURTROOM BENCH SCENE
       ========================================================================= */
    const Scene3D = (() => {
      let renderer = null;
      let scene = null;
      let camera = null;
      let animId = null;
      let scalesBeam = null;
      let leftPanGroup = null;
      let rightPanGroup = null;
      let dustPoints = null;
      let lampLight = null;

      let mouseX = 0;
      let mouseY = 0;
      let focusPreset = 'default';

      const CAMERA_PRESETS = {
        default: { pos: [0, 3.05, 6.9], look: [0, 0.85, 0] },
        dossier: { pos: [-2.1, 2.45, 5.2], look: [-1.5, 0.55, 0.4] },
        scales:  { pos: [0.25, 2.75, 5.1], look: [0, 1.55, -0.3] },
        gavel:   { pos: [2.2, 2.35, 5.1], look: [1.65, 0.45, 0.45] }
      };

      const currentLook = { x: 0, y: 0.85, z: 0 };

      function setFocus(preset) {
        focusPreset = CAMERA_PRESETS[preset] ? preset : 'default';
      }

      function onMouseMove(e) {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      }

      function onResize() {
        const container = document.getElementById('three-bg-container');
        if (!renderer || !camera || !container) return;
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function mount() {
        dispose();
        const container = document.getElementById('three-bg-container');
        if (!container) return;

        // Graceful CSS 3D fallback if Three.js CDN failed
        if (typeof THREE === 'undefined') {
          container.classList.add('css-3d-fallback');
          return;
        }

        try {
          const w = container.clientWidth || window.innerWidth;
          const h = container.clientHeight || window.innerHeight;

          scene = new THREE.Scene();
          scene.fog = new THREE.FogExp2(0x0b0c12, 0.068);

          camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 50);
          camera.position.set(0, 3.05, 6.9);

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          // --- Lighting: Warm Banker's Lamp + Ambient + Crimson Rim ---

              scalesBeam.rotation.z = sway;
              if (leftPanGroup) leftPanGroup.rotation.z = -sway;
              if (rightPanGroup) rightPanGroup.rotation.z = -sway;
            }

            // Warm lamp subtle flicker
            if (lampLight) {
              lampLight.intensity = 2.75 + Math.sin(t * 2.4) * 0.12;
            }

            // Floating dust drift
            if (dustPoints) {
              dustPoints.rotation.y = t * 0.025;
              dustPoints.position.y = Math.sin(t * 0.5) * 0.12;
            }

            // Smooth camera parallax + hover focus
            const preset = CAMERA_PRESETS[focusPreset] || CAMERA_PRESETS.default;
            const targetX = preset.pos[0] + mouseX * 0.65;
            const targetY = preset.pos[1] + mouseY * 0.32;
            const targetZ = preset.pos[2];

            camera.position.x += (targetX - camera.position.x) * 0.045;
            camera.position.y += (targetY - camera.position.y) * 0.045;
            camera.position.z += (targetZ - camera.position.z) * 0.045;

            currentLook.x += (preset.look[0] - currentLook.x) * 0.055;
            currentLook.y += (preset.look[1] - currentLook.y) * 0.055;
            currentLook.z += (preset.look[2] - currentLook.z) * 0.055;

            camera.lookAt(currentLook.x, currentLook.y, currentLook.z);
            renderer.render(scene, camera);
          }

          animate();
        } catch (err) {
          container.classList.add('css-3d-fallback');
        }
      }

      function dispose() {
        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('resize', onResize);
        if (renderer) {
          renderer.dispose();
          renderer = null;
        }
        scene = null;
        camera = null;
      }

      return { mount, dispose, setFocus };
    })();

    function getUnlockedEndings() {
      try {
        const raw = localStorage.getItem(ENDINGS_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function recordUnlockedEnding(endingId) {
      try {

    /* Typewriter Controller */
    const Typewriter = (() => {
      let timer = null;
      let fullText = '';
      let currentTargetId = null;

      function stop() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        const portrait = document.getElementById('vn-active-portrait');
        if (portrait) portrait.classList.remove('portrait-speaking');
      }

      function finishNow() {
        if (!timer || !currentTargetId) return;
        const el = document.getElementById(currentTargetId);
        if (el) el.textContent = fullText;
        stop();
      }

      function run(elementId, text) {
        stop();
        const el = document.getElementById(elementId);
        if (!el) return;
        fullText = text;
        currentTargetId = elementId;
        el.textContent = '';

        const portrait = document.getElementById('vn-active-portrait');
        if (portrait) portrait.classList.add('portrait-speaking');

        let idx = 0;
        timer = setInterval(() => {
          idx += 2;
          if (idx >= fullText.length) {
            el.textContent = fullText;
            stop();
          } else {
            el.textContent = fullText.slice(0, idx);
            SoundEngine.playTypeTick();
          }
        }, 18);
      }

      return { run, stop, finishNow };
    })();

    function showToast(msg, type = 'gold') {
      const container = document.getElementById('toast-container');
      const colors = {
        gold: 'border-amber-500/70 bg-stone-950/95 text-amber-200',
        green: 'border-emerald-500/70 bg-stone-950/95 text-emerald-200',
        red: 'border-red-500/70 bg-stone-950/95 text-red-200'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl text-xs sm:text-sm font-medium animate-fade-in ${colors[type] || colors.gold}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 3400);
    }

    function triggerDramaticStamp(title, subtitle, color = 'crimson', soundType = 'objection', callback = null, evId = null) {
      const overlay = document.getElementById('dramatic-overlay');
      const content = document.getElementById('dramatic-content');
      const flash = document.getElementById('flash-overlay');
      const appEl = document.getElementById('app');

      if (soundType === 'objection') SoundEngine.playObjection();
      else if (soundType === 'contradiction') SoundEngine.playContradiction();
      else if (soundType === 'gavel') SoundEngine.playGavel(true);
      else if (soundType === 'error') SoundEngine.playError();

      // Screen shake + camera flash
      appEl.classList.add('animate-shake');
      setTimeout(() => appEl.classList.remove('animate-shake'), 450);
      flash.classList.remove('hidden');
      flash.classList.add('animate-flash');
      setTimeout(() => {
        flash.classList.add('hidden');
        flash.classList.remove('animate-flash');
      }, 480);

      const theme = color === 'gold'
        ? 'text-amber-400 border-amber-400 shadow-amber-500/30'
        : color === 'green'
        ? 'text-emerald-400 border-emerald-400 shadow-emerald-500/30'
        : 'text-red-500 border-red-500 shadow-red-600/40';

      const evCardHtml = evId && EVIDENCE_DB[evId]
        ? `
          <div class="mt-5 mx-auto max-w-sm mahogany-card rounded-2xl p-3 text-left animate-fade-in">
            ${getEvidenceVisualSVG(evId)}
            <div class="mt-2 font-serif-display font-bold text-amber-300 text-sm">${EVIDENCE_DB[evId].title}</div>
            <div class="text-xs text-stone-300 mt-0.5">${EVIDENCE_DB[evId].short}</div>
          </div>`
        : '';

      content.innerHTML = `
        <div class="inline-block border-4 ${theme} px-7 py-3.5 rounded-xl bg-black/85 shadow-2xl animate-stamp">
          <div class="font-serif-display text-2xl sm:text-5xl font-extrabold tracking-widest uppercase">${title}</div>
        </div>
        ${subtitle ? `<p class="mt-3 text-sm sm:text-lg text-stone-100 font-medium tracking-wide drop-shadow">${subtitle}</p>` : ''}
        ${evCardHtml}
      `;

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      setTimeout(() => {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        if (callback) callback();
      }, evId ? 2100 : 1450);
    }

    function setPrepTab(tab) {

    function chooseKeremOption(choiceIdx) {
      const s = window.gameState;
      const node = KEREM_DIALOGUES[s.keremStep];
      const choice = node.choices[choiceIdx];
      SoundEngine.playClick();

      s.trust = Math.max(0, Math.min(100, s.trust + choice.trustDelta));
      s.keremLastReply = {
        tag: choice.tag,
        delta: choice.trustDelta,
        reply: choice.reply
      };
      s.keremStep += 1;

      if (s.keremStep >= KEREM_DIALOGUES.length) {
        s.keremDone = true;
        if (s.trust >= 65) unlockKeremLeads();
      }
      saveState();
      render();
    }

    function unlockKeremLeads() {
      const s = window.gameState;
      let added = false;
      if (!s.leads.includes('lead_atm')) { s.leads.push('lead_atm'); added = true; }
      if (!s.leads.includes('lead_scarf')) { s.leads.push('lead_scarf'); added = true; }
      if (added) {
        SoundEngine.playContradiction();
        showToast('Kerem Demir 2 kritik ipucu paylaştı! Araştırma sekmesine bak.', 'green');
      }
    }

    function doKeremExtraTrust() {
      const s = window.gameState;
      if (s.ap < 1) {
        SoundEngine.playError();
        showToast('Ek görüşme için yeterli Eylem Puanı (AP) yok!', 'red');
        return;
      }
      s.ap -= 1;
      s.trust = Math.max(s.trust, 72);
      s.keremExtraDone = true;
      unlockKeremLeads();
      saveState();
      render();
    }

    function runInvestigation(invId) {
      const s = window.gameState;
      const inv = INVESTIGATIONS_DB.find(i => i.id === invId);
      if (!inv || s.investigated.includes(invId)) return;

      if (inv.reqLead && !s.leads.includes(inv.reqLead)) {
        SoundEngine.playError();
        showToast(inv.reqHint || 'Bu araştırma için önce ilgili ipucunu bulmalısın.', 'red');
        return;
      }
      if (s.ap < inv.apCost) {
        SoundEngine.playError();
        showToast(`Yetersiz Eylem Puanı! (${inv.apCost} AP gerekli)`, 'red');
        return;
      }
      if (s.budget < inv.budgetCost) {
        SoundEngine.playError();
        showToast(`Yetersiz Büro Bütçesi! (${inv.budgetCost.toLocaleString('tr-TR')} TL gerekli)`, 'red');
        return;
      }

      s.ap -= inv.apCost;
      s.budget -= inv.budgetCost;
      s.investigated.push(invId);
      if (!s.evidence.includes(inv.unlocksEv)) s.evidence.push(inv.unlocksEv);

      SoundEngine.playContradiction();
      saveState();
      render();

      const ev = EVIDENCE_DB[inv.unlocksEv];
      openModal(`
        <div class="parchment-card rounded-2xl p-6 max-w-xl mx-auto">
          <div class="flex items-center justify-between border-b border-stone-300 pb-3 mb-4">
            <div>

    }

    function beginTrial() {
      closeModal();
      Typewriter.stop();
      const s = window.gameState;
      s.phase = 'trial';
      s.trial.stage = 0;
      s.trial.kanaat = 25;
      s.trial.credibility = 5;
      setupTrialStage(0);
      saveState();
      triggerDramaticStamp('DURUŞMA BAŞLIYOR', 'İstanbul 14. Ağır Ceza Mahkemesi — 2026/418 E.', 'gold', 'gavel', () => render());
    }

    function adjustKanaat(delta) {
      const t = window.gameState.trial;
      t.kanaat = Math.max(0, Math.min(100, t.kanaat + delta));
    }

    function penalizeCredibility(amount = 1) {
      const t = window.gameState.trial;
      t.credibility = Math.max(0, t.credibility - amount);
      if (t.credibility <= 0) {
        saveState();
        triggerDramaticStamp('USUL İHLALİ!', 'Mahkeme Başkanı savunma heyetine ihtar vererek oturumu kapattı!', 'crimson', 'gavel', () => {
          window.gameState.phase = 'verdict';
          saveState();
          render();
        });
        return true;
      }
      return false;
    }

          t.dialogueText = 'Sayın Başkan... Av. Kaan’ın sunduğu adli bilişim ve adli tıp verileri karşısında maddi gerçeğin değiştiğini görüyoruz. Takdir Sayın Heyetindir.';

          t.speakerMood = 'gergin';
          t.speakerMoodLabel = 'Gergin';

    function handleStage0Objection(mode) {
      const s = window.gameState;
      const t = s.trial;

      if (mode === 'valid') {
        t.whatsappExcluded = true;
        t.legalObjectionsSuccess += 1;
        adjustKanaat(15);
        t.subStep = 'after';
        t.speaker = 'hakim';
        t.speakerName = 'Mahkeme Başkanı';
        t.speakerRole = 'Ara Karar';
        t.speakerMood = 'emin';
        t.speakerMoodLabel = 'Etkilenmiş';
        t.dialogueText = 'Av. Kaan haklıdır! Maktulün telefonundan hakim kararı (CMK m. 134) olmaksızın alınan WhatsApp ekran görüntüsü hukuka aykırı delil niteliğindedir. CMK m. 206/2-a gereğince DOSYADAN ÇIKARILMASINA karar verildi! (+%15 Heyet Kanaati)';
        saveState();
        triggerDramaticStamp('İTİRAZ EDİYORUM!', 'CMK m. 206/2-a — Hukuka Aykırı Delil Reddedildi', 'green', 'objection', () => render(), 'ev_tutanak');
      } else if (mode === 'weak') {
        adjustKanaat(-5);
        if (penalizeCredibility(1)) return;
        t.subStep = 'after';
        t.speaker = 'savci';
        t.speakerName = 'Cumhuriyet Savcısı';
        t.speakerRole = 'İddia Makamı';
        t.speakerMood = 'emin';
        t.speakerMoodLabel = 'Küçümseyici';
        t.dialogueText = 'Sayın Başkan, Av. Kaan somut bir usulsüzlük tutanağı veya CMK maddesi göstermeden soyut itirazda bulunuyor! İtirazın reddini talep ediyorum. (-1 İtibar, -%5 Kanaat)';
        saveState();
        triggerDramaticStamp('İTİRAZ REDDEDİLDİ', 'Somut belge veya CMK 206 maddesi sunulmadı', 'crimson', 'error', () => render());
      } else {
        adjustKanaat(-10);
        t.subStep = 'after';
        t.speaker = 'hakim';
        t.speakerName = 'Mahkeme Başkanı';
        t.speakerRole = '14. Ağır Ceza Heyeti';
        t.speakerMood = 'normal';
        t.speakerMoodLabel = 'Ciddi';
        t.dialogueText = 'Savunma makamı (Av. Kaan) WhatsApp deliline itiraz etmedi. Tehdit içerikli mesaj dosyada geçerli delil olarak bırakıldı. (-%10 Heyet Kanaati)';
        SoundEngine.playGavel(false);
        saveState();
        render();
      }
    }

    function handleDefenseStrategy(strategy) {
      const t = window.gameState.trial;
      t.defenseStrategy = strategy;
      t.subStep = 'after';

      if (strategy === 'honest') {
        adjustKanaat(10);
        t.speaker = 'kerem';
        t.speakerName = 'Kerem Demir';
        t.speakerRole = 'Sanık';
        t.speakerMood = 'emin';
        t.speakerMoodLabel = 'Kararlı';
        t.dialogueText = 'Sayın Başkan, gizleyecek bir şeyim yok. 23:20’de liman ofisindeydim, sahte gümrük belgeleri yüzünden tartıştık. Beni itince kırılan bardak elimi kesti. 23:28’de çıktım. Onu ben öldürmedim! (+%10 Kanaat)';
        SoundEngine.playGavel(false);
      } else if (strategy === 'deny') {
        adjustKanaat(-15);
        if (penalizeCredibility(1)) return;
        t.speaker = 'savci';
        t.speakerName = 'Cumhuriyet Savcısı';
        t.speakerRole = 'İddia Makamı';
        t.speakerMood = 'ofkeli';
        t.speakerMoodLabel = 'Zafer Kazanmış';
        t.dialogueText = 'İtiraz ediyorum! Sanık ofise hiç gitmediğini söylüyor ama olay yerindeki kırık bardakta kendi DNA’sı var! Bu bariz bir yalandır Sayın Başkan! (-1 İtibar, -%15 Kanaat)';
        saveState();
        triggerDramaticStamp('SAVCI İTİRAZI!', 'Tam inkar stratejisi DNA bulgusuyla çelişti!', 'crimson', 'error', () => render());
        return;
      } else {
        adjustKanaat(-5);
        t.speaker = 'kerem';
        t.speakerName = 'Kerem Demir';
        t.speakerRole = 'Sanık';
        t.speakerMood = 'gergin';
        t.speakerMoodLabel = 'Üzgün';
        t.dialogueText = 'Haluk Bey beni ağır şekilde tehdit etti, üzerime yürüdü... Ama ben onu öldürmedim Sayın Başkan. (Haksız tahrik vurgusu beraat algısını zayıflattı ancak indirim kapısını araladı. -%5 Kanaat)';
        SoundEngine.playClick();
      }
      saveState();
      render();
    }

    function navStatement(delta) {
      const t = window.gameState.trial;
      const exam = CROSS_EXAMS[t.activeExam];
      if (!exam) return;
      SoundEngine.playClick();
      const len = exam.statements.length;
      t.statementIdx = (t.statementIdx + delta + len) % len;
      const st = exam.statements[t.statementIdx];
      t.dialogueText = st.text;
      t.speakerMood = st.mood || 'normal';
      saveState();
      render();
    }

    function pressWitness() {
      const t = window.gameState.trial;
      const exam = CROSS_EXAMS[t.activeExam];
      if (!exam) return;
      const st = exam.statements[t.statementIdx];
      t.pressedMap[`${t.activeExam}_${t.statementIdx}`] = true;
      SoundEngine.playPaper();

      const hasCmk201 = window.gameState.laws.includes('law_cmk201');
      openModal(`
        <div class="mahogany-card rounded-2xl p-6 max-w-xl mx-auto">
          <div class="flex items-center justify-between border-b border-amber-500/20 pb-3 mb-4">

          </div>
          <p class="text-sm sm:text-base text-stone-200 whitespace-pre-line leading-relaxed mb-4">${st.press}</p>
          ${st.isTarget
            ? `<div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/40 text-xs text-amber-200">💡 İpucu: Tanığın bu ifadesinde ciddi bir çelişki var! <strong>İTİRAZ EDİYORUM! (Delil Sun)</strong> butonuna basıp doğru delili göster.</div>`
            : `<div class="p-3 rounded-xl bg-stone-800/80 border border-stone-700 text-xs text-stone-400">Bu ifadede doğrudan bir çelişki görünmüyor. Diğer ifadelere geçip tanığın açığını ara.</div>`
          }
        </div>
      `);
      saveState();
      render();
    }

    function submitLawInExam(lawId) {
      closeModal();
      const t = window.gameState.trial;
      if (lawId === 'law_cmk201') {
        t.legalObjectionsSuccess += 1;
        adjustKanaat(4);
        SoundEngine.playObjection();
        showToast('CMK m. 201 ile tanık üzerinde usul baskısı kuruldu! (+%4 Kanaat)', 'green');
        saveState();
        pressWitness();
      } else if (lawId === 'law_cmk223') {
        SoundEngine.playClick();
        showToast('CMK m. 223/2-e (Şüpheden Sanık Yararlanır) kapanış savunmasında en güçlü etkisini gösterir.', 'gold');
      } else {
        adjustKanaat(-3);
        if (penalizeCredibility(1)) return;
        triggerDramaticStamp('SAVCI İTİRAZI!', 'Bu kanun maddesi mevcut tanık ifadesiyle doğrudan ilgili değil! (-1 İtibar)', 'crimson', 'error', () => render());
      }
    }

    function submitEvidenceInExam(evId) {
      closeModal();
      const t = window.gameState.trial;
      const exam = CROSS_EXAMS[t.activeExam];
      const st = exam.statements[t.statementIdx];

      if (st.isTarget && st.validEvidence.includes(evId)) {
        t.contradictionsCaught += 1;
        adjustKanaat(20);

        if (t.activeExam === 'riza') t.rizaBroken = true;
        if (t.activeExam === 'hakan') t.hakanBroken = true;
        if (t.activeExam === 'selinA') t.selinExposedPartA = true;
        if (t.activeExam === 'selinB') t.selinExposedPartB = true;

        t.subStep = 'after';
        t.speaker = 'avukat';
        t.speakerName = 'Av. Kaan';
        t.speakerRole = 'Sanık Müdafii';
        t.speakerMood = 'emin';
        t.speakerMoodLabel = 'Zafer';
        t.dialogueText = `${st.successText} (+%20 Heyet Kanaati)`;

        saveState();
        triggerDramaticStamp(st.successTitle, 'Av. Kaan Çelişkiyi Yakaladı!', 'gold', 'contradiction', () => render(), evId);
      } else {
        adjustKanaat(-5);
        if (penalizeCredibility(1)) return;
        saveState();
        triggerDramaticStamp('SAVCI İTİRAZI!', 'Sunulan delil bu ifadeyle çelişmiyor! (-1 İtibar, -%5 Kanaat)', 'crimson', 'error', () => render());
      }
    }

    function skipCurrentExam() {
      const t = window.gameState.trial;
      SoundEngine.playGavel(false);
      adjustKanaat(-5);
      t.subStep = 'after';
      t.speaker = 'hakim';
      t.speakerName = 'Mahkeme Başkanı';
      t.speakerRole = '14. Ağır Ceza Heyeti';
      t.speakerMood = 'normal';
      t.speakerMoodLabel = 'Ciddi';
      t.dialogueText = 'Savunma makamı tanığa başka soru yöneltmedi. Tanık ifadesi mevcut haliyle tutanağa geçirildi. (-%5 Heyet Kanaati)';
      saveState();
      render();
    }

    function advanceTrialStage() {
      SoundEngine.playClick();
      const t = window.gameState.trial;
      if (t.stage === 4 && t.activeExam === 'selinA' && t.selinExposedPartA) {
        t.activeExam = 'selinB';
        t.subStep = 'exam';
        t.statementIdx = 0;
        t.speaker = 'selin';
        t.speakerName = CROSS_EXAMS.selinB.name;
        t.speakerRole = CROSS_EXAMS.selinB.role;
        t.speakerMood = 'sok';
        t.speakerMoodLabel = 'Panik';
        t.dialogueText = CROSS_EXAMS.selinB.statements[0].text;
        saveState();
        render();
        return;
      }
      if (t.stage < 5) {
        setupTrialStage(t.stage + 1);
        render();
      }
    }

    function chooseClosingArgument(choice) {
      const s = window.gameState;
      const t = s.trial;
      t.closingChoice = choice;

      if (choice === 'beraat_selin' && t.selinExposedPartB) adjustKanaat(10);
      else if (choice === 'beraat_suphe' && s.laws.includes('law_cmk223')) adjustKanaat(8);
      else if (choice === 'haksiz_tahrik' && s.laws.includes('law_tck29')) adjustKanaat(5);

      s.phase = 'verdict';
      saveState();
      triggerDramaticStamp('KARAR AÇIKLANIYOR', 'İstanbul 14. Ağır Ceza Mahkemesi Hükmünü Veriyor...', 'gold', 'gavel', () => {
        const ending = computeEnding();
        SoundEngine.playVerdict(ending.positive);
        render();
      });
    }

    /* =========================================================================
       9. PHASE 3 LOGIC: 5 DISTINCT ENDINGS
       ========================================================================= */
    function computeEnding() {
      const t = window.gameState.trial;

      if (t.credibility <= 0) {
        return {
          id: 'baro',
          positive: false,
          mood: 'ofkeli',
          stamp: 'USULDEN İHTAR',
          stampColor: 'text-red-800',
          title: 'BARO SORUŞTURMASI & DURUŞMANIN ERTELENMESİ',
          rank: 'Usul İhlali',
          verdictLaw: 'CMK m. 203 & Avukatlık Kanunu m. 34',
          summary: 'Duruşma boyunca dayanaksız itirazlar ve çelişkisiz delil sunumları nedeniyle savunma itibarı sıfırlandı. Mahkeme Başkanı Av. Kaan’ı ihtar ederek duruşmayı erteledi ve İstanbul Barosu’na bildirimde bulunulmasına karar verdi. Kerem Demir’in tutukluluk hali devam ediyor.'
        };
      }

      if (t.selinExposedPartB && t.kanaat >= 75 && t.closingChoice === 'beraat_selin') {
        return {
          id: 'legend',
          positive: true,
          mood: 'rahat',
          stamp: 'TAM BERAAT',
          stampColor: 'text-emerald-800',
          title: 'TAM BERAAT & GERÇEK FAİLİN TUTUKLANMASI',
          rank: 'Ağır Ceza Efsanesi',
          verdictLaw: 'CMK m. 223/2-b (Suçun Sanık Tarafından İşlenmediğinin Sabit Olması)',
          summary: 'Sanık Kerem Demir’in üzerine atılı kasten öldürme suçunu İŞLEMEDİĞİ sabit olduğundan BERAATİNE ve derhal TAHLİYESİNE; Av. Kaan’ın duruşmada ortaya koyduğu adli bilişim ve adli tıp delilleri ışığında gerçek fail olduğu anlaşılan Selin Karahan hakkında kasten öldürme ve nitelikli dolandırıcılık suçlarından derhal tutuklama istemiyle suç duyurusunda bulunulmasına oybirliğiyle karar verildi!'
        };
      }

      if (t.kanaat >= 60 && t.closingChoice !== 'haksiz_tahrik') {
        return {
          id: 'acquittal',
          positive: true,
          mood: 'rahat',
          stamp: 'BERAAT',
          stampColor: 'text-emerald-800',
          title: 'BERAAT (ŞÜPHEDEN SANIK YARARLANIR)',
          rank: 'Usta Müdafi',
          verdictLaw: 'CMK m. 223/2-e (Yüklenen Suçun Sabit Olmaması)',
          summary: 'Av. Kaan’ın ortaya koyduğu teknik ve bilimsel çelişkiler karşısında, sanık Kerem Demir’in mahkumiyetine yeter her türlü şüpheden uzak, kesin ve inandırıcı delil elde edilemediğinden CMK m. 223/2-e gereğince BERAATİNE ve tahliyesine karar verildi. Kerem özgürlüğüne kavuştu; ancak Haluk Demirci’nin gerçek katili hâlâ gölgelerde...'
        };
      }

      if ((t.kanaat >= 35 && t.kanaat < 60) || t.closingChoice === 'haksiz_tahrik') {
        return {
          id: 'reduced',
          positive: false,
          mood: 'gergin',
          stamp: 'İNDİRİMLİ CEZA',
          stampColor: 'text-amber-800',
          title: '14 YIL HAPİS CEZASI (HAKSIZ TAHRİK İNDİRİMİ)',
          rank: 'Deneyimli Avukat',
          verdictLaw: 'TCK m. 81 & TCK m. 29 (Haksız Tahrik)',
          summary: 'Mahkeme heyeti sanığın suçsuzluğuna tam kanaat getiremese de maktulün haksız saldırısı ve baskısı altında hareket edildiği gerekçesiyle TCK m. 29 Haksız Tahrik hükümlerini uyguladı. Müebbet hapis cezası 14 yıl hapse indirildi. Kerem Demir müebbetten kurtuldu ama gerçek fail ortaya çıkarılamadı.'
        };
      }

      return {
        id: 'guilty',
        positive: false,
        mood: 'sok',
        stamp: 'MAHKUMİYET',
        stampColor: 'text-red-900',
        title: 'MÜEBBET HAPİS CEZASI (MAHKUMİYET)',
        rank: 'Zorlu Duruşma',
        verdictLaw: 'TCK m. 81/1 (Kasten Öldürme)',
        summary: 'Savcılığın sunduğu deliller çürütülemedi ve heyet nezdinde makul şüphe oluşturulamadı. Sanık Kerem Demir’in kasten öldürme suçundan MÜEBBET HAPİS cezası ile cezalandırılmasına karar verildi. İstinaf yolu açık olmak üzere dosya kapandı.'
      };
    }

    function calculateFinalScore(ending) {
      const s = window.gameState;
      const t = s.trial;
      let score = s.evidence.length * 100 + t.contradictionsCaught * 250 + t.legalObjectionsSuccess * 150 + Math.round(s.trust * 2) + t.credibility * 80 + t.kanaat * 5;
      if (ending.id === 'legend') score += 500;
      else if (ending.id === 'acquittal') score += 250;
      return score;
    }

      const unlockedCount = getUnlockedEndings().length;

        return `
          <nav class="spatial-dock-stage" aria-label="3D Ana Menü Çubuğu">

              <button onmouseenter="Scene3D.setFocus('dossier')" onmouseleave="Scene3D.setFocus('default')" onclick="startNewOrContinue()" class="dock-item active">

                <span class="text-[10px] sm:text-[11px] font-bold mt-1 whitespace-nowrap">${hasSave ? 'Devam Et' : 'Dava Başlat'}</span>
              </button>

    /* =========================================================================
       11. MASTER RENDERING ENGINE
       ========================================================================= */
    function render() {
      Typewriter.stop();
      const s = window.gameState;
      const app = document.getElementById('app');

      if (s.phase === 'title') {
        app.innerHTML = renderTitleScreen() + renderSpatialDock();
        setTimeout(() => Scene3D.mount(), 20);
      } else {
        Scene3D.dispose();
        if (s.phase === 'prep') {
          app.innerHTML = renderTopHUD() + renderPrepPhase() + renderSpatialDock();
          triggerPrepTypewriter();
        } else if (s.phase === 'trial') {
          app.innerHTML = renderTopHUD() + renderTrialPhase() + renderSpatialDock();
          Typewriter.run('trial-dialogue-text', s.trial.dialogueText);
        } else {
          app.innerHTML = renderTopHUD() + renderVerdictPhase() + renderSpatialDock();
        }
      }
    }

    function triggerPrepTypewriter() {
      const s = window.gameState;
      if (s.prepTab === 'kerem') {
        let text = '';
        if (!s.keremDone) {
          text = KEREM_DIALOGUES[s.keremStep].kerem;

        } else {

        }
        Typewriter.run('prep-dialogue-text', text);
      } else if (s.prepTab === 'pier') {
        Typewriter.run('prep-dialogue-text', '14 Ekim gecesi saat 23:40... Yağmurlu liman iskelesindeki Demirci Lojistik ofisinde Haluk Demirci ölü bulundu. Aşağıdaki 3 olay yeri noktasını inceleyerek savunmanı güçlendir.');

        Typewriter.run('prep-dialogue-text', 'Büromuzda 60.000 TL bütçe ve sınırlı Eylem Puanımız var. HTS kayıtları, Adli Bilişim ve Bağımsız Adli Tıp raporları duruşmada savcının tezini yerle bir edecek.');
      }
    }

      return `

          ${tabBody}

      const stageHtml = renderVisualStage({
        sceneId: 'prison',

        speakerName: 'Kerem Demir (32)',

        moodLabel,
        dialogueText: '',

              <div class="p-3.5 rounded-xl bg-stone-900/90 text-stone-100 text-center">
                <div class="text-[11px] text-stone-400">Müvekkil Güveni</div>
                <div class="font-bold text-base mt-0.5">%${s.trust}</div>
              </div>
            </div>

            <!-- 5 Endings Tracker -->
            <div class="mb-7 p-4 rounded-2xl bg-stone-900/10 border border-stone-800/20">
              <div class="flex items-center justify-between text-xs font-bold uppercase tracking-wider text-stone-700 mb-2.5">
                <span>Açılan Gerekçeli Karar Sonları</span>
                <span>${unlockedEndings.length} / ${ALL_ENDINGS_META.length}</span>
              </div>
              <div class="flex flex-wrap gap-2">
                ${ALL_ENDINGS_META.map(item => {
                  const isUnlocked = unlockedEndings.includes(item.id);
                  const isCurrent = item.id === ending.id;
                  return `
                    <span class="text-xs px-3 py-1 rounded-full border font-semibold ${
                      isCurrent ? 'bg-amber-600 text-white border-amber-700'
                      : isUnlocked ? 'bg-emerald-800/15 text-emerald-900 border-emerald-800/35'
                      : 'bg-stone-800/10 text-stone-500 border-stone-800/15'
                    }">
                      ${isUnlocked ? '✓' : '🔒'} ${item.label}
                    </span>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Signature Block -->
            <div class="flex items-center justify-between border-t border-stone-800/20 pt-4 text-xs text-stone-700 font-legal">
              <div>
                <div class="font-bold">Sanık Müdafii</div>
                <div class="font-serif-display italic text-base text-stone-900 mt-0.5">Av. Kaan</div>
              </div>
              <div class="text-right">
                <div class="font-bold">Mahkeme Başkanı</div>
                <div class="italic text-stone-600 mt-0.5">14. Ağır Ceza Heyeti</div>
              </div>
            </div>
          </div>
        </main>
      `;
    }

    // Boot Application
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
