      const tabsHtml = `
        <div class="flex gap-1.5 mb-3 bg-amber-900/10 p-1 rounded-xl">
          <button data-shoptab="animals" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition ${tab === 'animals' ? 'bg-amber-500 text-white shadow' : 'text-amber-900 hover:bg-amber-200/50'}">🐔 Hayvanlar</button>
          <button data-shoptab="buildings" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition ${tab === 'buildings' ? 'bg-amber-500 text-white shadow' : 'text-amber-900 hover:bg-amber-200/50'}">🌬️ Yapılar</button>
          <button data-shoptab="decos" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition ${tab === 'decos' ? 'bg-amber-500 text-white shadow' : 'text-amber-900 hover:bg-amber-200/50'}">🌴 Dekorasyon</button>
        </div>
      `;

      let list = [], cat = 'animal';
      if (tab === 'animals') { list = Object.values(ANIMALS); cat = 'animal'; }
      else if (tab === 'buildings') { list = Object.values(BUILDINGS).filter(b => !b.fixed); cat = 'building'; }
      else { list = Object.values(DECOS); cat = 'deco'; }

      const cardsHtml = list.map(item => {
        const locked = state.level < item.minLevel;
        const currIcon = item.currency === 'pearls' ? '🦪' : '🪙';
        const canAfford = item.currency === 'pearls' ? state.pearls >= item.cost : state.coins >= item.cost;
        const extra = item.prodSec ? `<span class="text-[11px] text-emerald-700 font-semibold">${item.productIcon || '💵'} ${item.prodSec}sn → ${item.sell}🪙</span>` : `<span class="text-[11px] text-amber-700 font-semibold">+${item.xp} TP</span>`;
        return `
          <div class="flex items-center justify-between gap-3 p-3 rounded-2xl bg-white/85 border border-amber-300/80 shadow-sm ${locked ? 'opacity-60' : ''}">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center text-2xl shrink-0">${item.icon}</div>
              <div>
                <div class="font-extrabold text-sm text-amber-950">${item.name}</div>
                <div class="text-[11px] text-amber-900/75 leading-snug">${item.desc}</div>
                <div class="mt-0.5">${extra}</div>
              </div>
            </div>
            ${locked
              ? `<span class="px-2.5 py-1.5 rounded-xl bg-amber-200/70 text-amber-900 text-[11px] font-bold shrink-0">🔒 Svy ${item.minLevel}</span>`
              : `<button data-buy-cat="${cat}" data-buy-id="${item.id}" class="px-3 py-2 rounded-xl font-extrabold text-xs shrink-0 transition ${canAfford ? 'bg-gradient-to-b from-emerald-500 to-emerald-600 text-white shadow hover:brightness-105 active:scale-95' : 'bg-slate-200 text-slate-500'}">${item.cost} ${currIcon}</button>`
            }
          </div>
        `;
      }).join('');

      openModal('🏡 Çiftlik Mağazası', `${tabsHtml}<div class="flex flex-col gap-2.5">${cardsHtml}</div>`, () => {
        modalBody.querySelectorAll('[data-shoptab]').forEach(btn => {
          btn.addEventListener('click', () => { Sound.click(); openShopModal(btn.dataset.shoptab); });
        });
        modalBody.querySelectorAll('[data-buy-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            const category = btn.dataset.buyCat, id = btn.dataset.buyId;
            const catalog = category === 'animal' ? ANIMALS : category === 'building' ? BUILDINGS : DECOS;
            const def = catalog[id];
            const canAfford = def.currency === 'pearls' ? state.pearls >= def.cost : state.coins >= def.cost;
            if (!canAfford) { Sound.error(); showToast('Bunun için yeterli bakiyen yok!', 'error'); return; }
            Sound.click();
            placingItem = { category, id };
            setTool('place');
            closeModal();
            showToast(`${def.icon} ${def.name} yerleştirmek için boş bir çimen kareye tıkla!`, 'info');
          });
        });
      });
    }

    function getMarketPrice(id) {
      const base = ITEMS[id]?.sell || 20;
      const supply=state.barn[id]||0; const demand=(id===hotItemId?1.5:1)*(seasonIdx===0?1.12:1); return Math.round(base*Math.max(.55,Math.min(2.2,demand*Math.pow(1+supply/15,-.35))));
    }

    function openBarnModal() {
      const entries = Object.entries(state.barn).filter(([, qty]) => qty > 0);
      let totalVal = 0;
      entries.forEach(([id, qty]) => { totalVal += getMarketPrice(id) * qty; });
      const hotDef = ITEMS[hotItemId] || ITEMS.papaya;

      const hotBanner = `
        <div class="mb-3 p-2.5 rounded-2xl bg-gradient-to-r from-amber-100 to-orange-100 border border-amber-400 flex items-center justify-between text-xs">
          <div class="font-extrabold text-amber-950">📈 Pazar Borsası — Günün Yıldızı: ${hotDef.icon} ${hotDef.name}</div>
          <span class="px-2 py-0.5 rounded-full bg-orange-500 text-white font-extrabold">+%50 Fiyat!</span>
        </div>
      `;

      const listHtml = entries.length === 0
        ? `<div class="text-center py-8 text-amber-800/70 text-sm font-semibold">Ambarın şu an boş. Ekin hasat et, balık tut veya atölyede ürün üret! 🌾</div>`
        : `<div class="flex flex-col gap-2">${entries.map(([id, qty]) => {
            const item = ITEMS[id] || { name: id, icon: '📦', sell: 20 };
            const price = getMarketPrice(id);
            const isHot = id === hotItemId;
            return `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-2xl bg-white/85 border ${isHot ? 'border-orange-400 shadow-sm' : 'border-amber-300/80'}">
                <div class="flex items-center gap-2.5">
                  <span class="text-2xl">${item.icon}</span>
                  <div>
                    <div class="font-bold text-sm">${item.name} <span class="text-amber-700">×${qty}</span> ${isHot ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-orange-500 text-white">+%50</span>' : ''}</div>
                    <div class="text-[11px] text-amber-800/75">Birim satış: ${price} 🪙</div>
                  </div>
                </div>
                <div class="flex items-center gap-1 flex-wrap justify-end">
                  ${item.energyRestore ? `<button data-eat-item="${id}" class="px-2 py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 border border-sky-300 text-sky-900 font-bold text-xs transition" title="Yiyerek Enerji Yenile">🍽️ +${item.energyRestore}⚡</button>` : ''}
                  <button data-sell-one="${id}" class="px-2 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-950 font-bold text-xs transition">1 Sat (${price}🪙)</button>
                  <button data-sell-all-item="${id}" class="px-2 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs transition">Hepsi</button>
                </div>
              </div>
            `;
          }).join('')}</div>`;

      const footerHtml = entries.length > 0
        ? `<div class="mt-4 pt-3 border-t border-amber-300 flex items-center justify-between">
            <span class="text-xs font-bold text-amber-900">Toplam Değer: ${totalVal} 🪙</span>
            <button id="btnSellEverything" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold text-xs shadow hover:brightness-105 active:scale-95 transition">Tüm Ambarı Sat (+${totalVal} 🪙)</button>
          </div>` : '';

      openModal('🏚️ Çiftlik Ambarı & Pazar', `${hotBanner}${listHtml}${footerHtml}`, () => {
        modalBody.querySelectorAll('[data-sell-one]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.sellOne;
            if ((state.barn[id] || 0) > 0) {
              state.barn[id] -= 1; state.coins += getMarketPrice(id); Sound.coin(); updateHUD(); saveState(); openBarnModal();
            }
          });
        });
        modalBody.querySelectorAll('[data-sell-all-item]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.sellAllItem, qty = state.barn[id] || 0;
            if (qty > 0) {
              state.barn[id] = 0; state.coins += getMarketPrice(id) * qty; Sound.coin(); updateHUD(); saveState(); openBarnModal();
            }
          });
        });
        modalBody.querySelectorAll('[data-eat-item]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.eatItem;
            if ((state.barn[id] || 0) > 0) {
              state.barn[id] -= 1;
              const gain = ITEMS[id].energyRestore || 12;
              state.energy = Math.min(state.maxEnergy, state.energy + gain);
              Sound.harvest();
              showToast(`🍽️ ${ITEMS[id].name} yendi! +${gain} Enerji ⚡`, 'success');
              updateHUD(); saveState(); openBarnModal();
            }
          });
        });
        const sellAllBtn = document.getElementById('btnSellEverything');
        if (sellAllBtn) {
          sellAllBtn.addEventListener('click', () => {
            state.coins += totalVal; state.barn = {}; Sound.coin();
            showToast(`Tüm ürünler satıldı! +${totalVal} Altın 🪙`, 'success');
            updateHUD(); saveState(); openBarnModal();
          });
        }
      });
    }

    function canFulfillOrder(order) {
      return Object.entries(order.reqs).every(([id, qty]) => (state.barn[id] || 0) >= qty);
    }

      } else if (tab === 'boat') {

                  <div class="text-[11px] ${have >= c.qty || c.filled ? 'text-emerald-700' : 'text-rose-700'} font-semibold">${c.filled ? '✅ Sandık Yüklendi!' : `Ambarda: ${have}/${c.qty}`}</div>

        contentHtml = `

          const cur = Math.min(a.target, state.stats[a.stat] || 0);

          const claimed = !!state.claimedAchievements[a.id];
          return `
            <div class="p-3 rounded-2xl bg-white/85 border ${done && !claimed ? 'border-amber-400 shadow' : 'border-amber-200'} flex items-center justify-between gap-2">

                <div class="mt-1 w-full h-1.5 bg-amber-900/15 rounded-full overflow-hidden">
                  <div class="h-full bg-emerald-500" style="width:${(cur / a.target) * 100}%"></div>
                </div>
              </div>
              ${claimed
                ? `<span class="px-2.5 py-1 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-bold">Alındı ✓</span>`
                : done
                ? `<button data-claim-ach="${a.id}" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold text-xs shadow">+${a.rewardPearls}🦪 +${a.rewardCoins}🪙</button>`

            state.coins += ord.rewardCoins; state.pearls += ord.rewardPearls; state.stats.ordersDone += 1;
            addXp(ord.rewardXp, 4.5, 4.5);
            state.orders[idx] = generateOrder(state.level, idx + state.stats.ordersDone);

          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.fillCrate), c = state.boat.crates[idx];

          });

          launchBtn.addEventListener('click', () => {
            if (!state.boat.crates.every(c => c.filled)) return;
            const b = state.boat;
            state.coins += b.rewardCoins; state.pearls += b.rewardPearls; state.fertilizer += b.rewardFert;
            state.stats.ordersDone += 1;
            addXp(b.rewardXp, 6, 5);
            state.boat = generateBoatOrder(state.level);
            Sound.levelUp(); advanceQuest('complete_order');
            showToast(`⛵ Kargo Teknesi uğurlandı! +${b.rewardCoins}🪙 +${b.rewardPearls}🦪 +${b.rewardFert}🧪`, 'success');
            updateHUD(); saveState(); openOrdersModal('boat');
          });

        modalBody.querySelectorAll('[data-claim-ach]').forEach(btn => {
          btn.addEventListener('click', () => {
            const a = ACHIEVEMENTS.find(x => x.id === btn.dataset.claimAch);
            if (!a || state.claimedAchievements[a.id]) return;

            Sound.levelUp();
            showToast(`🏆 Başarım ödülü alındı! +${a.rewardPearls}🦪 +${a.rewardCoins}🪙`, 'success');
            updateHUD(); saveState(); openOrdersModal('achievements');
          });
        });
      });

    // ==================== CRAFTING WORKSHOP MODAL (HAY DAY / FARMVILLE 2) ====================
    function openCraftModal() {
      const now = Date.now();
      const queueHtml = state.craftQueue.length === 0
        ? `<div class="text-xs text-amber-800/75 font-semibold py-2">Üretim sırası boş. Aşağıdan tarif seçip hemen pişirmeye başla!</div>`
        : `<div class="flex flex-wrap gap-2">${state.craftQueue.map((q, idx) => {
            const r = RECIPES.find(x => x.id === q.recipeId);
            const ready = now >= q.readyAt;

            return ready
              ? `<button data-collect-craft="${idx}" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold text-xs shadow animate-pulse">${r.icon} ${r.name} Al! ✓</button>`
              : `<span class="px-3 py-1.5 rounded-xl bg-amber-100 border border-amber-300 text-amber-950 font-bold text-xs">${r.icon} ${r.name} (${left}s)</span>`;
          }).join('')}</div>`;

      const recipesHtml = RECIPES.map(r => {
        const canCraft = Object.entries(r.reqs).every(([id, qty]) => (state.barn[id] || 0) >= qty);
        const reqsStr = Object.entries(r.reqs).map(([id, qty]) => {
          const it = ITEMS[id] || { name: id, icon: '📦' };
          const ok = (state.barn[id] || 0) >= qty;
          return `<span class="px-1.5 py-0.5 rounded-md text-[11px] font-bold ${ok ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}">${it.icon} ${state.barn[id] || 0}/${qty}</span>`;
        }).join(' ');
        return `
          <div class="p-3 rounded-2xl bg-white/85 border border-amber-300/80 flex items-center justify-between gap-2">
            <div>
              <div class="font-extrabold text-sm">${r.icon} ${r.name} <span class="text-[11px] text-amber-700 font-bold">(${r.sec}sn · ${r.sell}🪙 · +${r.energy}⚡)</span></div>
              <div class="mt-1.5 flex flex-wrap gap-1">${reqsStr}</div>
            </div>
            <button data-start-craft="${r.id}" class="px-3 py-2 rounded-xl font-extrabold text-xs shrink-0 transition ${canCraft ? 'bg-gradient-to-b from-amber-500 to-orange-500 text-white shadow hover:brightness-105' : 'bg-slate-200 text-slate-500'}">Üret 🍳</button>
          </div>
        `;
      }).join('');

      openModal('🍞 Köy Fırını & Üretim Atölyesi', `
        <div class="p-3 rounded-2xl bg-amber-100/80 border border-amber-300 mb-3">
          <div class="text-[11px] font-extrabold uppercase tracking-wider text-amber-800 mb-1.5">🔥 Aktif Üretim Sırası</div>
          ${queueHtml}
        </div>
        <div class="flex flex-col gap-2.5">${recipesHtml}</div>
      `, () => {
        modalBody.querySelectorAll('[data-start-craft]').forEach(btn => {
          btn.addEventListener('click', () => {
            const r = RECIPES.find(x => x.id === btn.dataset.startCraft);
            const ok = Object.entries(r.reqs).every(([id, qty]) => (state.barn[id] || 0) >= qty);
            if (!ok) { Sound.error(); showToast('Gerekli malzemeler ambarında yok!', 'error'); return; }
            if (state.craftQueue.length >= 4) { Sound.error(); showToast('Üretim sırası dolu (en fazla 4 ürün).', 'error'); return; }
            Object.entries(r.reqs).forEach(([id, qty]) => { state.barn[id] -= qty; });
            state.craftQueue.push({ recipeId: r.id, readyAt: Date.now() + r.sec * 1000 });
            Sound.plant();
            showToast(`${r.icon} ${r.name} pişmeye başladı!`, 'info');
            updateHUD(); saveState(); openCraftModal();
          });
        });
        modalBody.querySelectorAll('[data-collect-craft]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.collectCraft);
            const q = state.craftQueue[idx];
            if (!q || Date.now() < q.readyAt) return;
            const r = RECIPES.find(x => x.id === q.recipeId);
            state.craftQueue.splice(idx, 1);
            state.barn[r.id] = (state.barn[r.id] || 0) + 1;
            state.stats.crafted += 1;
            addXp(r.xp, 4.5, 4.5);
            Sound.harvest();
            showToast(`+1 ${r.icon} ${r.name} ambara eklendi!`, 'success');
            updateHUD(); saveState(); openCraftModal();
          });
        });
      });
    }

    // ==================== BATCH HARVEST ALL ====================
    function harvestAllReady() {
      Sound.init();
      const now = Date.now();
      let count = 0;
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const t = state.grid[y][x];
          if (!t.unlocked) continue;
          if (t.type === 'soil' && t.crop && getCropProgress(t.crop, now) >= 1) {
            if (state.energy <= 0) break;
            harvestCrop(t, x, y);
            count++;
          } else if (t.type === 'animal' && t.entity && getEntityProgress(t.entity, now) >= 1) {
            if (state.energy <= 0) break;
            const aDef = ANIMALS[t.entity.id];
            state.energy -= 1; t.entity.lastCollectAt = now;
            state.barn[aDef.productId] = (state.barn[aDef.productId] || 0) + 1;
            addXp(aDef.xp, x, y); addFloatText(x, y, `+1 ${aDef.productIcon}`, '#fef08a');
            count++;
          } else if (t.type === 'building' && t.entity && getEntityProgress(t.entity, now) >= 1) {
            const bDef = BUILDINGS[t.entity.id];
            if(!consumeBuildingInputs(bDef.id))continue;
            t.entity.lastCollectAt = now;
            if (bDef.id === 'farmhouse' || bDef.id === 'bungalow') {
              const cGain = bDef.id === 'farmhouse' ? (30 + state.level * 10) : bDef.sell;
              state.coins += cGain; addFloatText(x, y, `+${cGain}🪙`, '#fde047');
            } else if (bDef.productId) {
              state.barn[bDef.productId] = (state.barn[bDef.productId] || 0) + 1;
              addXp(bDef.xp, x, y); addFloatText(x, y, `+1 ${bDef.productIcon}`, '#fef08a');
            }
            count++;
          }
        }
      }
      if (count > 0) {
        Sound.levelUp();
        showToast(`✨ ${count} ürün işlendi veya görev kuyruğuna eklendi!`, 'success');
        updateHUD(); saveState();
      }
    }

    // ==================== HUD & TOOLBAR SYNC ====================
    function setTool(tool) {
      activeTool = tool;
      if (tool !== 'place') placingItem = null;
      document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });
      const tray = document.getElementById('seedTray');
      if (tool === 'plant') { renderSeedTray(); tray.classList.remove('hidden'); }
      else tray.classList.add('hidden');
      document.getElementById('canvasContainer').classList.toggle('tool-active', tool !== 'hand');
    }

    function renderSeedTray() {
      const tray = document.getElementById('seedTray');
      tray.innerHTML = '<button class="seed-close" aria-label="Tohum menüsünü kapat">✕</button>'+Object.values(CROPS).map(c => {
        const locked = state.level < c.minLevel, active = selectedSeed === c.id;
        return `
          <button data-seed="${c.id}" class="flex flex-col items-center px-2.5 py-1.5 rounded-xl border-2 shrink-0 transition ${active ? 'bg-amber-300 border-amber-700 shadow' : 'bg-white/85 border-amber-200 hover:bg-amber-100'} ${locked ? 'opacity-50' : ''}">
            <span class="text-lg leading-none">${c.icon}</span>
            <span class="text-[10px] font-extrabold text-amber-950 mt-0.5">${c.name}</span>
            <span class="text-[9px] font-bold ${locked ? 'text-rose-700' : 'text-amber-800'}">${locked ? '🔒 Svy ' + c.minLevel : c.cost + '🪙 · ' + c.growSec + 's'}</span>
          </button>
        `;
      }).join('');
      tray.querySelector('.seed-close').onclick=()=>setTool('hand');
      tray.querySelectorAll('[data-seed]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.seed;
          if (state.level < CROPS[id].minLevel) { Sound.error(); showToast(`${CROPS[id].name} Seviye ${CROPS[id].minLevel}'de açılır.`, 'error'); return; }
          Sound.click(); selectedSeed = id; renderSeedTray();
        });
      });
    }

    function updateHUD() {
      const xpNeed = xpNeededForLevel(state.level);
      document.getElementById('hudLevelBadge').textContent = state.level;
      document.getElementById('hudXpBar').style.width = `${Math.min(100, (state.xp / xpNeed) * 100)}%`;
      document.getElementById('hudXpText').textContent = `${state.xp}/${xpNeed} TP`;
      document.getElementById('hudCoins').textContent = state.coins.toLocaleString('tr-TR');
      document.getElementById('hudPearls').textContent = state.pearls;
      document.getElementById('hudEnergy').textContent = `${state.energy}/${state.maxEnergy}`;

      const barnTotal = Object.values(state.barn).reduce((s, n) => s + (n || 0), 0);
      document.getElementById('barnCountBadge').textContent = barnTotal;
      const fertEl = document.getElementById('hudFertCount');
      if (fertEl) fertEl.textContent = state.fertilizer || 0;
      const wheelDot = document.getElementById('wheelFreeDot');
      if (wheelDot) {
        wheelDot.textContent = state.freeSpins || 0;
        wheelDot.classList.toggle('hidden', !(state.freeSpins > 0));
      }
      const craftReady = (state.craftQueue || []).some(q => Date.now() >= q.readyAt);
      const cDot = document.getElementById('craftReadyDot');
      if (cDot) cDot.classList.toggle('hidden', !craftReady);

      const anyBoatReady = (state.boat?.crates || []).some(c => !c.filled && (state.barn[c.itemId] || 0) >= c.qty);
      const anyAchReady = ACHIEVEMENTS.some(a => !state.claimedAchievements[a.id] && (state.stats[a.stat] || 0) >= a.target);
      document.getElementById('ordersReadyDot').classList.toggle('hidden', !(state.orders.some(canFulfillOrder) || anyBoatReady || anyAchReady));

      // Count ready harvestables for Batch Harvest button
      const nowH = Date.now();
      let readyCount = 0;
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const t = state.grid[y][x];
          if (!t.unlocked) continue;
          if (t.type === 'soil' && t.crop && getCropProgress(t.crop, nowH) >= 1) readyCount++;
          else if ((t.type === 'animal' || t.type === 'building') && t.entity && getEntityProgress(t.entity, nowH) >= 1) readyCount++;
        }
      }
      const hBtn = document.getElementById('btnHarvestAll');
      if (hBtn) {
        hBtn.classList.toggle('hidden', readyCount < 2);
        const hLbl = document.getElementById('harvestAllLabel');
        if (hLbl) hLbl.textContent = `Hepsini Topla (${readyCount})`;
      }

      const qCard = document.getElementById('questCard');
      const q = QUESTS[state.questIndex];
      if (!q) {
        qCard.classList.remove('quest-ready');
        document.getElementById('questIndexBadge').textContent = 'Tamam!';
        document.getElementById('questTitle').textContent = '🏆 Ada Ustası! Tüm başlangıç görevleri tamamlandı.';
        document.getElementById('questRewardBadge').textContent = '⭐';
        document.getElementById('questProgressBar').style.width = '100%';
        document.getElementById('questProgressText').textContent = '✓';
        document.getElementById('btnClaimQuest').classList.add('hidden');
      } else {
        const done = state.questProgress >= q.target;
        document.getElementById('questIndexBadge').textContent = `${state.questIndex + 1}/${QUESTS.length}`;
        document.getElementById('questTitle').textContent = q.title;
        document.getElementById('questRewardBadge').textContent = `+${q.rewardCoins}🪙 +${q.rewardPearls}🦪`;
        document.getElementById('questProgressBar').style.width = `${Math.min(100, (state.questProgress / q.target) * 100)}%`;
        document.getElementById('questProgressText').textContent = `${Math.min(state.questProgress, q.target)}/${q.target}`;
        document.getElementById('btnClaimQuest').classList.toggle('hidden', !done);
        qCard.classList.toggle('quest-ready', done);
      }
    }

    // ==================== INPUT & MULTI-TOUCH BINDINGS ====================
    function bindEvents() {
      const container = document.getElementById('canvasContainer');

      window.addEventListener('resize', () => {
        viewW = container.clientWidth || window.innerWidth;
        viewH = container.clientHeight || window.innerHeight;
        if (app) app.renderer.resize(viewW, viewH);
        if (fbCanvas) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          fbCanvas.width = Math.round(viewW * dpr);
          fbCanvas.height = Math.round(viewH * dpr);
          fbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      });

      window.addEventListener('keydown', (e) => {
        keysPressed[e.key] = true;
        if (e.key === 'Escape') { closeModal(); setTool('hand'); }
      });
      window.addEventListener('keyup', (e) => { keysPressed[e.key] = false; });

      container.addEventListener('pointerdown', (e) => {
        Sound.init();
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        container.setPointerCapture(e.pointerId);
        if (activePointers.size === 1) {
          isDragging = false;
          dragStartX = e.clientX; dragStartY = e.clientY;
          camStartX = cam.x; camStartY = cam.y;
          cam.vx = 0; cam.vy = 0;
        } else if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          isDragging = true;
        }
      });

      container.addEventListener('pointermove', (e) => {
        const rect = container.getBoundingClientRect();
        const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

        if (activePointers.has(e.pointerId)) {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (lastPinchDist && dist > 10) {
              cam.targetZoom = Math.max(0.34, Math.min(1.85, cam.targetZoom * (dist / lastPinchDist)));
            }
            lastPinchDist = dist;
            return;
          }
          if (activePointers.size === 1) {
            const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
            if (Math.hypot(dx, dy) > 8) {
              isDragging = true;
              container.classList.add('dragging');
            }
            if (isDragging) {
              const nx = camStartX - dx / cam.zoom;
              const ny = camStartY - dy / cam.zoom;
              cam.vx = (nx - cam.x) * 14;
              cam.vy = (ny - cam.y) * 14;
              cam.x = nx; cam.y = ny;
              return;
            }
          }
        }
        const g = screenToGrid(sx, sy);
        hoverTile = (g.x >= 0 && g.y >= 0 && g.x < GRID_SIZE && g.y < GRID_SIZE) ? g : null;
      });

      const endPointer = (e) => {
        const wasSingle = activePointers.size === 1 && activePointers.has(e.pointerId);
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) lastPinchDist = null;
        if (activePointers.size === 0) {
          container.classList.remove('dragging');
          if (wasSingle && !isDragging) {
            const rect = container.getBoundingClientRect();
            const g = screenToGrid(e.clientX - rect.left, e.clientY - rect.top);
            handleTileClick(g.x, g.y);
          }
          isDragging = false;
        }
      };
      container.addEventListener('pointerup', endPointer);
      container.addEventListener('pointercancel', endPointer);

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        cam.targetZoom = Math.max(0.34, Math.min(1.85, cam.targetZoom * (e.deltaY < 0 ? 1.1 : 0.91)));
      }, { passive: false });

      // Toolbar & UI buttons
      document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => { Sound.init(); Sound.click(); setTool(btn.dataset.tool); });
      });
      document.getElementById('btnOpenShop').addEventListener('click', () => { Sound.init(); Sound.click(); openShopModal(); });
      document.getElementById('btnOpenBarn').addEventListener('click', () => { Sound.init(); Sound.click(); openBarnModal(); });
      document.getElementById('btnOpenOrders').addEventListener('click', () => { Sound.init(); Sound.click(); openOrdersModal('orders'); });
      document.getElementById('btnOpenCraft').addEventListener('click', () => { Sound.init(); Sound.click(); openCraftModal(); });
      document.getElementById('btnOpenFishing').addEventListener('click', () => { Sound.init(); Sound.click(); openFishingModal(); });
      document.getElementById('btnOpenWheel').addEventListener('click', () => { Sound.init(); Sound.click(); openWheelModal(); });
      document.getElementById('btnHarvestAll').addEventListener('click', harvestAllReady);
      document.getElementById('btnToggleWeather').addEventListener('click', () => {
        Sound.init(); Sound.click();
        weatherMode = weatherMode === 'sunny' ? 'rain' : 'sunny';
        document.getElementById('hudWeatherLabel').textContent = weatherMode === 'rain' ? '🌧️ Yağmurlu' : '☀️ Güneşli';
        showToast(weatherMode === 'rain' ? '🌧️ Yağmur başladı! Tüm ekinler otomatik sulanıyor.' : '☀️ Hava tekrar güneşli!', 'info');
      });
      document.getElementById('btnSettings').addEventListener('click', () => { Sound.init(); Sound.click(); openSettingsModal(); });
      document.getElementById('btnCloseModal').addEventListener('click', () => { Sound.click(); closeModal(); });
      modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

      const cycleTime = () => {
        Sound.init(); Sound.click();
        timePresetIdx = (timePresetIdx + 1) % TIME_PRESETS.length;
        applyAtmosphereVisuals();
        showToast(`${TIME_PRESETS[timePresetIdx].icon} Günün saati: ${TIME_PRESETS[timePresetIdx].label}`, 'info');
      };
      document.getElementById('btnCycleTime').addEventListener('click', cycleTime);
      document.getElementById('btnMobileTime').addEventListener('click', cycleTime);
      document.getElementById('btnCycleSeason').addEventListener('click', () => {
        Sound.init(); Sound.click();
        seasonIdx = (seasonIdx + 1) % SEASONS.length;
        applyAtmosphereVisuals();
        showToast(`🌿 Mevsim: ${SEASONS[seasonIdx].label}`, 'info');
      });

      document.getElementById('btnMute').addEventListener('click', () => {
        Sound.init(); Sound.muted = !Sound.muted;
        document.getElementById('btnMute').textContent = Sound.muted ? '🔇' : '🔊';
        if (!Sound.muted) Sound.click();
      });

      document.getElementById('btnEnergyRefill').addEventListener('click', () => {
        Sound.init();
        if (state.energy >= state.maxEnergy) { showToast('⚡ Enerjin zaten tamamen dolu!', 'info'); return; }
        if (state.pearls >= 1) {
          state.pearls -= 1; state.energy = state.maxEnergy; Sound.harvest();
          showToast('⚡ 1 İnci ile enerjin tamamen doldu!', 'success'); updateHUD(); saveState();
        } else {
          Sound.error(); showToast('Enerjin her 4 saniyede +1 otomatik dolar!', 'info');
        }
      });

      document.getElementById('btnClaimQuest').addEventListener('click', () => {
        const q = QUESTS[state.questIndex];
        if (!q || state.questProgress < q.target) return;
        Sound.levelUp();
        state.coins += q.rewardCoins; state.pearls += q.rewardPearls;
        addXp(q.rewardXp, 4.5, 4.5);
        state.questIndex += 1; state.questProgress = 0;
        showToast(`🎁 Görev ödülü alındı! +${q.rewardCoins}🪙 +${q.rewardPearls}🦪`, 'success');
        updateHUD(); saveState();
      });

      document.getElementById('btnZoomIn').addEventListener('click', () => { Sound.click(); cam.targetZoom = Math.min(1.85, cam.targetZoom * 1.18); });
      document.getElementById('btnZoomOut').addEventListener('click', () => { Sound.click(); cam.targetZoom = Math.max(0.34, cam.targetZoom * 0.85); });
      document.getElementById('btnCenterCam').addEventListener('click', () => { Sound.click(); centerCamera(); });
    }

    // ==================== ZERO-DEPENDENCY 2.5D CANVAS FALLBACK ENGINE ====================
    function startSafeFallback(){
      if(useCanvasFallback)return;
      if(app){try{app.ticker.stop();app.destroy(true,{children:true});}catch(e){console.warn(e);}app=null;}
      birds.length=0;butterflies.length=0;driftingLeaves.length=0;fireflies.length=0;smokePuffs.length=0;floatTexts.length=0;burstParticles.length=0;
      initCanvas2DFallbackEngine();
    }
    function initCanvas2DFallbackEngine() {
      useCanvasFallback = true;
      const container = document.getElementById('canvasContainer');
      viewW = container.clientWidth || window.innerWidth;
      viewH = container.clientHeight || window.innerHeight;
      fbCanvas = document.createElement('canvas');
      fbCanvas.id = 'gameCanvas';
      container.innerHTML = '';
      container.appendChild(fbCanvas);
      fbCtx = fbCanvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fbCanvas.width = Math.round(viewW * dpr);
      fbCanvas.height = Math.round(viewH * dpr);
      fbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Bake procedural 3D-shaded crops & flowers
      Object.keys(CROPS).forEach(cid => {
        fbCropCanvases[cid] = [
          makeProceduralCropTexture(cid, 0),
          makeProceduralCropTexture(cid, 1),
          makeProceduralCropTexture(cid, 2)
        ];
      });
      fbFlowerCanvas = makeFlowerBedTexture();

      // Init wildlife arrays
      for (let i = 0; i < 4; i++) birds.push({ x: -500 + i * 260, y: -120 + i * 110, vx: 26 + i * 5, vy: 7 + (i % 2) * 5, wingPhase: i * 1.4 });
      for (let i = 0; i < 6; i++) butterflies.push({ gx: 2.5 + hash2(i, 3.1) * 5, gy: 2.5 + hash2(i, 7.2) * 5, phase: i * 1.1, color: ['#facc15', '#f472b6', '#38bdf8', '#fb923c'][i % 4] });
      for (let i = 0; i < 12; i++) driftingLeaves.push({ x: (hash2(i, 5.1) - 0.5) * 900, y: (hash2(i, 2.3) - 0.3) * 500, vx: 16 + hash2(i, 1.1) * 14, vy: 6 + hash2(i, 4.2) * 8, phase: i * 0.9 });
      for (let i = 0; i < 16; i++) fireflies.push({ gx: 1.5 + hash2(i, 8.8) * 7, gy: 1.5 + hash2(i, 4.1) * 7, phase: i * 0.7 });

      centerCamera();
      applyAtmosphereVisuals();

      fbAtlasImg = new Image();
      fbAtlasImg.onload = () => {};
      fbAtlasImg.src = ATLAS_SRC;

      let prevT = performance.now();
      function fbLoop(ts) {
        const dt = Math.min(0.05, (ts - prevT) / 1000 || 0.016);
        prevT = ts;
        try{renderFallbackFrame(dt);}catch(err){console.error('Canvas render failed',err);const status=document.getElementById('livingStatus');if(status)status.textContent='Grafik hatası — sayfayı yenile';return;}
        requestAnimationFrame(fbLoop);
      }
      requestAnimationFrame(fbLoop);
    }

    function drawAtlasSprite2D(ctx, key, x, y, scaleX, scaleY, sway = 0) {
      if (!fbAtlasImg || !fbAtlasImg.complete || !fbAtlasImg.naturalWidth) return;
      const f = ATLAS_FRAMES[key];
      if (!f) return;
      ctx.save();
      ctx.translate(x, y);
      if (sway) ctx.transform(1, 0, sway, 1, 0, 0);
      ctx.scale(scaleX, scaleY);
      ctx.drawImage(fbAtlasImg, f.x, f.y, f.w, f.h, -f.w * 0.5, -f.h * f.anchorY, f.w, f.h);
      ctx.restore();
    }

    function renderFallbackFrame(dt) {
      envTime += dt;
      livingTick(dt);
      const now = Date.now();
      const ctx = fbCtx;
      const tp = TIME_PRESETS[timePresetIdx];
      const sp = SEASONS[seasonIdx];

      // Inertial camera
      const panAccel = 1400 / cam.zoom;
      if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) cam.vx -= panAccel * dt;
      if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) cam.vx += panAccel * dt;
      if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) cam.vy -= panAccel * dt;
      if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) cam.vy += panAccel * dt;
      cam.x += cam.vx * dt; cam.y += cam.vy * dt;
      const damp = Math.exp(-8.5 * dt);
      cam.vx *= damp; cam.vy *= damp;
      cam.zoom += (cam.targetZoom - cam.zoom) * Math.min(1, dt * 10);

      // Energy regen
      if (state.energy < state.maxEnergy) {
        const elapsedSec = (now - state.lastEnergyAt) / 1000;
        if (elapsedSec >= 4) {
          state.energy = Math.min(state.maxEnergy, state.energy + Math.floor(elapsedSec / 4));
          state.lastEnergyAt = now - ((elapsedSec % 4) * 1000);
          updateHUD();
        }
        const timerEl = document.getElementById('hudEnergyTimer');
        if (timerEl) timerEl.textContent = `+1 (${Math.max(1, Math.ceil(4 - ((now - state.lastEnergyAt) / 1000)))}s)`;
      } else {
        state.lastEnergyAt = now;
        const timerEl = document.getElementById('hudEnergyTimer');
        if (timerEl) timerEl.textContent = '';
      }

      // 1. Tropical Ocean Background
      const oceanGrad = ctx.createLinearGradient(0, 0, 0, viewH);
      if (tp.night > 0.6) { oceanGrad.addColorStop(0, '#072238'); oceanGrad.addColorStop(1, '#0c3552'); }
      else if (tp.id === 'sunset') { oceanGrad.addColorStop(0, '#135a78'); oceanGrad.addColorStop(1, '#0f738a'); }
      else { oceanGrad.addColorStop(0, '#0c98ba'); oceanGrad.addColorStop(0.55, '#13b6c7'); oceanGrad.addColorStop(1, '#0c82a0'); }
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, viewW, viewH);

      ctx.strokeStyle = tp.night > 0.6 ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 16; i++) {
        const wy = ((i * 68 + envTime * 10) % (viewH + 80)) - 40;
        const wx = ((i * 180 + Math.sin(envTime * 0.8 + i) * 38) % (viewW + 120)) - 60;
        ctx.beginPath(); ctx.moveTo(wx, wy); ctx.quadraticCurveTo(wx + 24, wy - 6, wx + 48, wy); ctx.stroke();
      }

      // World transform
      ctx.save();
      ctx.translate(viewW / 2 - cam.x * cam.zoom, viewH / 2 - cam.y * cam.zoom);
      ctx.scale(cam.zoom, cam.zoom);

      // 2. Organic Sandy Island Base & Wooden Pier
      const topPt = gridToWorld(-0.7, -0.7, 0);
      const rightPt = gridToWorld(GRID_SIZE + 0.7, -0.7, 0);
      const bottomPt = gridToWorld(GRID_SIZE + 0.7, GRID_SIZE + 0.7, 0);
      const leftPt = gridToWorld(-0.7, GRID_SIZE + 0.7, 0);

      // Turquoise reef foam
      const fpulse = Math.sin(envTime * 2) * 3;
      ctx.fillStyle = 'rgba(110, 245, 255, 0.30)';
      ctx.beginPath();
      ctx.moveTo(topPt.x, topPt.y - 24 - fpulse);
      ctx.lineTo(rightPt.x + 38 + fpulse, rightPt.y);
      ctx.lineTo(bottomPt.x, bottomPt.y + 34 + fpulse);
      ctx.lineTo(leftPt.x - 38 - fpulse, leftPt.y);
      ctx.closePath(); ctx.fill();

      // Cliff depth
      ctx.fillStyle = '#b08448';
      ctx.beginPath();
      ctx.moveTo(leftPt.x, leftPt.y); ctx.lineTo(bottomPt.x, bottomPt.y); ctx.lineTo(rightPt.x, rightPt.y);
      ctx.lineTo(rightPt.x, rightPt.y + 24); ctx.lineTo(bottomPt.x, bottomPt.y + 30); ctx.lineTo(leftPt.x, leftPt.y + 24);
      ctx.closePath(); ctx.fill();

      // Golden sandy beach
      ctx.fillStyle = '#f3d591'; ctx.strokeStyle = '#d9b061'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(topPt.x, topPt.y); ctx.lineTo(rightPt.x, rightPt.y); ctx.lineTo(bottomPt.x, bottomPt.y); ctx.lineTo(leftPt.x, leftPt.y);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Wooden pier
      const p0 = gridToWorld(GRID_SIZE + 0.15, 9.2, 2);
      ctx.fillStyle = '#8c5228'; ctx.strokeStyle = '#5c2d0c'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y); ctx.lineTo(p0.x + 68, p0.y + 35); ctx.lineTo(p0.x + 48, p0.y + 47); ctx.lineTo(p0.x - 20, p0.y + 12);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // 3. Draw Organic Terrain Tiles
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const tile = state.grid[y][x];
          const p = gridToWorld(x, y, tile.elevation || 0);
          const n = fbm2D(x * 0.6 + 3.1, y * 0.6 + 5.7, 3);
          let fill = n < 0.42 ? '#5fb546' : n < 0.60 ? '#6dc250' : '#79ca58';
          if (sp.id === 'autumn' && tile.type === 'grass') fill = n < 0.5 ? '#9ab046' : '#b2b84c';
          if (!tile.unlocked) fill = n > 0.52 ? '#4a9442' : '#42873b';
          else if (tile.type === 'soil') fill = tile.crop?.watered ? '#5c371d' : '#7c4d27';
          else if (tile.type === 'deco' && tile.entity?.id === 'path') fill = '#bfb5a2';

          ctx.fillStyle = fill;
          ctx.strokeStyle = tile.type === 'soil' ? 'rgba(74,43,19,0.55)' : 'rgba(59,122,44,0.16)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + TILE_W / 2, p.y + TILE_H / 2);
          ctx.lineTo(p.x, p.y + TILE_H); ctx.lineTo(p.x - TILE_W / 2, p.y + TILE_H / 2);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          if (tile.unlocked && tile.type === 'soil') {
            ctx.strokeStyle = tile.crop?.watered ? 'rgba(45,22,8,0.55)' : 'rgba(84,49,22,0.5)';
            ctx.lineWidth = 2;
            for (let i = -2; i <= 2; i++) {
              ctx.beginPath();
              ctx.moveTo(p.x - 24 + i * 8, p.y + 18 + i * 4.1);
              ctx.lineTo(p.x + 14 + i * 8, p.y + 37 + i * 4.1);
              ctx.stroke();
            }
          } else if (tile.unlocked && tile.type === 'deco' && tile.entity?.id === 'path') {
            [[-14, 24, 11, 5.5], [4, 20, 12, 6], [16, 29, 10, 5], [-4, 34, 13, 6]].forEach(([dx, dy, rx, ry], idx) => {
              ctx.fillStyle = idx % 2 === 0 ? '#d6cfc0' : '#c7bea9';
              ctx.beginPath(); ctx.ellipse(p.x + dx, p.y + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
            });
          } else if (tile.type === 'grass') {
            const seed = x * 31 + y * 17;
            for (let i = 0; i < 3; i++) {
              const bx = p.x + (hash2(seed + i, 1.3) - 0.5) * 42;
              const by = p.y + TILE_H * 0.5 + (hash2(seed + i, 2.7) - 0.5) * 18;
              ctx.strokeStyle = 'rgba(42, 98, 28, 0.5)'; ctx.lineWidth = 1.2;
              ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 2, by - 5); ctx.moveTo(bx, by); ctx.lineTo(bx + 2, by - 5); ctx.stroke();
              if (tile.unlocked && i === 0 && hash2(seed, 9.1) > 0.6) {
                ctx.fillStyle = hash2(seed, 4.4) > 0.5 ? '#fef08a' : '#ffffff';
                ctx.beginPath(); ctx.arc(bx + 3, by - 3, 2, 0, Math.PI * 2); ctx.fill();
              }
            }
          }

          if (hoverTile && hoverTile.x === x && hoverTile.y === y) {
            ctx.fillStyle = !tile.unlocked ? 'rgba(250,204,21,0.3)' : activeTool === 'remove' ? 'rgba(244,63,94,0.34)' : 'rgba(255,255,255,0.28)';
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + TILE_W / 2, p.y + TILE_H / 2);
            ctx.lineTo(p.x, p.y + TILE_H); ctx.lineTo(p.x - TILE_W / 2, p.y + TILE_H / 2);
            ctx.closePath(); ctx.fill(); ctx.stroke();
          }
        }
      }

      // 4. Build Y-Sorted Render List (Buildings, Trees, Crops, Animals, Ergün, NPCs, Sailboat)
      const renderables = [];

      // Update Ergün Multi-Pose Biomechanical Animation
      const { fp, bounce: fBounce, rot: fRot, scaleYMult: fScaleY } = updateFarmerAnimation(dt, now);
      const poseMeta = ATLAS_FRAMES[farmer.currentPose] || ATLAS_FRAMES.ergun;
      renderables.push({
        y: fp.y + TILE_H * 0.5 + 2,
        draw: () => {
          ctx.fillStyle = 'rgba(12,24,18,0.36)';
          ctx.beginPath(); ctx.ellipse(fp.x + Math.sin(tp.shadowAng) * 8, fp.y + TILE_H * 0.5 + 3, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
          ctx.save();
          ctx.translate(fp.x, fp.y + TILE_H * 0.5 - fBounce);
          ctx.rotate(fRot);
          drawAtlasSprite2D(ctx, farmer.currentPose, 0, 0, poseMeta.scale * farmer.facing, poseMeta.scale * fScaleY);
          ctx.restore();
          ctx.fillStyle = 'rgba(69,26,3,0.82)';
          ctx.beginPath(); ctx.roundRect(fp.x - 24, fp.y + TILE_H * 0.5 - 102 - fBounce * 0.4, 48, 17, 8); ctx.fill();
          ctx.fillStyle = '#fef3c7'; ctx.font = 'bold 10px Inter, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('Ergün', fp.x, fp.y + TILE_H * 0.5 - 90 - fBounce * 0.4);
        }
      });

      // Update NPCs
      npcs.forEach(npc => {
        if(!residentActive(npc))return;
        npcStep(npc,dt);
        const ndx = npc.tx - npc.gx, ndy = npc.ty - npc.gy, ndist = Math.hypot(ndx, ndy);
        if (ndist > 0.05) {
          const desired=Math.min(1.6,Math.sqrt(8*ndist));npc.speed=(npc.speed||0)+(desired-(npc.speed||0))*Math.min(1,dt*9);const step=Math.min(ndist,dt*Math.max(.25,npc.speed));
          npc.gx += (ndx / ndist) * step; npc.gy += (ndy / ndist) * step;
          npc.stridePhase += step * 1.3;
          if (Math.abs(ndx - ndy) > 0.02) npc.facing = (ndx - ndy) >= 0 ? 1 : -1;
        }
        const np = gridToWorld(npc.gx, npc.gy, getTileElevation(npc.gx, npc.gy));
        renderables.push({
          y: np.y + TILE_H * 0.5 + 1,
          draw: () => {
            const cx = np.x, cy = np.y + TILE_H * 0.5;
            const stride = ndist > 0.05 ? Math.sin(npc.stridePhase * 11) * 5 : 0;
            const bob = ndist > 0.05 ? Math.abs(Math.sin(npc.stridePhase * 11)) * 2.5 : 0;
            ctx.fillStyle = 'rgba(12,24,18,0.3)';
            ctx.beginPath(); ctx.ellipse(cx + Math.sin(tp.shadowAng) * 6, cy + 2, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
            const img=npcImages[npc.id],height=npcHeights[npc.id]||90;
            if(img?.width&&img.height){
              const m=npcMotion(npc,envTime),w=height*img.width/img.height;
              ctx.save();ctx.translate(cx,cy-m.bob);ctx.rotate(m.angle);ctx.scale(npc.facing,m.stretch);ctx.drawImage(img,-w/2,-height,w,height);ctx.restore();
              ctx.fillStyle='rgba(30,41,59,0.8)';const labelW=Math.max(60,npc.name.length*6);ctx.beginPath();ctx.roundRect(cx-labelW/2,cy-height-20,labelW,14,7);ctx.fill();
              ctx.fillStyle='#f8fafc';ctx.font='bold 9px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(npc.name,cx,cy-height-10);if(npc.chatUntil>envTime){ctx.font='10px Inter,sans-serif';const w=Math.min(210,ctx.measureText(npc.speech).width+14);ctx.fillStyle='#fffdf5';ctx.beginPath();ctx.roundRect(cx-w/2,cy-height-42,w,19,6);ctx.fill();ctx.fillStyle='#451a03';ctx.fillText(npc.speech,cx,cy-height-29,w-8);}return;
            }
            ctx.strokeStyle = '#' + npc.pantsColor.toString(16).padStart(6, '0'); ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(cx - 3, cy - 15 - bob); ctx.lineTo(cx - 3 + stride, cy - 1);
            ctx.moveTo(cx + 3, cy - 15 - bob); ctx.lineTo(cx + 3 - stride, cy - 1); ctx.stroke();
            ctx.fillStyle = '#' + npc.shirtColor.toString(16).padStart(6, '0');
            ctx.beginPath(); ctx.roundRect(cx - 7.5, cy - 34 - bob, 15, 20, 5); ctx.fill();
            ctx.fillStyle = '#f1c29b';
            ctx.beginPath(); ctx.arc(cx, cy - 42 - bob, 7.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#' + npc.hairColor.toString(16).padStart(6, '0');
            ctx.beginPath(); ctx.ellipse(cx, cy - 46 - bob, 7.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(30,41,59,0.8)';
            ctx.beginPath(); ctx.roundRect(cx - 30, cy - 66, 60, 14, 7); ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 9px Inter, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(npc.name, cx, cy - 56);
          }
        });
      });

      // Sailboat
      renderables.push({
        y: p0.y + 60,
        draw: () => {
          const bx = p0.x + 86, by = p0.y + 46 + Math.sin(envTime * 2.2) * 3;
          ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.ellipse(bx, by + 13, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#7c2d12'; ctx.beginPath(); ctx.moveTo(bx - 18, by + 2); ctx.lineTo(bx + 18, by + 2); ctx.lineTo(bx + 11, by + 10); ctx.lineTo(bx - 12, by + 10); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#451a03'; ctx.fillRect(bx - 1, by - 28, 2.5, 30);
          ctx.fillStyle = '#fffbeb'; ctx.beginPath(); ctx.moveTo(bx + 1, by - 26); ctx.lineTo(bx + 17, by - 6); ctx.lineTo(bx + 1, by - 4); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.moveTo(bx + 1, by - 26); ctx.lineTo(bx - 11, by - 10); ctx.lineTo(bx + 1, by - 8); ctx.closePath(); ctx.fill();
        }
      });

      // Grid entities
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const tile = state.grid[y][x];
          const p = gridToWorld(x, y, tile.elevation || 0);
          const cx = p.x, cy = p.y + TILE_H * 0.5;
          const sway = Math.sin(envTime * 1.8 + x * 0.7 + y * 0.5) * 0.03;

          if (!tile.unlocked) {
            const treeKey = (x + y) % 2 === 0 ? 'palm' : 'oak';
            const f = ATLAS_FRAMES[treeKey];
            const sv = 0.72 + hash2(x, y) * 0.22;
            const flip = hash2(y, x) > 0.5 ? 1 : -1;
            renderables.push({
              y: cy,
              draw: () => {
                ctx.fillStyle = 'rgba(12,24,18,0.28)';
                ctx.beginPath(); ctx.ellipse(cx + Math.sin(tp.shadowAng) * 14 * tp.shadowLen, cy + 5, 34 * sv, 15 * sv, 0, 0, Math.PI * 2); ctx.fill();
                drawAtlasSprite2D(ctx, treeKey, cx, cy, f.scale * sv * flip, f.scale * sv, sway);
              }
            });
          } else if (tile.type === 'soil' && tile.crop) {
            const prog = getCropProgress(tile.crop, now);
            const stage = prog >= 1 ? 2 : prog >= 0.35 ? 1 : 0;
            const spriteKey = stage === 0 ? 'crop_sprout' : ('crop_' + tile.crop.id);
            const f = ATLAS_FRAMES[spriteKey] || ATLAS_FRAMES.crop_sprout;
            const stageScale = stage === 0 ? 0.85 : stage === 1 ? 0.68 : 1.0;
            renderables.push({
              y: cy,
              draw: () => {
                if (stage > 0) {
                  ctx.fillStyle = 'rgba(12,24,18,0.26)';
                  ctx.beginPath(); ctx.ellipse(cx + Math.sin(tp.shadowAng) * 8, cy + 4, 26 * stageScale, 12 * stageScale, 0, 0, Math.PI * 2); ctx.fill();
                }
                if(ATLAS_FRAMES[spriteKey]) drawAtlasSprite2D(ctx, spriteKey, cx, cy + 4, f.scale * stageScale, f.scale * stageScale, sway * 0.7);
                else { const cropCanvas=fbCropCanvases[tile.crop.id]?.[stage]; if(cropCanvas)ctx.drawImage(cropCanvas,cx-41,cy-57,82,82); }
                if (stage < 2) {
                  ctx.fillStyle = 'rgba(15,23,42,0.55)'; ctx.fillRect(cx - 19, cy + 10, 38, 5);
                  ctx.fillStyle = tile.crop.watered ? '#38bdf8' : '#4ade80'; ctx.fillRect(cx - 18, cy + 11, 36 * prog, 3);
                } else {
                  const by = cy - 56 + Math.sin(envTime * 4) * 2.5;
                  ctx.fillStyle = '#fef08a'; ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2;
                  ctx.beginPath(); ctx.arc(cx, by, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                  ctx.fillStyle = '#92400e'; ctx.font = 'bold 12px Inter, sans-serif'; ctx.textAlign = 'center';
                  ctx.fillText('✓', cx, by + 4);
                }
              }
            });
          } else if (tile.type === 'animal' && tile.entity) {
            const aDef = ANIMALS[tile.entity.id], f = ATLAS_FRAMES[aDef.sprite];
            tile.entity.roamPhase = (tile.entity.roamPhase || 0) + dt * 0.7;
            const rx = Math.sin(tile.entity.roamPhase) * 9, ry = Math.cos(tile.entity.roamPhase * 0.7) * 4;
            const hop = Math.abs(Math.sin(tile.entity.roamPhase * 3.2)) * 2.5;
            const dir = Math.cos(tile.entity.roamPhase) >= 0 ? 1 : -1;
            const prog = getEntityProgress(tile.entity, now);
            renderables.push({
              y: cy + ry,
              draw: () => {
                ctx.fillStyle = 'rgba(12,24,18,0.3)';
                ctx.beginPath(); ctx.ellipse(cx + rx + Math.sin(tp.shadowAng) * 8, cy + ry + 4, 24, 11, 0, 0, Math.PI * 2); ctx.fill();
                drawAtlasSprite2D(ctx, aDef.sprite, cx + rx, cy + ry - hop, f.scale * dir, f.scale);
                if (prog >= 1) {
                  const by = cy - 56 + Math.sin(envTime * 4) * 3;
                  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2;
                  ctx.beginPath(); ctx.arc(cx + rx, by, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                  ctx.font = '13px serif'; ctx.textAlign = 'center'; ctx.fillText(aDef.productIcon, cx + rx, by + 5);
                }
              }
            });
          } else if (tile.type === 'building' && tile.entity) {
            const bDef = BUILDINGS[tile.entity.id], f = ATLAS_FRAMES[bDef.sprite];
            const prog = getEntityProgress(tile.entity, now);
            renderables.push({
              y: cy,
              draw: () => {
                ctx.fillStyle = 'rgba(12,24,18,0.34)';
                ctx.beginPath(); ctx.ellipse(cx + Math.sin(tp.shadowAng) * 16 * tp.shadowLen, cy + 7, 60, 27, 0, 0, Math.PI * 2); ctx.fill();
                drawAtlasSprite2D(ctx, bDef.sprite, cx, cy, f.scale, f.scale);
                if (tp.night > 0.2) {
                  const gr = ctx.createRadialGradient(cx, cy - 26, 6, cx, cy - 26, 78);
                  gr.addColorStop(0, `rgba(255, 195, 85, ${tp.night * 0.55})`);
                  gr.addColorStop(1, 'rgba(255, 195, 85, 0)');
                  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy - 26, 78, 0, Math.PI * 2); ctx.fill();
                }
                if (prog >= 1) {
                  const by = cy - 106 + Math.sin(envTime * 3.8) * 3;
                  ctx.fillStyle = '#fef9c3'; ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2;
                  ctx.beginPath(); ctx.arc(cx, by, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                  ctx.font = '13px serif'; ctx.textAlign = 'center'; ctx.fillText(bDef.productIcon || '🪙', cx, by + 5);
                }
              }
            });
          } else if (tile.type === 'deco' && tile.entity && tile.entity.id !== 'path') {
            const dDef = DECOS[tile.entity.id];
            renderables.push({
              y: cy,
              draw: () => {
                if (dDef.sprite) {
                  const f = ATLAS_FRAMES[dDef.sprite];
                  ctx.fillStyle = 'rgba(12,24,18,0.28)';
                  ctx.beginPath(); ctx.ellipse(cx + Math.sin(tp.shadowAng) * 13 * tp.shadowLen, cy + 5, 36, 16, 0, 0, Math.PI * 2); ctx.fill();
                  drawAtlasSprite2D(ctx, dDef.sprite, cx, cy, f.scale, f.scale, dDef.id === 'fountain' ? 0 : sway);
                } else if (dDef.id === 'flowers') {
                  ctx.drawImage(fbFlowerCanvas, cx - 48, cy - 34);
                }
              }
            });
          }
        }
      }

      // Strict Y-Sorting
      renderables.sort((a, b) => a.y - b.y);
      for (let i = 0; i < renderables.length; i++) renderables[i].draw();

      // 5. Ambient Birds, Butterflies, Chimney Smoke, Bursts & Float Texts
      if (Math.random() < dt * 2.2) {
        const fh = gridToWorld(5, 5, state.grid[5][5].elevation || 6);
        smokePuffs.push({ x: fh.x + 42, y: fh.y - 76, r: 4, life: 2.2, maxLife: 2.2 });
      }
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const s = smokePuffs[i]; s.life -= dt;
        if (s.life <= 0) { smokePuffs.splice(i, 1); continue; }
        s.x += dt * 12; s.y -= dt * 18; s.r += dt * 4.5;
        ctx.fillStyle = `rgba(255,251,235,${(s.life / s.maxLife) * 0.35})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      birds.forEach(b => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.wingPhase += dt * 8;
        if (b.x > 700) { b.x = -700; b.y = -200 + Math.random() * 420; }
        const flap = Math.sin(b.wingPhase) * 6;
        ctx.fillStyle = 'rgba(15,23,42,0.14)'; ctx.beginPath(); ctx.ellipse(b.x + 18, b.y + 70, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x - 10, b.y + flap); ctx.quadraticCurveTo(b.x - 4, b.y - 4, b.x, b.y); ctx.quadraticCurveTo(b.x + 4, b.y - 4, b.x + 10, b.y + flap); ctx.stroke();
      });
      butterflies.forEach(bf => {
        bf.phase += dt * 2.2;
        const bp = gridToWorld(bf.gx + Math.sin(bf.phase * 0.7) * 0.7, bf.gy + Math.cos(bf.phase * 0.5) * 0.7, 24 + Math.sin(bf.phase * 3) * 6);
        const wing = 2.5 + Math.abs(Math.sin(bf.phase * 9)) * 2.5;
        ctx.fillStyle = bf.color;
        ctx.beginPath(); ctx.ellipse(bp.x - wing * 0.6, bp.y, wing, 2.2, 0, 0, Math.PI * 2); ctx.ellipse(bp.x + wing * 0.6, bp.y, wing, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      });
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const pt = burstParticles[i]; pt.life -= dt;
        if (pt.life <= 0) { burstParticles.splice(i, 1); continue; }
        pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 120 * dt;
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = '#' + pt.color.toString(16).padStart(6, '0');
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i]; ft.life -= dt;
        if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
        ft.y -= 34 * dt;
        ctx.save(); ctx.globalAlpha = Math.min(1, ft.life * 1.5);
        ctx.font = '800 14px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.strokeStyle = '#2c1705'; ctx.lineWidth = 3.5; ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }
      ctx.restore();

      // 5b. Dynamic Weather (Raindrops & Auto-Watering!)
      if (weatherMode === 'rain') {
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        raindrops.forEach(rd => {
          rd.x -= rd.s * 0.25 * dt;
          rd.y += rd.s * dt;
          if (rd.y > viewH + 20) { rd.y = -20; rd.x = Math.random() * (viewW + 200); }
          ctx.moveTo(rd.x, rd.y);
          ctx.lineTo(rd.x - 4, rd.y + rd.l);
        });
        ctx.stroke();
        // Auto-water all planted crops during rain!
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            const tc = state.grid[y][x].crop;
            if (tc && !tc.watered) {
              tc.watered = true;
              const rem = Math.max(1, tc.duration - (now - tc.plantedAt) / 1000);
              tc.plantedAt -= rem * 0.45 * 1000;
            }
          }
        }
      }
      if (now - lastHotChange > 60000) {
        const hotPool = ['wheat', 'strawberry', 'papaya', 'corn', 'bread', 'smoothie', 'seabream'];
        hotItemId = hotPool[Math.floor(Math.random() * hotPool.length)];
        lastHotChange = now;
      }

      // 6. Cinematic Day/Night Color Grading Overlay
      if (tp.id === 'sunset') {
        ctx.fillStyle = 'rgba(249, 115, 22, 0.14)'; ctx.fillRect(0, 0, viewW, viewH);
      } else if (tp.id === 'morning') {
        ctx.fillStyle = 'rgba(253, 224, 71, 0.08)'; ctx.fillRect(0, 0, viewW, viewH);
      } else if (tp.night > 0.6) {
        ctx.fillStyle = 'rgba(15, 23, 56, 0.42)'; ctx.fillRect(0, 0, viewW, viewH);
      }

      updateTooltip(now);
      if (now - lastSaveTime > 10000) { saveState(); lastSaveTime = now; }
    }

    // ==================== BOOTSTRAP ====================
    window.onload = async function() {
      state = ensureStateFields(loadState());
      await prepareNpcArt();
      if(state.living){livingDay=state.living.day||1;livingClock=state.living.clock??13;livingMode=state.living.mode||'career';clockSpeed=state.living.speed??1;autoDayCycle=state.living.auto!==false;}
      const panel=document.createElement('div');panel.className='wood-pill';panel.id='livingPanel';panel.style.cssText='position:fixed;z-index:25;right:12px;bottom:100px;padding:8px;border-radius:12px;max-width:180px;font-size:11px;color:#583519';
      panel.innerHTML='<strong>Living Island</strong><div id="livingStatus">Ada yaşamı</div><select aria-label="Oyun modu" id="livingMode"><option value="career">Kariyer</option><option value="zen">Huzur</option><option value="sandbox">Sandbox</option></select><select aria-label="Zaman hızı" id="livingSpeed"><option value="0">Duraklat</option><option value="1">1×</option><option value="4">4×</option></select><button id="livingPhoto" type="button" style="display:block;margin-top:4px">📷 Fotoğraf modu</button><button id="livingExport" type="button" style="display:block;margin-top:4px">Kayıt indir</button>';
      panel.innerHTML='<button id="livingClose" aria-label="Menüyü kapat" style="float:right">✕</button>'+panel.innerHTML+'<button id="livingResidents" style="display:block;margin-top:5px">🏡 Ev ve sakinler</button><button id="livingJournal" style="display:block;margin-top:5px">📖 Ada günlüğü</button>';
      document.body.appendChild(panel);
      const toggle=document.createElement('button');toggle.id='livingToggle';toggle.textContent='☰ Ada menüsü';document.body.appendChild(toggle);
      toggle.onclick=()=>{panel.hidden=!panel.hidden;};document.getElementById('livingClose').onclick=()=>{panel.hidden=true;};
      const toolsToggle=document.createElement('button');toolsToggle.id='livingToolsToggle';toolsToggle.textContent='Araçları gizle';document.body.appendChild(toolsToggle);toolsToggle.onclick=()=>{const nav=document.querySelector('nav');const hide=!nav.classList.contains('living-hidden');nav.classList.toggle('living-hidden',hide);if(hide)setTool('hand');toolsToggle.textContent=hide?'Araçları aç':'Araçları gizle';};
      document.getElementById('livingResidents').onclick=openResidents;
      document.getElementById('livingJournal').onclick=()=>openModal('Ada günlüğü','<div style="display:grid;gap:8px">'+(state.islandEvents.length?state.islandEvents.slice().reverse().map(t=>'<p style="background:#fff5de;padding:8px;border-radius:8px">'+String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p>').join(''):'Henüz kayıt yok.')+'</div>');
      panel.hidden=true;
      const mode=document.getElementById('livingMode');mode.value=livingMode;mode.onchange=()=>{livingMode=mode.value;if(livingMode==='sandbox'){state.coins=Math.max(state.coins,100000);state.pearls=Math.max(state.pearls,1000);state.level=Math.max(state.level,10);for(const row of state.grid)for(const t of row)t.unlocked=true;for(let y=0;y<GRID_SIZE;y++)for(let x=0;x<GRID_SIZE;x++)refreshTileVisual(x,y,true);updateHUD();}saveState();};
      const speed=document.getElementById('livingSpeed');speed.value=String(clockSpeed);speed.onchange=()=>{clockSpeed=Number(speed.value);};
      let photo=false;document.getElementById('livingPhoto').onclick=()=>{photo=!photo;for(const el of document.querySelectorAll('header,aside,nav,#tileTooltip,#seedTray'))el.style.visibility=photo?'hidden':'';panel.style.opacity=photo?'.55':'1';};
      document.getElementById('livingExport').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='living-island-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
      window.addEventListener('pagehide',saveState);
      bindEvents();
      setTool('hand');
      updateHUD();
      if (typeof PIXI !== 'undefined') {
        try {
          await initPixiEngine();
          return;
        } catch (err) {
          console.warn('PixiJS fallback activated:', err);
        }
      }
      startSafeFallback();
    };
  })();
  </script>
