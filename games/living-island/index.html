<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ergün'ün Çiftliği — Living Island</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0d6e8a;
    }
    #canvasContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #canvasContainer.dragging { cursor: grabbing; }
    #canvasContainer.tool-active { cursor: pointer; }
    #canvasContainer canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .wood-panel {
      background: linear-gradient(180deg, rgba(255, 252, 244, 0.96) 0%, rgba(246, 234, 208, 0.96) 100%);
      border: 2px solid #b97d3b;
      box-shadow: 0 8px 26px rgba(20, 14, 6, 0.34), inset 0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
    }
    .wood-pill {
      background: linear-gradient(180deg, rgba(255, 253, 246, 0.94) 0%, rgba(244, 231, 202, 0.94) 100%);
      border: 1.5px solid #b97d3b;
      box-shadow: 0 4px 12px rgba(15, 25, 32, 0.28), inset 0 1px 0 rgba(255,255,255,0.85);
      backdrop-filter: blur(5px);
    }
    .tool-btn {
      transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
    }
    .tool-btn:active { transform: scale(0.94); }
    .tool-btn.active {
      background: linear-gradient(180deg, #ffd252 0%, #f59e0b 100%);
      border-color: #92400e;
      color: #451a03;
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(180, 83, 9, 0.38);
    }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #c99459; border-radius: 999px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.18s ease-out forwards; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); }
      50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
    }
    .quest-ready { animation: pulseGlow 1.6s infinite; }
  #seedTray{width:min(92vw,740px);max-width:92vw;min-width:0;overflow-x:auto;overscroll-behavior:contain;justify-content:flex-start;bottom:90px;scrollbar-width:thin}
    #seedTray.hidden{display:none!important}
    #seedTray .seed-close{position:sticky;left:0;z-index:2;flex:0 0 34px;background:#6d482e;color:white;border-radius:9px;padding:9px}
    #livingPanel{max-width:min(220px,80vw)!important;bottom:110px!important}
    #livingPanel button,#livingPanel select{border:1px solid #b78d58;border-radius:7px;padding:5px;background:#fff9e8;color:#583519}
    #livingPanel button:hover{background:#f7d791}
    #livingPanel[hidden],.living-hidden{display:none!important}
    #livingToggle,#livingToolsToggle{position:fixed;z-index:28;right:12px;bottom:12px;padding:8px 12px;color:#53351d;border:1px solid #ae783c;background:#fff5d9;border-radius:12px;font-weight:700;font-size:12px}
    #livingToolsToggle{right:auto;left:12px}
    @media(max-width:640px){#livingPanel{bottom:120px!important}#seedTray{bottom:78px;width:92vw}nav{overflow-x:auto;max-width:96vw!important}#livingToggle,#livingToolsToggle{bottom:84px}}
  </style>
</head>

      </div>
      <div class="leading-tight">
        <div class="flex items-center gap-1.5">
          <span class="font-extrabold text-amber-950 text-xs sm:text-sm tracking-tight">Ergün'ün Çiftliği</span>
          <span class="hidden md:inline-block text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">2.5D İzometrik</span>
        </div>
        <div class="mt-1 flex items-center gap-1.5">
          <div class="w-20 sm:w-28 h-2 bg-amber-900/15 rounded-full overflow-hidden border border-amber-700/25">
            <div id="hudXpBar" class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600 transition-all duration-300" style="width: 0%"></div>
          </div>
          <span id="hudXpText" class="text-[10px] font-bold text-amber-900/80">0/60 TP</span>
        </div>
      </div>
    </div>

    <!-- Atmosphere Controls (Day/Night & Season) -->
    <div class="pointer-events-auto hidden lg:flex items-center gap-1.5 wood-pill rounded-full px-2.5 py-1">
      <button id="btnCycleTime" class="px-2 py-0.5 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-950 text-[11px] font-bold transition flex items-center gap-1" title="Günün Saatini Değiştir (Sabah / Öğle / Gün Batımı / Gece)">
        <span id="hudTimeIcon">☀️</span>
        <span id="hudTimeLabel">Öğle</span>
      </button>
      <span class="text-amber-700/40">|</span>
      <button id="btnCycleSeason" class="px-2 py-0.5 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-950 text-[11px] font-bold transition flex items-center gap-1" title="Mevsimi Değiştir (İlkbahar / Yaz / Sonbahar)">
        <span id="hudSeasonLabel">Yaz</span>
      </button>
      <span class="text-amber-700/40">|</span>
      <button id="btnToggleWeather" class="px-2 py-0.5 rounded-full bg-sky-100 hover:bg-sky-200 text-sky-950 text-[11px] font-bold transition flex items-center gap-1" title="Hava Durumu (Yağmur tüm ekinleri otomatik sular!)">
        <span id="hudWeatherLabel">☀️ Güneşli</span>
      </button>
    </div>

    <!-- Currencies & Energy -->
    <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2 flex-wrap">
      <div class="wood-pill rounded-full px-2.5 sm:px-3 py-1 flex items-center gap-1.5" title="Altın">
        <span class="text-sm sm:text-base">🪙</span>
        <span id="hudCoins" class="font-extrabold text-amber-950 text-xs sm:text-sm tabular-nums">260</span>
      </div>
      <div class="wood-pill rounded-full px-2.5 sm:px-3 py-1 flex items-center gap-1.5" title="İnci (Hızlandırma ve Özel Eşyalar)">
        <span class="text-sm sm:text-base">🦪</span>
        <span id="hudPearls" class="font-extrabold text-sky-900 text-xs sm:text-sm tabular-nums">12</span>
      </div>
      <button id="btnEnergyRefill" class="wood-pill rounded-full px-2.5 sm:px-3 py-1 flex items-center gap-1.5 hover:brightness-95 active:scale-95 transition" title="Enerji (Zamanla dolar, tıklayarak doldur)">
        <span class="text-sm sm:text-base">⚡</span>
        <span id="hudEnergy" class="font-extrabold text-emerald-900 text-xs sm:text-sm tabular-nums">30/30</span>
        <span id="hudEnergyTimer" class="hidden sm:inline text-[10px] font-semibold text-amber-800/70"></span>
      </button>
      <button id="btnMute" class="wood-pill w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-sm sm:text-base hover:brightness-95 active:scale-95 transition" title="Sesi Aç/Kapa" aria-label="Sesi Aç veya Kapa">🔊</button>
      <button id="btnSettings" class="wood-pill w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-sm sm:text-base hover:brightness-95 active:scale-95 transition" title="Ayarlar, Atmosfer ve Yardım" aria-label="Ayarlar">⚙️</button>
    </div>
  </header>

  <!-- Left Side Quick Panels: Active Quest + Orders/Barn -->
  <aside class="pointer-events-none fixed left-2 sm:left-3 top-16 sm:top-20 z-20 flex flex-col gap-2 max-w-[230px] sm:max-w-[258px]">
    <div id="questCard" class="pointer-events-auto wood-pill rounded-2xl p-2.5 text-amber-950 transition">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-700 flex items-center gap-1">📋 Görev <span id="questIndexBadge">1/6</span></span>
        <span id="questRewardBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">+90 🪙</span>
      </div>
      <p id="questTitle" class="mt-1 text-xs font-bold leading-snug">Olgun ekinleri topla</p>
      <div class="mt-1.5 flex items-center gap-2">
        <div class="flex-1 h-2 bg-amber-900/15 rounded-full overflow-hidden">
          <div id="questProgressBar" class="h-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="questProgressText" class="text-[10px] font-bold text-amber-900">0/2</span>
      </div>
      <button id="btnClaimQuest" class="hidden mt-2 w-full py-1.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-xs shadow hover:brightness-105 active:scale-95 transition">Ödülü Al! 🎁</button>
    </div>

    <div class="pointer-events-auto flex items-center gap-1.5">
      <button id="btnOpenOrders" class="wood-pill relative flex-1 rounded-xl px-2.5 py-2 flex items-center justify-center gap-1.5 text-xs font-bold text-amber-950 hover:brightness-95 active:scale-95 transition">
        <span>📦</span>
        <span>Siparişler</span>
        <span id="ordersReadyDot" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 text-white text-[10px] font-extrabold flex items-center justify-center shadow">!</span>
      </button>
      <button id="btnOpenBarn" class="wood-pill relative flex-1 rounded-xl px-2.5 py-2 flex items-center justify-center gap-1.5 text-xs font-bold text-amber-950 hover:brightness-95 active:scale-95 transition">
        <span>🏚️</span>
        <span>Ambar</span>
        <span id="barnCountBadge" class="px-1.5 py-0.2 rounded-full bg-amber-200 text-amber-950 text-[10px] font-extrabold">2</span>
      </button>
    </div>

    <div class="pointer-events-auto flex items-center gap-1.5">

    // ==================== DETERMINISTIC MATH & NOISE (PERLIN + POISSON DISK) ====================
    function hash2(x, y) {
      let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function valueNoise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy), b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }
    function fbm2D(x, y, octaves = 3) {
      let val = 0, amp = 0.5, freq = 1;
      for (let i = 0; i < octaves; i++) {
        val += amp * valueNoise(x * freq, y * freq);
        freq *= 2.02;
        amp *= 0.5;
      }
      return val;
    }
    function poissonDiskSamples(width, height, minDist, maxSamples, seedOffset = 0) {
      const pts = [];
      let tries = 0;
      while (pts.length < maxSamples && tries < maxSamples * 14) {
        tries++;
        const x = hash2(tries * 1.13 + seedOffset, tries * 0.71) * width;
        const y = hash2(tries * 0.53, tries * 1.97 + seedOffset) * height;
        let ok = true;
        for (let i = 0; i < pts.length; i++) {
          if (Math.hypot(pts[i].x - x, pts[i].y - y) < minDist) { ok = false; break; }
        }
        if (ok) pts.push({ x, y, r: hash2(x, y) });
      }
      return pts;
    }

    function getTileElevation(gx, gy) {
      const cx = (GRID_SIZE - 1) / 2;
      const dist = Math.max(Math.abs(gx - cx), Math.abs(gy - cx));
      const edgeFade = Math.max(0, 1 - Math.max(0, dist - 5.2) / 4.2);
      const noise = fbm2D(gx * 0.42 + 11.3, gy * 0.42 + 7.1, 3);
      return Math.round((edgeFade * 10 + noise * 6) * 10) / 10;
    }

    const Sound = {
      ctx: null,
      muted: false,
      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
          return;
        }
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      },
      tone(freq, dur, type = 'sine', vol = 0.11, delay = 0) {
        if (this.muted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + dur + 0.02);
        } catch (e) {}
      },

    async function cleanNpcImage(src){
      const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src;});
      const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
      const w=c.width,h=c.height,d=g.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),q=new Int32Array(w*h);let head=0,tail=0;
      function push(i){if(i<0||i>=w*h||seen[i])return;seen[i]=1;const k=i*4,R=p[k],G=p[k+1],B=p[k+2],min=Math.min(R,G,B),max=Math.max(R,G,B);
        if(p[k+3]<25||(min>170&&max-min<48)||(R>205&&G>187&&B>170&&max-min<58)){q[tail++]=i;p[k+3]=0;}}
      for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
      while(head<tail){const i=q[head++],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);push(i-w);push(i+w);}
      // Decontaminate only semi-transparent edge pixels.
      for(let i=0;i<w*h;i++){const k=i*4,a=p[k+3];if(a>0&&a<245){const f=a/255;for(let j=0;j<3;j++)p[k+j]=Math.max(0,Math.min(255,(p[k+j]-235*(1-f))/f));}}
      g.putImageData(d,0,0);return c;
    }

    const castRules={ayse:{level:2,cost:180,role:'Bahçıvan'},murat:{level:3,cost:350,role:'Balıkçı'},ela:{level:4,cost:220,role:'Bahçe sakini'},deniz:{level:5,cost:260,role:'Bahçe sakini'},kemal:{level:6,cost:650,role:'Fırıncı'},selim:{level:8,cost:950,role:'Marangoz'}};

      if (level >= 3) pool.push('pineapple', 'milk', 'cheese', 'pie');

    function unlockCostForTile(x, y) {
      const dist = Math.max(
        Math.max(0, UNLOCK_INNER_MIN - x),
        Math.max(0, x - UNLOCK_INNER_MAX),
        Math.max(0, UNLOCK_INNER_MIN - y),
        Math.max(0, y - UNLOCK_INNER_MAX)
      );
      return dist <= 1 ? 140 : 240;
    }

    function generateOrder(level, salt = 0) {
      const pool = ['wheat', 'strawberry', 'papaya'];
      if (level >= 2) pool.push('corn', 'egg');
      if (level >= 3) pool.push('pineapple', 'milk', 'flour');
      if (level >= 4) pool.push('watermelon', 'wool', 'juice');
      const cust = CUSTOMER_NAMES[(Math.floor(Math.random() * CUSTOMER_NAMES.length) + salt) % CUSTOMER_NAMES.length];
      const reqCount = Math.random() < 0.55 ? 2 : 1;
      const reqs = {};
      let baseValue = 0;
      for (let i = 0; i < reqCount; i++) {
        const itemId = pool[Math.floor(Math.random() * pool.length)];
        const qty = 1 + Math.floor(Math.random() * 2);
        reqs[itemId] = (reqs[itemId] || 0) + qty;
      }
      Object.entries(reqs).forEach(([id, qty]) => { baseValue += (ITEMS[id]?.sell || 30) * qty; });
      return {
        id: 'ord_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
        customer: cust.name,
        icon: cust.icon,
        reqs,
        rewardCoins: Math.round(baseValue * 1.45),
        rewardXp: Math.max(15, Math.round(baseValue * 0.22)),
        rewardPearls: baseValue >= 140 ? 1 : 0
      };
    }

      if (!crop) return 0;
      return Math.min(1, Math.max(0, (now - crop.plantedAt) / 1000 / crop.duration));

      if (!entity || !entity.duration) return 0;

    function gridToWorld(gx, gy, elev = 0) {
      return {
        x: (gx - gy) * (TILE_W / 2),
        y: (gx + gy) * (TILE_H / 2) - elev
      };
    }

    function screenToGrid(sx, sy) {
      const wx = (sx - viewW / 2) / cam.zoom + cam.x;
      const wy = (sy - viewH / 2) / cam.zoom + cam.y + 8; // average elevation compensation
      const gx = (wx / (TILE_W / 2) + wy / (TILE_H / 2)) / 2;
      const gy = (wy / (TILE_H / 2) - wx / (TILE_W / 2)) / 2;
      return { x: Math.floor(gx), y: Math.floor(gy) };
    }

    function centerCamera() {
      cam.x = 0;
      cam.y = (GRID_SIZE - 1) * (TILE_H / 2) - 14;
      cam.vx = 0;
      cam.vy = 0;
      const fitZoom = Math.min(viewW / 1280, viewH / 760);
      cam.zoom = Math.max(0.56, Math.min(0.95, fitZoom));
      cam.targetZoom = cam.zoom;
    }

      for (let i = 0; i < 16; i++) {
        const ang = i * 2.39996;

    // ==================== CUSTOM WEBGL ATMOSPHERE & LIGHTING SHADER ====================
    const ATMOSPHERE_FRAG = `
      precision mediump float;
      varying vec2 vTextureCoord;
      uniform sampler2D uSampler;
      uniform vec3 uSunColor;
      uniform vec3 uAmbientColor;
      uniform vec3 uFogColor;
      uniform float uFogStrength;
      uniform float uNightFactor;
      uniform vec3 uSeasonTint;
      uniform vec2 uSunScreen;

      void main(void) {
        vec4 col = texture2D(uSampler, vTextureCoord);
        if (col.a <= 0.001) {
          gl_FragColor = col;
          return;
        }
        // Subtle normal-like screen luminance gradient for crisp 3D relief pop
        vec2 px = vec2(0.0012, 0.0018);
        float lR = dot(texture2D(uSampler, vTextureCoord + vec2(px.x, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
        float lL = dot(texture2D(uSampler, vTextureCoord - vec2(px.x, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
        float lD = dot(texture2D(uSampler, vTextureCoord + vec2(0.0, px.y)).rgb, vec3(0.299, 0.587, 0.114));
        float lU = dot(texture2D(uSampler, vTextureCoord - vec2(0.0, px.y)).rgb, vec3(0.299, 0.587, 0.114));
        vec3 pseudoN = normalize(vec3((lL - lR) * 2.2, (lU - lD) * 2.2, 1.0));
        vec3 sunDir = normalize(vec3(uSunScreen.x, uSunScreen.y, 0.72));
        float ndotl = clamp(dot(pseudoN, sunDir), 0.25, 1.15);

        vec3 lit = col.rgb * mix(uAmbientColor, uSunColor, ndotl) * uSeasonTint;

        // Atmospheric horizon mist (stronger toward top of viewport)
        float mist = clamp((1.0 - vTextureCoord.y) * uFogStrength, 0.0, 0.42);
        lit = mix(lit, uFogColor, mist);

        // Cinematic warm vignette & soft contrast
        vec2 uvC = vTextureCoord - 0.5;
        float vig = 1.0 - dot(uvC, uvC) * (0.18 + uNightFactor * 0.22);
        lit *= clamp(vig, 0.72, 1.02);

        gl_FragColor = vec4(clamp(lit, 0.0, 1.0), col.a);
      }
    `;

    async function initPixiEngine() {
      const container = document.getElementById('canvasContainer');
      viewW = container.clientWidth || window.innerWidth;
      viewH = container.clientHeight || window.innerHeight;

      app = new PIXI.Application({
        width: viewW,
        height: viewH,
        backgroundColor: 0x0e8ca8,
        antialias: true,
        resolution: Math.min(window.devicePixelRatio || 1, 2),
        autoDensity: true,
        powerPreference: 'high-performance'
      });
      container.innerHTML = '';
      container.appendChild(app.view);

      // Load Pre-rendered 3D Sprite Atlas
      const atlasBase = await loadImageTexture(ATLAS_SRC);
      Object.entries(ATLAS_FRAMES).forEach(([key, f]) => {
        spriteTextures[key] = new PIXI.Texture(
          atlasBase.baseTexture,
          new PIXI.Rectangle(f.x, f.y, f.w, f.h)
        );
      });

      for(const [id,canvas] of Object.entries(npcImages))npcTextures[id]=PIXI.Texture.from(canvas);
      // Pre-bake procedural 3D-shaded crops, flowers, shadows, glows
      Object.keys(CROPS).forEach(cid => {
        cropTextures[cid] = [
          makeProceduralCropTexture(cid, 0),
          makeProceduralCropTexture(cid, 1),
          makeProceduralCropTexture(cid, 2)
        ];
      });
      flowerTexture = makeFlowerBedTexture();
      shadowTexture = makeShadowTexture();
      warmGlowTexture = makeSoftGlowTexture('#ffbe55', 140);

      // Build Layered Scene Graph
      oceanLayer = new PIXI.Container();
      worldContainer = new PIXI.Container();
      terrainLayer = new PIXI.Container();
      shadowLayer = new PIXI.Container();
      ySortLayer = new PIXI.Container();
      ySortLayer.sortableChildren = true;
      fxLayer = new PIXI.Container();
      lightLayer = new PIXI.Container();

      worldContainer.addChild(terrainLayer, shadowLayer, ySortLayer, fxLayer, lightLayer);
      app.stage.addChild(oceanLayer, worldContainer);

      // Attach Custom WebGL Atmosphere Filter
      try {
        const tp = TIME_PRESETS[timePresetIdx];
        atmosphereFilter = new PIXI.Filter(undefined, ATMOSPHERE_FRAG, {
          uSunColor: tp.tint,
          uAmbientColor: tp.ambient,
          uFogColor: tp.fog,
          uFogStrength: tp.fogAmt,
          uNightFactor: tp.night,
          uSeasonTint: SEASONS[seasonIdx].tint,
          uSunScreen: [tp.sunDir[0], tp.sunDir[1]]
        });
        worldContainer.filters = [atmosphereFilter];
      } catch (e) {
        atmosphereFilter = null;
      }

      oceanGraphics = new PIXI.Graphics();
      oceanLayer.addChild(oceanGraphics);

      buildOrganicIslandBase();
      buildTileSceneObjects();
      buildCharactersAndWildlife();

      fxGraphics = new PIXI.Graphics();
      fxLayer.addChild(fxGraphics);

      centerCamera();
      applyAtmosphereVisuals();

      gameLoop(0.016);
      app.ticker.add((delta) => {try{gameLoop(delta/60);}catch(err){console.error('WebGL frame failed; switching to Canvas',err);startSafeFallback();}});
    }

    function loadImageTexture(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(PIXI.Texture.from(img));
        img.onerror = (err) => reject(err);
        img.src = src;
      });
    }

    // ==================== ORGANIC ISLAND BASE (BAKED NOISE + POISSON DISK DETAILS) ====================
    function buildOrganicIslandBase() {
      const baseG = new PIXI.Graphics();
      const topPt = gridToWorld(-0.7, -0.7, 0);
      const rightPt = gridToWorld(GRID_SIZE + 0.7, -0.7, 0);
      const bottomPt = gridToWorld(GRID_SIZE + 0.7, GRID_SIZE + 0.7, 0);
      const leftPt = gridToWorld(-0.7, GRID_SIZE + 0.7, 0);

      // Shallow turquoise coral shelf
      baseG.beginFill(0x38d9e8, 0.34);
      baseG.drawPolygon([
        topPt.x, topPt.y - 26,
        rightPt.x + 42, rightPt.y,
        bottomPt.x, bottomPt.y + 38,
        leftPt.x - 42, leftPt.y
      ]);
      baseG.endFill();

      // Sculpted sandstone cliff underside
      baseG.beginFill(0xb08448);
      baseG.drawPolygon([
        leftPt.x, leftPt.y,
        bottomPt.x, bottomPt.y,
        rightPt.x, rightPt.y,
        rightPt.x, rightPt.y + 24,
        bottomPt.x, bottomPt.y + 30,
        leftPt.x, leftPt.y + 24
      ]);
      baseG.endFill();

      // Warm golden sandy beach surface
      baseG.beginFill(0xf3d591);
      baseG.lineStyle(2.5, 0xd9b061, 0.9);
      baseG.drawPolygon([
        topPt.x, topPt.y,
        rightPt.x, rightPt.y,
        bottomPt.x, bottomPt.y,
        leftPt.x, leftPt.y
      ]);
      baseG.endFill();

      // Wooden pier extending into the turquoise bay
      const p0 = gridToWorld(GRID_SIZE + 0.15, 9.2, 2);
      baseG.lineStyle(1.5, 0x5c2d0c, 0.9);
      baseG.beginFill(0x8c5228);
      baseG.drawPolygon([
        p0.x, p0.y,
        p0.x + 68, p0.y + 35,
        p0.x + 48, p0.y + 47,
        p0.x - 20, p0.y + 12
      ]);
      baseG.endFill();
      // Pier wooden planks & posts
      for (let i = 1; i <= 5; i++) {
        const t = i / 6;
        baseG.lineStyle(1.2, 0x4a2308, 0.65);
        baseG.moveTo(p0.x + 68 * t, p0.y + 35 * t);
        baseG.lineTo(p0.x - 20 + 68 * t, p0.y + 12 + 35 * t);
      }
      // Pier support pilings
      [[p0.x + 64, p0.y + 36], [p0.x + 48, p0.y + 46]].forEach(([px, py]) => {
        baseG.beginFill(0x5c2d0c);
        baseG.drawRoundedRect(px - 3, py - 8, 6, 18, 2);
        baseG.endFill();
      });

      // Poisson Disk shoreline pebbles & shells
      const beachPts = poissonDiskSamples(GRID_SIZE, GRID_SIZE, 0.85, 34, 42);
      beachPts.forEach(pt => {
        const edge = Math.max(Math.abs(pt.x - 4.5), Math.abs(pt.y - 4.5));
        if (edge > 4.2) {
          const wp = gridToWorld(pt.x, pt.y, 0);
          baseG.beginFill(pt.r > 0.5 ? 0xc2b299 : 0x9ca3af, 0.75);
          baseG.drawEllipse(wp.x, wp.y + 12, 3.5 + pt.r * 3, 2 + pt.r * 1.5);
          baseG.endFill();
        }
      });

      terrainLayer.addChild(baseG);

      // Cute wooden sailboat gently moored by the pier
      boatSprite = new PIXI.Graphics();
      // Water reflection
      boatSprite.beginFill(0xffffff, 0.18);
      boatSprite.drawEllipse(0, 14, 22, 7);
      boatSprite.endFill();
      // Hull
      boatSprite.beginFill(0x7c2d12);
      boatSprite.drawPolygon([-18, 2, 18, 2, 11, 10, -12, 10]);
      boatSprite.endFill();
      boatSprite.beginFill(0xd97706);
      boatSprite.drawRect(-15, 0, 30, 3);
      boatSprite.endFill();
      // Mast & Billowing Sail
      boatSprite.beginFill(0x451a03);
      boatSprite.drawRect(-1, -28, 2.5, 30);
      boatSprite.endFill();
      boatSprite.beginFill(0xfffbeb);
      boatSprite.drawPolygon([1, -26, 17, -6, 1, -4]);
      boatSprite.endFill();
      boatSprite.beginFill(0xf43f5e);
      boatSprite.drawPolygon([1, -26, -11, -10, 1, -8]);
      boatSprite.endFill();
      boatSprite.x = p0.x + 86;
      boatSprite.y = p0.y + 46;
      boatSprite.baseY = boatSprite.y;
      boatSprite.zIndex = boatSprite.y + 20;
      ySortLayer.addChild(boatSprite);

      // Hover highlight graphics
      hoverGraphics = new PIXI.Graphics();
      hoverGraphics.zIndex = 5;
      terrainLayer.addChild(hoverGraphics);
    }

    function drawSingleTileGround(g, tile) {
      g.clear();
      const elev = tile.elevation || 0;
      const p = gridToWorld(tile.x, tile.y, elev);
      const n = fbm2D(tile.x * 0.6 + 3.1, tile.y * 0.6 + 5.7, 3);

      // Organic color blending (no stark checkerboard!)
      let fill = 0x62b84a;
      let stroke = 0x3b7a2c;
      let strokeAlpha = 0.16;

      if (!tile.unlocked) {
        fill = n > 0.52 ? 0x4a9442 : 0x42873b;
        stroke = 0x265922;
        strokeAlpha = 0.2;
      } else if (tile.type === 'soil') {
        fill = tile.crop?.watered ? 0x5c371d : 0x7c4d27;
        stroke = 0x4a2b13;
        strokeAlpha = 0.55;
      } else if (tile.type === 'deco' && tile.entity?.id === 'path') {
        fill = 0xbfb5a2;
        stroke = 0x8f836e;
        strokeAlpha = 0.45;
      } else {
        // Lush natural meadow tones driven by Perlin noise
        if (n < 0.42) fill = 0x5fb546;
        else if (n < 0.60) fill = 0x6dc250;
        else fill = 0x79ca58;
      }

      // Subtle bevel edge for elevation depth
      g.beginFill(0x3f7d32, 0.45);
      g.drawPolygon([
        p.x - TILE_W / 2, p.y + TILE_H / 2,
        p.x, p.y + TILE_H,
        p.x + TILE_W / 2, p.y + TILE_H / 2,
        p.x + TILE_W / 2, p.y + TILE_H / 2 + 5,
        p.x, p.y + TILE_H + 5,
        p.x - TILE_W / 2, p.y + TILE_H / 2 + 5
      ]);
      g.endFill();

      // Main isometric diamond
      g.lineStyle(1, stroke, strokeAlpha);
      g.beginFill(fill);
      g.drawPolygon([
        p.x, p.y,
        p.x + TILE_W / 2, p.y + TILE_H / 2,
        p.x, p.y + TILE_H,
        p.x - TILE_W / 2, p.y + TILE_H / 2
      ]);
      g.endFill();

      // Rich organic surface details (furrows, cobblestones, or grass tufts + wildflowers)
      if (tile.unlocked && tile.type === 'soil') {
        const furrowCol = tile.crop?.watered ? 0x3b210e : 0x543116;
        g.lineStyle(2.2, furrowCol, 0.55);
        for (let i = -2; i <= 2; i++) {
          const ox = i * 8, oy = i * 4.1;
          g.moveTo(p.x - 24 + ox, p.y + 18 + oy);
          g.lineTo(p.x + 14 + ox, p.y + 37 + oy);
        }
        if (tile.crop?.watered) {
          // Wet specular moisture sheen
          g.lineStyle(0);
          g.beginFill(0x7dd3fc, 0.12);
          g.drawEllipse(p.x, p.y + TILE_H * 0.5, 28, 12);
          g.endFill();
        }
      } else if (tile.unlocked && tile.type === 'deco' && tile.entity?.id === 'path') {
        // Handcrafted natural stone slabs
        g.lineStyle(1, 0x786c58, 0.55);
        [[-14, 24, 11, 5.5], [4, 20, 12, 6], [16, 29, 10, 5], [-4, 34, 13, 6], [-20, 31, 8, 4.5]].forEach(([dx, dy, rx, ry], idx) => {
          g.beginFill(idx % 2 === 0 ? 0xd6cfc0 : 0xc7bea9);
          g.drawEllipse(p.x + dx, p.y + dy, rx, ry);
          g.endFill();
        });
      } else if (tile.type === 'grass') {
        // Organic grass tufts & tiny wildflowers (Poisson-like hash distribution)
        const seed = tile.x * 31 + tile.y * 17;
        for (let i = 0; i < 4; i++) {
          const rx = (hash2(seed + i, 1.3) - 0.5) * 44;
          const ry = (hash2(seed + i, 2.7) - 0.5) * 20;
          const bx = p.x + rx, by = p.y + TILE_H * 0.5 + ry;
          g.lineStyle(1.3, 0x3b7a2a, 0.55);
          g.moveTo(bx, by); g.lineTo(bx - 2, by - 5);
          g.moveTo(bx, by); g.lineTo(bx + 2, by - 6);
          if (tile.unlocked && i === 0 && hash2(seed, 9.1) > 0.58) {
            g.lineStyle(0);
            g.beginFill(hash2(seed, 4.4) > 0.5 ? 0xfef08a : 0xffffff, 0.9);
            g.drawCircle(bx + 3, by - 3, 2.1);
            g.endFill();
          }
        }
      }
    }

    function buildTileSceneObjects() {
      for (let y = 0; y < GRID_SIZE; y++) {
        tileVisuals[y] = [];
        for (let x = 0; x < GRID_SIZE; x++) {
          const tile = state.grid[y][x];
          const ground = new PIXI.Graphics();
          terrainLayer.addChild(ground);

          const shadowSprite = new PIXI.Sprite(shadowTexture);
          shadowSprite.anchor.set(0.5, 0.5);
          shadowSprite.visible = false;
          shadowLayer.addChild(shadowSprite);

          const entityContainer = new PIXI.Container();
          ySortLayer.addChild(entityContainer);

          const glowSprite = new PIXI.Sprite(warmGlowTexture);
          glowSprite.anchor.set(0.5, 0.5);
          glowSprite.blendMode = PIXI.BLEND_MODES.ADD;
          glowSprite.visible = false;
          lightLayer.addChild(glowSprite);

          tileVisuals[y][x] = {
            ground, shadowSprite, entityContainer, glowSprite,
            mainSprite: null, badge: null, progBar: null,
            lastKey: ''
          };
          refreshTileVisual(x, y, true);
        }
      }
    }

    function refreshTileVisual(x, y, forceGround = false) {
      if (useCanvasFallback) return;
      const tile = state.grid[y][x];
      const vis = tileVisuals[y]?.[x];
      if (!vis) return;

      const p = gridToWorld(tile.x, tile.y, tile.elevation || 0);
      const centerX = p.x;
      const centerY = p.y + TILE_H * 0.5;

      if (forceGround) drawSingleTileGround(vis.ground, tile);

      // Determine current visual key to avoid unnecessary sprite rebuilds
      const now = Date.now();
      let key = '';
      if (!tile.unlocked) {
        key = 'locked_' + ((x + y) % 2 === 0 ? 'palm' : 'oak');
      } else if (tile.type === 'soil' && tile.crop) {
        const prog = getCropProgress(tile.crop, now);
        const stage = prog >= 1 ? 2 : prog >= 0.35 ? 1 : 0;
        key = `crop_${tile.crop.id}_${stage}_${tile.crop.watered ? 1 : 0}`;
      } else if (tile.type === 'animal' && tile.entity) {
        key = `animal_${tile.entity.id}`;
      } else if (tile.type === 'building' && tile.entity) {
        key = `building_${tile.entity.id}_${tile.entity.upgrade||1}`;
      } else if (tile.type === 'deco' && tile.entity && tile.entity.id !== 'path') {
        key = `deco_${tile.entity.id}`;
      } else {
        key = 'empty';
      }

      if (vis.lastKey !== key) {
        vis.lastKey = key;
        vis.entityContainer.removeChildren();
        vis.mainSprite = null;
        vis.badge = null;
        vis.progBar = null;
        vis.shadowSprite.visible = false;
        vis.glowSprite.visible = false;

        if (key.startsWith('locked_')) {
          const treeType = key.endsWith('palm') ? 'palm' : 'oak';
          const f = ATLAS_FRAMES[treeType];
          const sp = new PIXI.Sprite(spriteTextures[treeType]);
          const scaleVar = 0.72 + hash2(x, y) * 0.22;
          sp.anchor.set(0.5, f.anchorY);
          sp.scale.set(f.scale * scaleVar * (hash2(y, x) > 0.5 ? 1 : -1), f.scale * scaleVar);
          sp.alpha = 0.92;
          sp.tint = 0xcce8c8;
          vis.entityContainer.addChild(sp);
          vis.mainSprite = sp;
          vis.shadowSprite.visible = true;
          vis.shadowSprite.scale.set(0.75 * scaleVar, 0.7 * scaleVar);
        } else if (key.startsWith('crop_')) {
          const parts = key.split('_');
          const cid = parts[1], stage = Number(parts[2]);
          const spriteKey = stage === 0 ? 'crop_sprout' : ('crop_' + cid);
          const f = ATLAS_FRAMES[spriteKey] || ATLAS_FRAMES.crop_sprout;
          const stageScale = stage === 0 ? 0.85 : stage === 1 ? 0.68 : 1.0;
          const baked = spriteTextures[spriteKey];
          const sp = new PIXI.Sprite(baked || cropTextures[cid][stage]);
          sp.anchor.set(0.5, baked ? f.anchorY : 0.75);
          sp.scale.set(baked ? f.scale * stageScale : 0.85);
          vis.entityContainer.addChild(sp);
          vis.mainSprite = sp;
          vis.shadowSprite.visible = stage > 0;
          vis.shadowSprite.scale.set(0.5 * stageScale, 0.42 * stageScale);
          if (stage < 2) {
            const pb = new PIXI.Graphics();
            vis.entityContainer.addChild(pb);
            vis.progBar = pb;
          } else {
            vis.badge = createReadyBadge('✓', 0xfef08a, 0x92400e);
            vis.badge.y = -58;
            vis.entityContainer.addChild(vis.badge);
          }
        } else if (key.startsWith('animal_')) {
          const aDef = ANIMALS[tile.entity.id];
          const f = ATLAS_FRAMES[aDef.sprite];
          const sp = new PIXI.Sprite(spriteTextures[aDef.sprite]);
          sp.anchor.set(0.5, f.anchorY);
          sp.scale.set(f.scale);
          vis.entityContainer.addChild(sp);
          vis.mainSprite = sp;
          vis.shadowSprite.visible = true;
          vis.shadowSprite.scale.set(0.52, 0.45);
          vis.progBar = new PIXI.Graphics();
          vis.entityContainer.addChild(vis.progBar);
          vis.badge = createReadyBadge(aDef.productIcon, 0xffffff, 0xb45309);
          vis.badge.y = -58;
          vis.badge.visible = false;
          vis.entityContainer.addChild(vis.badge);
        } else if (key.startsWith('building_')) {
          const bDef = BUILDINGS[tile.entity.id];
          const f = ATLAS_FRAMES[bDef.sprite];
          const sp = new PIXI.Sprite(spriteTextures[bDef.sprite]);
          sp.anchor.set(0.5, f.anchorY);
          sp.scale.set(f.scale*(bDef.id==='farmhouse'?1+.1*((tile.entity.upgrade||1)-1):1));
          vis.entityContainer.addChild(sp);
          vis.mainSprite = sp;
          vis.shadowSprite.visible = true;
          vis.shadowSprite.scale.set(1.28, 1.15);
          vis.glowSprite.x = centerX;
          vis.glowSprite.y = centerY - 26;
          vis.glowSprite.scale.set(1.6, 1.3);
          vis.badge = createReadyBadge(bDef.productIcon || '🪙', 0xfef9c3, 0xb45309);
          vis.badge.y = -112;
          vis.badge.visible = false;
          vis.entityContainer.addChild(vis.badge);
        } else if (key.startsWith('deco_')) {
          const dDef = DECOS[tile.entity.id];
          if (dDef.sprite) {
            const f = ATLAS_FRAMES[dDef.sprite];
            const sp = new PIXI.Sprite(spriteTextures[dDef.sprite]);
            sp.anchor.set(0.5, f.anchorY);
            sp.scale.set(f.scale);
            vis.entityContainer.addChild(sp);
            vis.mainSprite = sp;
            vis.shadowSprite.visible = true;
            vis.shadowSprite.scale.set(dDef.id === 'fountain' ? 0.92 : 0.78, 0.72);
          } else if (dDef.id === 'flowers') {
            const sp = new PIXI.Sprite(flowerTexture);
            sp.anchor.set(0.5, 0.56);
            vis.entityContainer.addChild(sp);
            vis.mainSprite = sp;
          }
        }
      }

      // Position & Depth Sort (Y-Sorting)
      vis.entityContainer.x = centerX;
      vis.entityContainer.y = centerY;
      vis.entityContainer.zIndex = centerY;

      // Dynamic sun-projected cast shadow offset
      const tp = TIME_PRESETS[timePresetIdx];
      vis.shadowSprite.x = centerX + Math.sin(tp.shadowAng) * 14 * tp.shadowLen;
      vis.shadowSprite.y = centerY + 6 + Math.cos(tp.shadowAng) * 4;
      vis.shadowSprite.alpha = Math.max(0.18, 0.55 - tp.night * 0.32);

      // Warm window / lantern lighting at sunset & night
      if (tile.type === 'building') {
        vis.glowSprite.visible = tp.night > 0.2;
        vis.glowSprite.alpha = tp.night * 0.85;
      }
    }

    function createReadyBadge(label, fillHex, strokeHex) {
      const c = new PIXI.Container();
      const bg = new PIXI.Graphics();
      bg.lineStyle(2, strokeHex, 1);
      bg.beginFill(fillHex);
      bg.drawCircle(0, 0, 13);
      bg.endFill();
      const txt = new PIXI.Text(label, {
        fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: '800', fill: strokeHex
      });
      txt.anchor.set(0.5);
      c.addChild(bg, txt);
      return c;
    }

        const sbTxt = new PIXI.Text('', {

    function drawArticulatedNPC(g, npc, time) {
      g.clear();
      const moving = Math.hypot(npc.tx - npc.gx, npc.ty - npc.gy) > 0.06;
      const stride = moving ? Math.sin(npc.stridePhase * 11) : 0;
      const bob = moving ? Math.abs(Math.sin(npc.stridePhase * 11)) * 2.6 : Math.sin(time * 2.2) * 0.8;
      const f = npc.facing;

      // Articulated legs (stride-coupled biomechanics, zero foot sliding)
      const legL = stride * 5.5;
      const legR = -stride * 5.5;
      g.lineStyle(4.2, npc.pantsColor, 1);
      g.moveTo(-3, -15 - bob); g.lineTo(-3 + legL, -2);
      g.moveTo(3, -15 - bob);  g.lineTo(3 + legR, -2);

      // Boots
      g.lineStyle(0);
      g.beginFill(0x451a03);
      g.drawEllipse(-3 + legL, -1, 3.6, 2);
      g.drawEllipse(3 + legR, -1, 3.6, 2);
      g.endFill();

      // Torso (realistic human proportions)
      g.beginFill(npc.shirtColor);
      g.drawRoundedRect(-7.5, -34 - bob, 15, 20, 5);
      g.endFill();
      // Subtle shading highlight
      g.beginFill(0xffffff, 0.16);
      g.drawRoundedRect(-5, -32 - bob, 6, 15, 3);
      g.endFill();

      // Arms swinging opposite to legs
      const armSwing = -stride * 5;
      g.lineStyle(3.5, 0xf1c29b, 1);
      g.moveTo(-7, -30 - bob); g.lineTo(-9 + armSwing, -18 - bob);
      g.moveTo(7, -30 - bob);
      if (npc.state === 'fishing') {
        g.lineTo(13 * f, -24 - bob);
        // Fishing rod
        g.lineStyle(1.6, 0x78350f, 1);
        g.moveTo(13 * f, -24 - bob); g.lineTo(32 * f, -38 - bob);
        g.lineStyle(0.9, 0xe0f2fe, 0.7);
        g.moveTo(32 * f, -38 - bob); g.lineTo(34 * f, -8);
      } else {
        g.lineTo(9 - armSwing, -18 - bob);
      }

      // Head
      g.lineStyle(0);
      g.beginFill(0xf1c29b);
      g.drawCircle(0, -42 - bob, 7.2);
      g.endFill();
      // Hair / Cap
      g.beginFill(npc.hairColor);
      g.drawEllipse(0, -46 - bob, 7.6, 4.5);
      g.endFill();
      // Eyes
      g.beginFill(0x1e293b);
      g.drawCircle(2.2 * f, -42 - bob, 1.1);
      g.endFill();
    }

        if(k===goal){const path=[];let n=k;while(n!==first){path.unshift({x:n%GRID_SIZE+.5,y:Math.floor(n/GRID_SIZE)+.5});n=prev.get(n);}return path;}

    function moveFarmerTo(gx, gy, action = 'working') {

    function updateFarmerAnimation(dt, now) {
      const fdx = farmer.tx - farmer.gx;
      const fdy = farmer.ty - farmer.gy;
      const fdist = Math.hypot(fdx, fdy);
      const elev = getTileElevation(farmer.gx, farmer.gy);
      const fp = gridToWorld(farmer.gx, farmer.gy, elev);

      if (fdist > 0.06) {
        farmer.state = 'walking';
        const targetSpeed=Math.min(3.8,Math.sqrt(2*12*fdist));farmer.speed=(farmer.speed||0)+(targetSpeed-(farmer.speed||0))*Math.min(1,dt*14);const speed=Math.max(.35,farmer.speed);
        const step = Math.min(fdist, dt * speed);
        farmer.gx += (fdx / fdist) * step;
        farmer.gy += (fdy / fdist) * step;
        farmer.stridePhase += step * 3.6;
        const isoDx = (fdx - fdy);
        if (Math.abs(isoDx) > 0.02) farmer.facing = isoDx >= 0 ? 1 : -1;

        // Alternate realistically between stride pose and passing pose
        const cycle = Math.sin(farmer.stridePhase * 2.8);
        farmer.currentPose = Math.abs(cycle) > 0.28 ? 'ergun_walk' : 'ergun';

        // Footstep dust puffs behind Ergün's boots
        farmer.stepDustTimer -= dt;
        if (farmer.stepDustTimer <= 0) {
          farmer.stepDustTimer = 0.22;
          burstParticles.push({
            x: fp.x - farmer.facing * 6,
            y: fp.y + TILE_H * 0.5 + 2,
            vx: -farmer.facing * (8 + Math.random() * 10),
            vy: -10 - Math.random() * 12,
            color: 0xd6c7a9,
            size: 2.5 + Math.random() * 2,
            life: 0.42,
            maxLife: 0.42
          });
        }
      } else if (farmer.actionTimer > 0) {
        farmer.actionTimer -= dt;
        farmer.state = farmer.pendingAction || 'working';
        if (farmer.state === 'harvesting' || farmer.state === 'carrying') {
          farmer.currentPose = 'ergun_harvest';
        } else if (farmer.state === 'plowing' || farmer.state === 'planting' || farmer.state === 'watering' || farmer.state === 'working') {
          farmer.currentPose = 'ergun_work';
        } else {
          farmer.currentPose = 'ergun';
        }

        farmer.actionFxTimer -= dt;

          farmer.actionFxTimer = 0.14;
          const fxX = fp.x + farmer.facing * 18;
          const fxY = fp.y + TILE_H * 0.5 - 12;
          if (farmer.state === 'watering') {
            for (let k = 0; k < 3; k++) {
              burstParticles.push({
                x: fxX, y: fxY - 10,
                vx: farmer.facing * (24 + Math.random() * 20),
                vy: -18 - Math.random() * 14,

            }
          } else if (farmer.state === 'planting') {

              x: fxX, y: fxY - 8,
              vx: (Math.random() - 0.5) * 18,
              vy: 8 + Math.random() * 12,
              color: 0xfef08a, size: 2.4, life: 0.45, maxLife: 0.45
            });
          } else if (farmer.state === 'plowing') {
            burstParticles.push({
              x: fxX, y: fxY + 4,
              vx: (Math.random() - 0.5) * 32,
              vy: -32 - Math.random() * 18,
              color: 0x854d0e, size: 3.0, life: 0.45, maxLife: 0.45
            });

            burstParticles.push({
              x: fp.x + (Math.random() - 0.5) * 24, y: fp.y + TILE_H * 0.5 - 32,
              vx: (Math.random() - 0.5) * 18,
              vy: -26 - Math.random() * 16,
              color: 0xfacc15, size: 2.8, life: 0.55, maxLife: 0.55
            });
          }
        }

      if (farmer.state === 'walking') {
        bounce = Math.abs(Math.sin(farmer.stridePhase * 2.8)) * 5.2;
        rot = Math.sin(farmer.stridePhase * 2.8) * 0.055;
      } else if (farmer.state === 'plowing' || farmer.state === 'planting' || farmer.state === 'watering' || farmer.state === 'working') {
        const workWave = Math.sin(envTime * 11);
        bounce = Math.max(0, workWave) * 2.2;
        rot = farmer.facing * (0.04 + workWave * 0.045);
        scaleYMult = 0.98 + workWave * 0.025;
      } else if (farmer.state === 'harvesting' || farmer.state === 'carrying') {
        const joy = Math.abs(Math.sin(envTime * 7));
        bounce = joy * 4.5;
        scaleYMult = 1 + joy * 0.03;
      } else {
        // Gentle idle breathing
        scaleYMult = 1 + Math.sin(envTime * 2.4) * 0.014;
      }
      return { fp, bounce, rot, scaleYMult };
    }

    function handleTileClick(gx, gy) {
      Sound.init();
      if (gx < 0 || gy < 0 || gx >= GRID_SIZE || gy >= GRID_SIZE) return;
      const tile = state.grid[gy][gx];
      const now = Date.now();

      if (!tile.unlocked) {
        const cost = unlockCostForTile(gx, gy);
        if (state.coins >= cost) {
          state.coins -= cost;
          tile.unlocked = true;
          Sound.harvest();
          moveFarmerTo(gx, gy, 'woodcutting');
          addXp(18, gx, gy);
          addFloatText(gx, gy, '🏝️ Parsel Açıldı!', '#fef08a');
          spawnBurst(gx, gy, 0x34d399, 16);
          advanceQuest('unlock_tile');
          refreshTileVisual(gx, gy, true);
          updateHUD();
          saveState();
        } else {
          Sound.error();
          showToast(`Bu ada parselini açmak için ${cost} Altın gerekiyor.`, 'error');
        }
        return;
      }

      if (activeTool === 'remove') {
        if (tile.type === 'building' && tile.entity?.id === 'farmhouse') {
          Sound.error();
          showToast('Ergün\'ün Evi kaldırılamaz!', 'error');
          return;
        }
        if (tile.type === 'grass') {
          showToast('Burası zaten boş çimen.', 'info');
          return;
        }
        tile.type = 'grass';
        tile.crop = null;
        tile.entity = null;
        Sound.plow();
        moveFarmerTo(gx, gy, 'plowing');
        addFloatText(gx, gy, '🧹 Temizlendi', '#e2e8f0');
        refreshTileVisual(gx, gy, true);
        updateHUD();
        saveState();
        return;
      }

      if (activeTool === 'place' && placingItem) {
        if (tile.type !== 'grass') {
          Sound.error();
          showToast('Yerleştirmek için boş bir çimen kareye tıkla!', 'error');
          return;
        }
        const catalog = placingItem.category === 'animal' ? ANIMALS : placingItem.category === 'building' ? BUILDINGS : DECOS;
        const def = catalog[placingItem.id];
        if (!def) return;

        if (def.currency === 'pearls') {
          if (state.pearls < def.cost) { Sound.error(); showToast(`Yeterli İnci yok (${def.cost} 🦪 gerekli).`, 'error'); return; }
          state.pearls -= def.cost;
        } else {
          if (state.coins < def.cost) { Sound.error(); showToast(`Yeterli Altın yok (${def.cost} 🪙 gerekli).`, 'error'); return; }
          state.coins -= def.cost;
        }

        tile.type = placingItem.category;
        if (placingItem.category === 'deco') {
          tile.entity = { id: def.id };
        } else {
          tile.entity = { id: def.id, lastCollectAt: now, duration: def.prodSec || 20, roamX: 0, roamY: 0, roamPhase: Math.random() * 6 };
        }

        Sound.harvest();
        moveFarmerTo(gx, gy);
        addXp(def.xp || 15, gx, gy);
        addFloatText(gx, gy, `${def.icon} ${def.name}!`, '#fef08a');
        spawnBurst(gx, gy, 0xf59e0b, 14);

        if (placingItem.category === 'animal') advanceQuest('place_animal');
        if (placingItem.category === 'building') advanceQuest('place_building');
        if (placingItem.category !== 'deco') { placingItem = null; setTool('hand'); }
        refreshTileVisual(gx, gy, true);
        updateHUD();
        saveState();
        return;
      }

      if (activeTool === 'plow') {
        if (tile.type !== 'grass') { Sound.error(); showToast('Sadece boş çimen alanlar sürülebilir.', 'error'); return; }
        if (state.coins < 10) { Sound.error(); showToast('Tarla sürmek için 10 Altın gerekli.', 'error'); return; }
        if (!spendEnergy(1)) return;
        state.coins -= 10;
        tile.type = 'soil';
        tile.crop = null;
        Sound.plow();
        moveFarmerTo(gx, gy, 'plowing');
        addXp(3, gx, gy);
        addFloatText(gx, gy, '⛏️ Sürüldü', '#fde68a');
        spawnBurst(gx, gy, 0x92400e, 9);
        refreshTileVisual(gx, gy, true);
        updateHUD();
        saveState();
        return;
      }

      if (activeTool === 'plant') {
        const cropDef = CROPS[selectedSeed];
        if (!cropDef) return;
        if (state.level < cropDef.minLevel) { Sound.error(); showToast(`${cropDef.name} Seviye ${cropDef.minLevel}'de açılır.`, 'error'); return; }
        if (tile.type === 'grass') {
          const totalCost = 10 + cropDef.cost;
          if (state.coins < totalCost) { Sound.error(); showToast(`Sürmek + ekmek için ${totalCost} Altın gerekli.`, 'error'); return; }
          if (!spendEnergy(1)) return;
          state.coins -= totalCost;
          tile.type = 'soil';
          tile.crop = { id: cropDef.id, plantedAt: now, duration: cropDef.growSec, watered: false };
          Sound.plant();
          moveFarmerTo(gx, gy, 'planting');
          addXp(4, gx, gy);
          addFloatText(gx, gy, `${cropDef.icon} Ekildi`, '#bbf7d0');
          spawnBurst(gx, gy, cropDef.color, 9);
          if (cropDef.id === 'papaya') advanceQuest('plant_papaya');
          refreshTileVisual(gx, gy, true);
          updateHUD();
          saveState();
          return;
        }
        if (tile.type === 'soil' && !tile.crop) {
          if (state.coins < cropDef.cost) { Sound.error(); showToast(`${cropDef.name} tohumu için ${cropDef.cost} Altın gerekli.`, 'error'); return; }
          if (!spendEnergy(1)) return;
          state.coins -= cropDef.cost;
          tile.crop = { id: cropDef.id, plantedAt: now, duration: cropDef.growSec, watered: false };
          Sound.plant();
          moveFarmerTo(gx, gy, 'planting');
          addXp(2, gx, gy);
          addFloatText(gx, gy, `${cropDef.icon} Ekildi`, '#bbf7d0');
          spawnBurst(gx, gy, cropDef.color, 9);
          if (cropDef.id === 'papaya') advanceQuest('plant_papaya');
          refreshTileVisual(gx, gy, true);
          updateHUD();
          saveState();
          return;
        }
        showToast('Tohum ekmek için boş bir tarlaya veya çimene tıkla.', 'info');
        return;
      }

      if (activeTool === 'water') {
        if (tile.type === 'soil' && tile.crop) {
          const prog = getCropProgress(tile.crop, now);
          if (prog >= 1) { harvestCrop(tile, gx, gy); return; }
          if (tile.crop.watered) { showToast('Bu ekin zaten sulandı! 💧', 'info'); return; }
          if (!spendEnergy(1)) return;
          tile.crop.watered = true;
          const remaining = Math.max(1, tile.crop.duration - (now - tile.crop.plantedAt) / 1000);
          tile.crop.plantedAt -= remaining * 0.45 * 1000;
          Sound.water();
          moveFarmerTo(gx, gy, 'watering');
          addXp(3, gx, gy);
          addFloatText(gx, gy, '💧 Hızlandı!', '#7dd3fc');
          spawnBurst(gx, gy, 0x38bdf8, 12);
          refreshTileVisual(gx, gy, true);
          updateHUD();
          saveState();
          return;
        }
        showToast('Sulamak için büyümekte olan bir ekine tıkla.', 'info');
        return;
      }

      if (activeTool === 'fertilize') {
        if (tile.type === 'soil' && tile.crop) {
          if (tile.crop.fertilized) { showToast('Bu ekin zaten gübrelendi (×2 Verim)! 🧪', 'info'); return; }
          if (state.fertilizer <= 0) {
            if (state.coins >= 25) {
              state.coins -= 25;
              state.fertilizer += 1;
            } else {
              Sound.error(); showToast('Gübre kalmadı! (Mağaza veya 25 Altın gerekli)', 'error'); return;
            }
          }
          state.fertilizer -= 1;
          tile.crop.fertilized = true;
          Sound.harvest();
          moveFarmerTo(gx, gy);
          addXp(5, gx, gy);
          addFloatText(gx, gy, '🧪 ×2 Verim!', '#4ade80');
          spawnBurst(gx, gy, 0x4ade80, 14);
          updateHUD(); saveState();
          return;
        }
        showToast('Gübrelemek için ekili bir tarlaya tıkla!', 'info');
        return;
      }

      // HAND TOOL
      if (activeTool === 'hand') {
        if (tile.type === 'soil' && tile.crop) {
          if (getCropProgress(tile.crop, now) >= 1) harvestCrop(tile, gx, gy);
          else openSpeedUpModal(tile, gx, gy);
          return;
        }
        if (tile.type === 'soil' && !tile.crop) {
          setTool('plant');
          showToast('Tohum seç ve bu tarlaya ek! 🌱', 'info');
          return;
        }
        if (tile.type === 'animal' && tile.entity) {
          const aDef = ANIMALS[tile.entity.id];
          const prog = getEntityProgress(tile.entity, now);
          if (prog >= 1) {
            if (!spendEnergy(1)) return;
            tile.entity.lastCollectAt = now;
            state.barn[aDef.productId] = (state.barn[aDef.productId] || 0) + 1;
            Sound.harvest();
            moveFarmerTo(gx, gy);
            addXp(aDef.xp, gx, gy);
            addFloatText(gx, gy, `+1 ${aDef.productIcon} ${aDef.productName}`, '#fef08a');
            spawnBurst(gx, gy, 0xfacc15, 11);
            updateHUD();
            saveState();
          } else {
            showToast(`${aDef.icon} ${aDef.name} ürün hazırlıyor (${Math.ceil(tile.entity.duration * (1 - prog))} sn kaldı).`, 'info');
          }
          return;
        }
        if (tile.type === 'building' && tile.entity) {
          const bDef = BUILDINGS[tile.entity.id];
          const prog = getEntityProgress(tile.entity, now);
          if (bDef.id === 'farmhouse') {
            if (prog >= 1) {
              tile.entity.lastCollectAt = now;
              const bonus = 30 + state.level * 10;
              state.coins += bonus;
              Sound.coin();
              moveFarmerTo(gx, gy);
              addFloatText(gx, gy, `+${bonus} 🪙 Ev Bonusu!`, '#fde047');
              spawnBurst(gx, gy, 0xfacc15, 14);
              updateHUD();
              saveState();
            } else {
              openResidents();
            }
            return;
          }
          if (prog >= 1) {
            if(!consumeBuildingInputs(bDef.id))return;
            tile.entity.lastCollectAt = now;
            if (bDef.id === 'bungalow') {
              state.coins += bDef.sell;
              Sound.coin();
              moveFarmerTo(gx, gy);
              addXp(bDef.xp, gx, gy);
              addFloatText(gx, gy, `+${bDef.sell} 🪙 Otel Geliri!`, '#fde047');
              spawnBurst(gx, gy, 0x34d399, 14);
            } else {
              state.barn[bDef.productId] = (state.barn[bDef.productId] || 0) + 1;
              Sound.harvest();
              moveFarmerTo(gx, gy);
              addXp(bDef.xp, gx, gy);
              addFloatText(gx, gy, `+1 ${bDef.productIcon} ${bDef.productName}`, '#fef08a');
              spawnBurst(gx, gy, 0xfb923c, 12);
            }
            updateHUD();
            saveState();
          } else {
            showToast(`${bDef.icon} ${bDef.name} çalışıyor (${Math.ceil(tile.entity.duration * (1 - prog))} sn kaldı).`, 'info');
          }
        }
      }
    }

    function harvestCrop(tile, gx, gy) {
      if(!executingJob){enqueueHarvest(tile,gx,gy);return;}
      if(!tile.crop||getCropProgress(tile.crop,Date.now())<1)return;
      if (!spendEnergy(1)) return;
      const cropDef = CROPS[tile.crop.id];
      const qty = tile.crop.fertilized ? 2 : 1;
      tile.crop = null;
      state.barn[cropDef.id] = (state.barn[cropDef.id] || 0) + qty;
      state.stats.harvested += 1;
      Sound.harvest();
      moveFarmerTo(gx, gy, 'harvesting');
      addXp(cropDef.xp * qty, gx, gy);
      addFloatText(gx, gy, `+${qty} ${cropDef.icon} ${cropDef.name}${qty > 1 ? ' (×2!)' : ''}`, '#fef08a');
      spawnBurst(gx, gy, cropDef.color, 14);
      advanceQuest('harvest');
      refreshTileVisual(gx, gy, true);
      updateHUD();
      saveState();
    }

    // ==================== MAIN GAME LOOP (60 FPS PIXI TICKER) ====================
    function gameLoop(dt) {
      dt = Math.min(0.05, dt || 0.016);
      envTime += dt;
      livingTick(dt);
      const now = Date.now();

      // 1. Inertial Camera Pan & Smooth Zoom
      const panAccel = 1400 / cam.zoom;
      if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) cam.vx -= panAccel * dt;
      if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) cam.vx += panAccel * dt;
      if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) cam.vy -= panAccel * dt;
      if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) cam.vy += panAccel * dt;

      cam.x += cam.vx * dt;
      cam.y += cam.vy * dt;
      const damp = Math.exp(-8.5 * dt);
      cam.vx *= damp;
      cam.vy *= damp;
      cam.zoom += (cam.targetZoom - cam.zoom) * Math.min(1, dt * 10);

      worldContainer.x = viewW / 2 - cam.x * cam.zoom;
      worldContainer.y = viewH / 2 - cam.y * cam.zoom;
      worldContainer.scale.set(cam.zoom);

      // 2. Animated Tropical Ocean & Shoreline Foam
      const tp = TIME_PRESETS[timePresetIdx];
      oceanGraphics.clear();
      const oceanHex = tp.night > 0.6 ? 0x072b42 : tp.id === 'sunset' ? 0x0f5f7a : 0x0e9ab8;
      oceanGraphics.beginFill(oceanHex);
      oceanGraphics.drawRect(0, 0, viewW, viewH);
      oceanGraphics.endFill();

      oceanGraphics.lineStyle(2, 0xffffff, tp.night > 0.6 ? 0.08 : 0.16);
      for (let i = 0; i < 16; i++) {
        const wy = ((i * 68 + envTime * 10) % (viewH + 80)) - 40;
        const wx = ((i * 180 + Math.sin(envTime * 0.8 + i) * 38) % (viewW + 120)) - 60;
        oceanGraphics.moveTo(wx, wy);
        oceanGraphics.quadraticCurveTo(wx + 24, wy - 6, wx + 48, wy);
      }

      // Boat bobbing
      if (boatSprite) {
        boatSprite.y = boatSprite.baseY + Math.sin(envTime * 2.2) * 3.2;
        boatSprite.rotation = Math.sin(envTime * 1.6) * 0.04;
      }

      // 3. Energy Regeneration
      if (state.energy < state.maxEnergy) {
        const elapsedSec = (now - state.lastEnergyAt) / 1000;
        if (elapsedSec >= 4) {
          state.energy = Math.min(state.maxEnergy, state.energy + Math.floor(elapsedSec / 4));
          state.lastEnergyAt = now - ((elapsedSec % 4) * 1000);
          updateHUD();
        }
        const timerEl = document.getElementById('hudEnergyTimer');
        if (timerEl) timerEl.textContent = `+1 (${Math.max(1, Math.ceil(4 - ((now - state.lastEnergyAt) / 1000)))}s)`;
      } else {
        state.lastEnergyAt = now;
        const timerEl = document.getElementById('hudEnergyTimer');
        if (timerEl) timerEl.textContent = '';
      }

      // 4. Update Tiles, Wind Sway, Animal Roaming & Progress Bars
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const tile = state.grid[y][x];
          const vis = tileVisuals[y][x];
          refreshTileVisual(x, y, false);

          if (vis.mainSprite) {
            // Wind sway on trees & crops
            if (!tile.unlocked || tile.type === 'soil' || (tile.type === 'deco' && (tile.entity?.id === 'palm' || tile.entity?.id === 'oak'))) {
              vis.mainSprite.skew.x = Math.sin(envTime * 1.8 + x * 0.7 + y * 0.5) * 0.032;
            }
          }

          if (tile.type === 'soil' && tile.crop && vis.progBar) {
            const prog = getCropProgress(tile.crop, now);
            vis.progBar.clear();
            vis.progBar.beginFill(0x0f172a, 0.55);
            vis.progBar.drawRoundedRect(-20, 8, 40, 6, 3);
            vis.progBar.endFill();
            vis.progBar.beginFill(tile.crop.watered ? 0x38bdf8 : 0x4ade80);
            vis.progBar.drawRoundedRect(-19, 9, 38 * prog, 4, 2);
            vis.progBar.endFill();
          }

          if (tile.type === 'animal' && tile.entity) {
            // Gentle living animal roaming inside its pasture zone
            tile.entity.roamPhase = (tile.entity.roamPhase || 0) + dt * 0.7;
            const rx = Math.sin(tile.entity.roamPhase) * 10;
            const ry = Math.cos(tile.entity.roamPhase * 0.7) * 5;
            const hop = Math.abs(Math.sin(tile.entity.roamPhase * 3.2)) * 2.5;
            if (vis.mainSprite) {
              vis.mainSprite.x = rx;
              vis.mainSprite.y = ry - hop;
              const f = ATLAS_FRAMES[ANIMALS[tile.entity.id].sprite];
              vis.mainSprite.scale.x = f.scale * (Math.cos(tile.entity.roamPhase) >= 0 ? 1 : -1);
            }
            const prog = getEntityProgress(tile.entity, now);
            if (vis.badge) {
              vis.badge.visible = prog >= 1;
              vis.badge.y = -58 + Math.sin(envTime * 4) * 3;
            }
            if (vis.progBar) {
              vis.progBar.clear();
              if (prog < 1) {
                vis.progBar.beginFill(0x0f172a, 0.5);
                vis.progBar.drawRoundedRect(-16, 10, 32, 5, 2.5);
                vis.progBar.endFill();
                vis.progBar.beginFill(0xfbbf24);
                vis.progBar.drawRoundedRect(-15, 11, 30 * prog, 3, 1.5);
                vis.progBar.endFill();
              }
            }
          }

          if (tile.type === 'building' && tile.entity && vis.badge) {
            const prog = getEntityProgress(tile.entity, now);
            vis.badge.visible = prog >= 1;
            vis.badge.y = -110 + Math.sin(envTime * 3.8) * 3.5;
          }
        }
      }

      // 5. Hover Tile Highlight
      hoverGraphics.clear();
      if (hoverTile) {
        const ht = state.grid[hoverTile.y]?.[hoverTile.x];
        if (ht) {
          const hp = gridToWorld(ht.x, ht.y, ht.elevation || 0);
          const hlCol = !ht.unlocked ? 0xfacc15 : activeTool === 'remove' ? 0xf43f5e : 0xffffff;
          hoverGraphics.lineStyle(2.4, 0xffffff, 0.95);
          hoverGraphics.beginFill(hlCol, 0.28);
          hoverGraphics.drawPolygon([
            hp.x, hp.y,
            hp.x + TILE_W / 2, hp.y + TILE_H / 2,
            hp.x, hp.y + TILE_H,
            hp.x - TILE_W / 2, hp.y + TILE_H / 2
          ]);
          hoverGraphics.endFill();
        }
      }

      // 6. Farmer Ergün Multi-Pose Biomechanical Animation & Y-Sorting
      const { fp, bounce: fBounce, rot: fRot, scaleYMult: fScaleY } = updateFarmerAnimation(dt, now);
      const poseMeta = ATLAS_FRAMES[farmer.currentPose] || ATLAS_FRAMES.ergun;
      if (spriteTextures[farmer.currentPose] && farmerSprite.texture !== spriteTextures[farmer.currentPose]) {
        farmerSprite.texture = spriteTextures[farmer.currentPose];
        farmerSprite.anchor.set(0.5, poseMeta.anchorY);
      }
      farmerContainer.x = fp.x;
      farmerContainer.y = fp.y + TILE_H * 0.5;
      farmerContainer.zIndex = farmerContainer.y + 2;
      farmerSprite.y = -fBounce;
      farmerSprite.scale.set(poseMeta.scale * farmer.facing, poseMeta.scale * fScaleY);
      farmerSprite.rotation = fRot;
      farmerShadow.x = fp.x + Math.sin(tp.shadowAng) * 8;
      farmerShadow.y = fp.y + TILE_H * 0.5 + 4;

      // 7. Living NPCs Daily Routines & Biomechanical Walk
      npcVisuals.forEach(({ npc, cont, bodyG, npcSprite, sh, speechBubble, sbTxt }) => {
        cont.visible=sh.visible=residentActive(npc);
        if(!cont.visible)return;
        npcStep(npc,dt);
        const ndx = npc.tx - npc.gx, ndy = npc.ty - npc.gy;
        const ndist = Math.hypot(ndx, ndy);
        if (ndist > 0.05) {
          const desired=Math.min(1.6,Math.sqrt(2*4*ndist));npc.speed=(npc.speed||0)+(desired-(npc.speed||0))*Math.min(1,dt*9);
          const step = Math.min(ndist, dt * Math.max(.25,npc.speed));
          npc.gx += (ndx / ndist) * step;
          npc.gy += (ndy / ndist) * step;
          npc.stridePhase += step * 1.3;
          const isoDx = ndx - ndy;
          if (Math.abs(isoDx) > 0.02) npc.facing = isoDx >= 0 ? 1 : -1;
        }
        const nElev = getTileElevation(npc.gx, npc.gy);
        const np = gridToWorld(npc.gx, npc.gy, nElev);
        cont.x = np.x;
        cont.y = np.y + TILE_H * 0.5;
        cont.zIndex = cont.y + 1;
        sh.x = np.x + Math.sin(tp.shadowAng) * 7;
        sh.y = np.y + TILE_H * 0.5 + 3;
        if(npcSprite){const m=npcMotion(npc,envTime),scale=(npcHeights[npc.id]||90)/npcSprite.texture.height;npcSprite.y=-m.bob;npcSprite.rotation=m.angle;npcSprite.scale.set(scale*npc.facing,scale*m.stretch);}
        else drawArticulatedNPC(bodyG, npc, envTime);
        if(sbTxt.text!==npc.speech)sbTxt.text=npc.speech||'';
        speechBubble.visible=ndist<.06&&!!npc.speech&&(npc.chatUntil>envTime||Math.sin(envTime*.55+npc.home[0])>.92);
        if(speechBubble.visible){sbTxt.style.wordWrap=true;sbTxt.style.wordWrapWidth=130;const bg=speechBubble.children[0];bg.clear();bg.beginFill(0xfffdf5,.96);bg.drawRoundedRect(-Math.max(44,sbTxt.width/2+5),-sbTxt.height/2-5,Math.max(88,sbTxt.width+10),sbTxt.height+10,7);bg.endFill();}
      });

      // 8. Ambient Wildlife, Chimney Smoke, Butterflies, Birds & Burst Particles
      fxGraphics.clear();

      // Farmhouse chimney smoke
      if (Math.random() < dt * 2.2) {
        const fh = gridToWorld(5, 5, state.grid[5][5].elevation || 6);
        smokePuffs.push({ x: fh.x + 42, y: fh.y - 76, r: 4, life: 2.2, maxLife: 2.2 });
      }
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const s = smokePuffs[i];
        s.life -= dt;
        if (s.life <= 0) { smokePuffs.splice(i, 1); continue; }
        s.x += dt * 12;
        s.y -= dt * 18;
        s.r += dt * 4.5;
        fxGraphics.beginFill(0xfffbeb, (s.life / s.maxLife) * 0.35);
        fxGraphics.drawCircle(s.x, s.y, s.r);
        fxGraphics.endFill();
      }

      // Flying birds with ground shadows
      birds.forEach(b => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.wingPhase += dt * 8;
        if (b.x > 700) { b.x = -700; b.y = -200 + Math.random() * 420; }
        const flap = Math.sin(b.wingPhase) * 6;
        // Ground shadow
        fxGraphics.beginFill(0x0f172a, 0.14);
        fxGraphics.drawEllipse(b.x + 18, b.y + 70, 9, 4);
        fxGraphics.endFill();
        // Bird wings
        fxGraphics.lineStyle(2.2, 0xffffff, 0.92);
        fxGraphics.moveTo(b.x - 10, b.y + flap);
        fxGraphics.quadraticCurveTo(b.x - 4, b.y - 4, b.x, b.y);
        fxGraphics.quadraticCurveTo(b.x + 4, b.y - 4, b.x + 10, b.y + flap);
      });

      // Fluttering butterflies
      fxGraphics.lineStyle(0);
      butterflies.forEach(bf => {
        bf.phase += dt * 2.2;
        const gx = bf.gx + Math.sin(bf.phase * 0.7) * 0.7;
        const gy = bf.gy + Math.cos(bf.phase * 0.5) * 0.7;
        const bp = gridToWorld(gx, gy, 24 + Math.sin(bf.phase * 3) * 6);
        const wing = 2.5 + Math.abs(Math.sin(bf.phase * 9)) * 2.5;
        fxGraphics.beginFill(bf.color, 0.9);
        fxGraphics.drawEllipse(bp.x - wing * 0.6, bp.y, wing, 2.2);
        fxGraphics.drawEllipse(bp.x + wing * 0.6, bp.y, wing, 2.2);
        fxGraphics.endFill();
      });

      // Wind-drifting seasonal leaves
      const leafCol = SEASONS[seasonIdx].leafColor;
      driftingLeaves.forEach(lf => {
        lf.x += lf.vx * dt; lf.y += (lf.vy + Math.sin(envTime * 2 + lf.phase) * 8) * dt;
        if (lf.x > 650) { lf.x = -650; lf.y = -200 + Math.random() * 500; }
        fxGraphics.beginFill(leafCol, 0.65);
        fxGraphics.drawEllipse(lf.x, lf.y, 4, 2);
        fxGraphics.endFill();
      });

      // Fireflies at sunset/night
      if (tp.night > 0.25) {
        fireflies.forEach(ff => {
          ff.phase += dt * 2.5;
          const fp2 = gridToWorld(ff.gx + Math.sin(ff.phase * 0.4) * 0.4, ff.gy + Math.cos(ff.phase * 0.3) * 0.4, 18 + Math.sin(ff.phase) * 6);
          const a = (0.4 + 0.6 * Math.abs(Math.sin(ff.phase * 1.8))) * tp.night;
          fxGraphics.beginFill(0xfef08a, a);
          fxGraphics.drawCircle(fp2.x, fp2.y, 2.6);
          fxGraphics.endFill();
        });
      }

      // Burst particles
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const pt = burstParticles[i];
        pt.life -= dt;
        if (pt.life <= 0) { burstParticles.splice(i, 1); continue; }
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += 120 * dt;
        fxGraphics.beginFill(pt.color, Math.max(0, pt.life / pt.maxLife));
        fxGraphics.drawCircle(pt.x, pt.y, pt.size);
        fxGraphics.endFill();
      }

      // Floating texts
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.life -= dt;
        if (ft.life <= 0) {
          fxLayer.removeChild(ft.sprite);
          ft.sprite.destroy();
          floatTexts.splice(i, 1);
          continue;
        }
        ft.sprite.y -= 34 * dt;
        ft.sprite.alpha = Math.min(1, ft.life * 1.5);
      }

      // Update Hover Tooltip
      updateTooltip(now);

      // Periodic auto-save
      if (now - lastSaveTime > 10000) { saveState(); lastSaveTime = now; }
    }

    function updateTooltip(now) {
      const tip = document.getElementById('tileTooltip');
      if (!hoverTile) { tip.classList.add('hidden'); return; }
      const tile = state.grid[hoverTile.y]?.[hoverTile.x];
      if (!tile) { tip.classList.add('hidden'); return; }

      let icon = '🌿', text = 'Doğal Çimen';
      if (!tile.unlocked) {
        icon = '🔒'; text = `Kilitli Parsel — Açmak için tıkla (${unlockCostForTile(tile.x, tile.y)} 🪙)`;
      } else if (tile.type === 'soil' && tile.crop) {
        const cDef = CROPS[tile.crop.id];
        const prog = getCropProgress(tile.crop, now);
        icon = cDef.icon;
        text = prog >= 1 ? `${cDef.name} — Hasada Hazır! (Tıkla)` : `${cDef.name} — ${Math.ceil(tile.crop.duration * (1 - prog))} sn kaldı${tile.crop.watered ? ' 💧' : ''}`;
      } else if (tile.type === 'soil') {
        icon = '🟫'; text = 'Sürülmüş Tarla — Tohum ekebilirsin';
      } else if (tile.type === 'animal' && tile.entity) {
        const aDef = ANIMALS[tile.entity.id];
        const prog = getEntityProgress(tile.entity, now);
        icon = aDef.icon;
        text = prog >= 1 ? `${aDef.name} — ${aDef.productName} Hazır!` : `${aDef.name} — ${Math.ceil(tile.entity.duration * (1 - prog))} sn kaldı`;
      } else if (tile.type === 'building' && tile.entity) {
        const bDef = BUILDINGS[tile.entity.id];
        const prog = getEntityProgress(tile.entity, now);
        icon = bDef.icon;
        text = prog >= 1 ? `${bDef.name} — Toplamaya Hazır!` : `${bDef.name} — ${Math.ceil(tile.entity.duration * (1 - prog))} sn kaldı`;
      } else if (tile.type === 'deco' && tile.entity) {
        const dDef = DECOS[tile.entity.id];
        icon = dDef.icon; text = dDef.name;
      }

      document.getElementById('tooltipIcon').textContent = icon;
      document.getElementById('tooltipText').textContent = text;
      tip.classList.remove('hidden');
    }

    // ==================== MODALS (SHOP, BARN, ORDERS, SPEEDUP, SETTINGS) ====================
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    function openModal(title, html, onAfterRender) {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalBackdrop.classList.remove('hidden');
      if (onAfterRender) onAfterRender();
    }
    function closeModal() { modalBackdrop.classList.add('hidden'); }

    function openSpeedUpModal(tile, gx, gy) {
      const cropDef = CROPS[tile.crop.id];
      const prog = getCropProgress(tile.crop, Date.now());
      const left = Math.max(1, Math.ceil(tile.crop.duration * (1 - prog)));
      openModal(`${cropDef.icon} ${cropDef.name} Büyüyor`, `
        <div class="text-center py-2">
          <div class="text-4xl mb-2">${cropDef.icon}</div>
          <p class="text-sm font-semibold text-amber-900">Hasada yaklaşık <strong>${left} saniye</strong> kaldı.</p>
          <p class="text-xs text-amber-800/80 mt-1">Sulama Kovası ile hızlandırabilir veya 1 İnci ile anında olgunlaştırabilirsin.</p>
          <div class="mt-4 flex items-center justify-center gap-2">
            <button id="btnInstantGrow" class="px-4 py-2 rounded-xl bg-gradient-to-r from-sky-500 to-cyan-500 text-white font-bold text-sm shadow hover:brightness-105 active:scale-95 transition">
              🦪 1 İnci ile Hemen Olgunlaştır
            </button>
          </div>
        </div>
      `, () => {
        document.getElementById('btnInstantGrow').addEventListener('click', () => {
          if (state.pearls < 1) { Sound.error(); showToast('Yeterli İnci yok!', 'error'); return; }
          state.pearls -= 1;
          tile.crop.plantedAt = Date.now() - tile.crop.duration * 1000 - 500;
          Sound.harvest();
          spawnBurst(gx, gy, 0x38bdf8, 14);
          addFloatText(gx, gy, '✨ Hazır!', '#7dd3fc');
          refreshTileVisual(gx, gy, false);
          closeModal();
          updateHUD();
          saveState();
        });
      });
    }
