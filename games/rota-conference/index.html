      {name:'Acil belge tamamlama ekibi kur',desc:'Misafirlerden bilgileri topla, yetkili birime ilet, resmi onay sonrasında giriş planını uygula.',cost:5500,sat:7,punc:7,rep:3,tag:'+7 memnuniyet / +7 dakiklik'},
      {name:'Onay beklenirken programı değiştir',desc:'Otel fuayesinde kısa sunum organize et; ziyaret yalnızca resmi onayla başlasın.',cost:2500,sat:1,punc:0,rep:1,tag:'+1 memnuniyet / kontrollü süreç'},
      {name:'Grubu kapıya planlandığı gibi gönder',desc:'Ek bütçe harcama; resmi onay gelene kadar misafirler dışarıda beklesin.',cost:0,sat:-16,punc:-14,rep:-3,tag:'−16 memnuniyet / −14 dakiklik'}
    ]}
  };
  const fresh=()=>({phase:'brief',quote:385000,accepted:false,negotiating:false,choices:{hotel:null,venue:null,transport:null,catering:null,staff:null,flight:null,av:null,weather:null,permit:null},audit:[],scored:false});
  let state=fresh();
  try{const previous=JSON.parse(localStorage.getItem(STORAGE_KEY));if(previous&&phases.includes(previous.phase)&&previous.choices&&typeof previous.quote==='number')state={...fresh(),...previous,choices:{...fresh().choices,...previous.choices}}}catch(e){}
  const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}};
  const keys=['hotel','venue','transport','catering','staff','flight','av','weather','permit'];
  const entry=(key)=>{const idx=state.choices[key];return Number.isInteger(idx)&&idx>=0&&idx<(vendors[key]||incidents[key]).items.length?(vendors[key]||incidents[key]).items[idx]:null};
  const selectedCost=()=>keys.reduce((sum,key)=>sum+(entry(key)?.cost||0),0);
  const allVendors=()=>['hotel','venue','transport','catering','staff'].every(k=>entry(k));
  const total=()=>FEE+selectedCost();
  const synergy=()=>{
    const effect={sat:0,punc:0,rep:0,notes:[]};
    if(state.choices.transport===2&&entry('flight')){effect.sat+=2;effect.punc+=3;effect.notes.push('VIP transfer filosu geciken uçağı daha kolay karşıladı.')}
    if(state.choices.venue===1&&entry('av')){effect.punc+=3;effect.notes.push('Konferans merkezinin teknik altyapısı arızayı hafifletti.')}
    if(state.choices.staff===2&&entry('permit')){effect.punc+=4;effect.rep+=1;effect.notes.push('Kıdemli ekip izin belgelerini hızla tamamladı.')}
    if(state.choices.catering===2&&entry('weather')){effect.sat+=2;effect.notes.push('Premium servis ekibi kapalı salon planını destekledi.')}
    return effect;
  };
  const sat=()=>clamp(62+keys.reduce((s,k)=>s+(entry(k)?.sat||0),0)+synergy().sat,0,100);
  const punc=()=>clamp(78+keys.reduce((s,k)=>s+(entry(k)?.punc||0),0)+synergy().punc,0,100);
  const rep=()=>keys.reduce((s,k)=>s+(entry(k)?.rep||0),0)+synergy().rep;
  const margin=()=>state.quote-total();
  const pct=()=>state.quote>0?Math.round(margin()/state.quote*100):0;
  const stageIndex=()=>phases.indexOf(state.phase);
  function summary(){
    const i=stageIndex(),completed=i===phases.length-1,estimate=allVendors();
    const shownCost=completed||estimate;
    return `<section class="dashboard" aria-label="Proje göstergeleri">
      <div class="metric"><label>Sözleşme tutarı</label><strong id="metric-quote">${money(state.quote)}</strong><small>Üst müşteri bütçesi ${money(BUDGET)}</small></div>
      <div class="metric"><label>${shownCost?'Toplam proje maliyeti':'Başlangıç tahmini'}</label><strong id="metric-cost">${money(shownCost?total():363000)}</strong><small>${shownCost?'Seçimler + sabit gider':'Dengeli tedarik paketi'}</small></div>
      <div class="metric"><label>${shownCost?'Kâr / zarar':'Hedef brüt kâr'}</label><strong id="metric-profit" class="${shownCost&&margin()<0?'negative':''}">${money(shownCost?margin():state.quote-363000)}</strong><small>${shownCost?'Tahmini net operasyon farkı':'Kesinleşen teklif değil'}</small></div>
      <div class="metric"><label>Müşteri memnuniyeti</label><strong>${i<2?'—':sat()+' / 100'}</strong><small>${i<2?'Operasyon başlayınca güncellenecek':'Seçimlerinle değişir'}</small></div>
    </section>`;
  }
  function side(){
    const remaining=state.quote-total(),isSelected=allVendors();
    return `<aside class="side">
      <div class="side-card"><div class="side-title">MÜŞTERİ BRİFİ</div><h3 style="font-size:16px;margin:0 0 12px">Blue Horizon Maritime</h3>
        <div class="row"><span>Konuk</span><span class="right">45 kişi</span></div>
        <div class="row"><span>Uluslararası misafir</span><span class="right">32 kişi / 7 ülke</span></div>
        <div class="row"><span>Süre</span><span class="right">3 gün / 2 gece</span></div>
        <div class="row"><span>Lokasyon</span><span class="right">Antalya</span></div>
        <div class="row"><span>Müşteri üst limiti</span><span class="right">${money(BUDGET)}</span></div>
        <div class="divider"></div>
        <p>Öncelikler: <b>dakiklik</b>, güçlü kurumsal imaj, bütçe kontrolü ve güvenli tesis ziyareti.</p>
      </div>
      <div class="side-card"><div class="side-title">OPERASYON SAĞLIĞI</div>
       <div class="row"><span>Memnuniyet</span><strong>${sat()}/100</strong></div><div class="bar"><span style="width:${sat()}%"></span></div>
       <div class="row"><span>Dakiklik</span><strong>${punc()}/100</strong></div><div class="bar orange"><span style="width:${punc()}%"></span></div>
       <p class="mini-note">İtibar değişimi: <b class="${rep()>=0?'positive':'negative'}">${rep()>0?'+':''}${rep()}</b> puan. Proje sonucu tüm kararlarına bağlıdır.</p>
      </div>
      ${isSelected?`<div class="side-card"><div class="side-title">ANLIK BÜTÇE</div>
       <div class="row"><span>Teklif</span><span class="right">${money(state.quote)}</span></div>
       <div class="row"><span>Öngörülen toplam gider</span><span class="right">${money(total())}</span></div>
       <div class="divider"></div><div class="row"><strong>Kalan kâr</strong><strong class="${remaining<0?'negative':'positive'}">${money(remaining)}</strong></div>
       <p>${remaining<0?'Proje şu anda zarar yazıyor. Sonraki kararlarında maliyeti sınırlamaya çalış.':'Beklenmedik masraflar bu kârı azaltabilir.'}</p></div>`:''}
    </aside>`;
  }
  function header(){
    const idx=stageIndex(),progress=idx===0?0:Math.round((idx/(phases.length-1))*100);
    return `<header class="topbar"><div class="top-inner"><div class="brand">ROTA.<small>EXPERIENCES</small></div><a class="to-baba" href="../../index.html#oyunlar" target="_top">← BABA. Oyunlar</a><div class="top-right"><span class="top-tag">CASE STUDY / 001</span><button class="reset-top" data-action="reset">↺ Sıfırla</button></div></div></header>
    <main class="shell">
    <section class="banner"><div class="banner-copy"><div class="eyebrow">INTERACTIVE MISSION · CORPORATE EVENTS</div><h1>Uluslararası Denizcilik Konferansı</h1><p>Teklifini oluştur. Ekibini görevlendir. Üç günü yönet. Doğru operasyon kararlarıyla müşterinin güvenini ve şirketinin kârını kazan.</p></div>
     <div class="ship" aria-hidden="true"><svg viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 131h288l-31 35H61L22 131Z" fill="#38B7B2" opacity=".55"/><path d="M81 100h157v31H81v-31Z" fill="#C5E5DE" opacity=".27"/><path d="M98 71h133v29H98V71Z" fill="#D7F6ED" opacity=".25"/><path d="M118 42h92v29h-92V42Z" fill="#E3F5EE" opacity=".25"/><path d="M142 15h11v27h-11V15Z" fill="#AADAD6"/><path d="M43 172c27-8 53-8 80 0s53 8 80 0 54-8 81 0" stroke="#6FD7D5" stroke-width="4" opacity=".6"/><path d="M17 181c27-8 53-8 80 0s53 8 80 0 54-8 81 0" stroke="#6FD7D5" stroke-width="2" opacity=".4"/><path d="M249 29l42 19" stroke="#86CECC" stroke-width="2" stroke-linecap="round"/><path d="M291 48h-24" stroke="#86CECC" stroke-width="2" stroke-linecap="round"/></svg></div>
    </section><div class="mission-route"><span class="${idx>=2?'passed':''}">◉ Teklif</span><span class="${idx>=6?'passed':''}">◉ Planlama</span><span class="${idx>=7?'passed':''}">◉ Operasyon</span><span class="${idx===phases.length-1?'passed':''}">◉ Sonuç</span></div>${summary()}
    <section class="progress-section"><div class="progress-line"><strong>GÖREV İLERLEMESİ</strong><span>${idx===0?'Brifing':idx===phases.length-1?'Tamamlandı':`Aşama ${idx} / ${phases.length-2}`} · %${progress}</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div></section>
    <div class="layout"><section class="stage" id="main-stage" aria-live="polite">`;
  }
  function footer(){return `</section>${side()}</div><footer class="footer">ROTA. EXPERIENCES © CONFERENCE SIMULATOR · Kurgu senaryo, temsili maliyetler · Tüm ilerleme bu cihazda saklanır.</footer></main>`;}
  function briefing(){return `<span class="stage-index">GÖREV DOSYASI / 001</span><h2>İlk büyük kurumsal müşterin.</h2>
    <p class="lead">Blue Horizon Maritime şirketi Antalya'da 45 kişilik, üç günlük uluslararası bir konferans düzenlemek istiyor. Sen ROTA. Experiences'ın kurucusu ve operasyon yöneticisisin. <b>Kazanacağın iş, sonraki büyüme fırsatlarının kapısını açabilir.</b></p>
    <div class="brief-grid"><div class="brief-tile"><span>Katılımcılar</span><strong>45 kişi</strong></div><div class="brief-tile"><span>Konaklama</span><strong>32 oda × 2 gece</strong></div><div class="brief-tile"><span>Etkinlik süresi</span><strong>3 gün</strong></div><div class="brief-tile"><span>Müşterinin bütçesi</span><strong>${money(BUDGET)}</strong></div></div>
    <div class="callout"><strong>Hedef:</strong> Müşteri memnuniyetini 72+, dakikliği 65+ puanda tut ve sözleşmeyi zarar etmeden tamamla. Yüksek kâr tek başına iyi sonuç için yeterli değil.</div>
    <p class="section-label">Oyunda seni bekleyenler</p>
    <p class="lead">Bir fiyat teklifi, beş tedarikçi ve ekip kararı, dört canlı operasyon krizi. Kararlar geri alınabilir; sürpriz olaylar başladıktan sonra daha önce seçtiğin bütçeyle ilerlersin.</p>
    <div class="actions"><button class="btn" data-action="start">Müşteriye teklif hazırla →</button></div>`;}
  function bid(){return `<span class="stage-index">SATIŞ / TEKLİF</span><h2>Teklif fiyatını belirle.</h2>
    <p class="lead">Müşteri yönetimi işi tek bir firmaya verecek. Fiyatın yükseldikçe operasyon için daha fazla alanın olur, ancak müşterinin onaylı <strong>${money(BUDGET)}</strong> bütçe sınırı var.</p>
    <div class="price-quote"><div class="quote-head"><div><span>ROTA. / TOPLAM HİZMET TEKLİFİ</span><br><strong id="quote-value">${money(state.quote)}</strong></div><div style="text-align:right"><span>Seçenek<br>tek sözleşme / tüm kapsam</span></div></div>
    <input class="range" type="range" id="price-range" min="350000" max="450000" step="5000" value="${state.quote}" aria-label="Teklif fiyatı" />
    <div class="range-end"><span>₺350.000</span><span>₺450.000</span></div><div class="quote-strip"><span>Örnek dengeli paket maliyeti <b>${money(363000)}</b></span><b id="price-difference">${money(state.quote-363000)} fark</b></div></div>
    <div class="callout ${state.negotiating?'alert':''}" id="bid-feedback">${state.negotiating?`<strong>Müşteri karşı teklifi:</strong> İstediğin fiyat bütçeyi aşıyor. Sözleşme en fazla ${money(BUDGET)} üzerinden onaylanabilir.`:`<strong>Teklif kapsamı:</strong> 32 misafir için 2 gece konaklama, 45 kişi konferans, transferler, yemekler ve son gün tesis ziyareti. Tedarikçi seçimlerini sözleşme onayından sonra yapacaksın.`}</div>
    <div class="actions"><button class="btn" data-action="submit-bid">Teklifi müşteriye gönder →</button>${state.negotiating?'<button class="btn secondary" data-action="accept-counter">Karşı teklifi kabul et · ₺410.000</button>':''}<button class="btn ghost" data-action="back">← Brifing</button></div>
    <p class="fine">Fiyatlar yalnızca bu simülasyon için hazırlanmıştır; gerçek hizmet teklifi veya piyasa araştırması değildir.</p>`;}
  function choicesPage(key){
    const data=vendors[key]||incidents[key];const crisis=!!incidents[key];
    const intro=crisis?`<div class="stage-situation"><span class="situation-time ${key==='av'?'urgent':''}">${data.time}</span>${data.situation}</div>`:'';
    return `<span class="stage-index">${data.stage}</span><h2>${data.title}</h2><p class="lead">${data.lead}</p>${intro}
      <div class="section-label">${crisis?'Nasıl müdahale edeceksin?':'Bir tedarikçi seç'}</div>
      <div class="option-grid">${data.items.map((item,index)=>{
        let badge=item.sat<0||item.punc<0?'bad':'';
        return `<button type="button" class="opt" data-action="choose" data-section="${key}" data-index="${index}"><span><span class="opt-name">${index===0?'01':index===1?'02':'03'} · ${item.name}</span><span class="opt-desc">${item.desc}</span></span><span><span class="opt-price">${item.cost===0?'Ücretsiz':'+'+money(item.cost)}</span><span class="opt-impact ${badge}">${item.tag}</span></span></button>`;
      }).join('')}</div>
      <div class="choice-foot">${crisis?'Bir seçeneğe dokunduğunda olay sonuçlanır ve sonraki operasyon aşamasına geçersin.':'Her seçim proje maliyetini ve hizmet kalitesini değiştirir. Operasyon sırasında beklenmeyen giderler oluşabilir.'}<br>${crisis?'':'Not: '+data.hint}</div>
      <div class="actions">${!crisis?'<button class="btn ghost" data-action="back">← Önceki aşama</button>':''}</div>`;
  }
  function finish(){
    const gain=margin(), satisfaction=sat(), onTime=punc(), approved=state.accepted;
    const profitOK=gain>=0, satOK=satisfaction>=72, punctOK=onTime>=65;
    let status,blurb,grade;
    if(profitOK&&satisfaction>=85&&onTime>=85&&gain>=9000){status='Mükemmel operasyon';grade='A+';blurb='Müşteri çok memnun kaldı, ROTA. kâr etti. Yeni uluslararası projeler için güçlü bir referans kazandın.'}
    else if(profitOK&&satOK&&punctOK){status='Konferans başarıyla tamamlandı';grade='A';blurb='Müşteri beklentilerini karşılayarak projeyi kârla kapattın. Bir sonraki etkinlik için güven kazandın.'}
    else if(!profitOK&&satOK&&punctOK){status='Harika hizmet, ama zarar ettin';grade='B';blurb='Misafirler mutlu; fakat acil giderler ve seçimler bütçeni aştı. Sonraki teklifinde kâr payını daha iyi korumalısın.'}
    else if(profitOK){status='Kâr var, müşteri ilişkisi riskte';grade='C';blurb='Bilanço olumlu olsa da memnuniyet veya dakiklik yeterli değil. Tekrar iş alma ihtimali düştü.'}
    else{status='Görev beklenen sonucu vermedi';grade='D';blurb='Hem bütçe hem müşteri deneyimi baskı altında kaldı. Doğru tedarik ve kriz planlarıyla yeniden dene.'}
    const breakdown=[['Otel',entry('hotel')?.cost||0],['Konferans alanı',entry('venue')?.cost||0],['Transfer',entry('transport')?.cost||0],['İkram ve gala',entry('catering')?.cost||0],['Operasyon ekibi',entry('staff')?.cost||0],['Teknik ekip / sigorta / koordinasyon',FEE],['Geciken uçuş çözümü',entry('flight')?.cost||0],['Teknik arıza çözümü',entry('av')?.cost||0],['Yağmur krizi çözümü',entry('weather')?.cost||0],['Tesis giriş izni çözümü',entry('permit')?.cost||0]];
    const details=keys.map(k=>{const c=entry(k);return `<div class="recap-item"><b>${({hotel:'Otel',venue:'Salon',transport:'Transfer',catering:'İkram',staff:'Ekip',flight:'Uçuş gecikmesi',av:'Teknik arıza',weather:'Gala krizi',permit:'Tesis girişi'})[k]}</b>${c?c.name:'Seçim yapılmadı'}</div>`}).join('');
    return `<span class="stage-index">GÖREV RAPORU / TAMAMLANDI</span><h2>Üç günlük konferans sona erdi.</h2><p class="lead">Müşterinin geri bildirimi ve projenin mali tablosu hazır. İşte kararlarının sonucu:</p>
    <div class="result-lead"><div class="eyebrow" style="color:#a8eed7">PROJE DERECESİ / ${grade}</div><h3>${status}</h3><p>${blurb}</p></div>
    <div class="result-kpis"><div class="result-kpi"><span>Kâr / zarar</span><strong class="${gain<0?'negative':'positive'}">${money(gain)}</strong></div><div class="result-kpi"><span>Kâr marjı</span><strong>${pct()}%</strong></div><div class="result-kpi"><span>Memnuniyet</span><strong>${satisfaction}/100</strong></div><div class="result-kpi"><span>Dakiklik</span><strong>${onTime}/100</strong></div><div class="result-kpi"><span>İtibar artışı</span><strong>${rep()>0?'+':''}${rep()} puan</strong></div><div class="result-kpi"><span>Sözleşme</span><strong>${approved?'Kazanıldı':'—'}</strong></div></div>
    <div class="cost-table"><h3 style="margin:0 0 8px;font-size:18px">Finansal rapor</h3><div class="cost-row"><span>Proje geliri</span><strong>${money(state.quote)}</strong></div>${breakdown.map(([k,v])=>`<div class="cost-row"><span>${k}</span><strong>− ${money(v)}</strong></div>`).join('')}<div class="cost-row total"><span>Toplam maliyet</span><strong>${money(total())}</strong></div><div class="cost-row total"><span>Net operasyon kârı / zararı</span><strong class="${gain<0?'negative':'positive'}">${money(gain)}</strong></div></div>
    <details style="margin-top:20px"><summary style="cursor:pointer;font-weight:800;font-size:14px">Tüm kararları incele</summary>${details}</details>
    <div class="callout"><strong>Ekip ve tedarikçi sinerjileri:</strong> ${synergy().notes.join(' ')||'Sinerji oluşmadı. Doğru ekibi ve tedarikçileri eşleştirerek krizlerde avantaj kazanabilirsin.'}</div>
    <div class="callout"><strong>Oyunun mesajı:</strong> Müşteri memnuniyeti, kusursuz zamanlama ve kâr aynı anda yönetilmesi gereken üç ayrı hedeftir. Yüksek fiyatla değil, doğru operasyon sistemiyle kazanırsın.</div>
    <div class="callout"><strong>Kariyer rekorun:</strong> ${(()=>{try{return JSON.parse(localStorage.getItem('rota_conference_records_v2'))?.bestScore||0}catch(_){return 0}})()} puan.</div><div class="actions"><button class="btn" data-action="reset">Yeni bir stratejiyle tekrar oyna ↺</button><a class="btn secondary" href="../../index.html#oyunlar" target="_top">BABA. oyunlarına dön</a></div>`;
  }
  function render(scroll=false){
    if(state.phase==='final'&&!state.scored){
      let rec={};try{rec=JSON.parse(localStorage.getItem('rota_conference_records_v2'))||{}}catch(_){}
      const score=Math.max(0,Math.round(sat()*2+punc()+margin()/1500));
      rec.runs=(rec.runs||0)+1;rec.bestScore=Math.max(rec.bestScore||0,score);rec.bestProfit=Math.max(rec.bestProfit||-1e9,margin());
      state.scored=true;try{localStorage.setItem('rota_conference_records_v2',JSON.stringify(rec))}catch(_){}
    }
    let main=state.phase==='brief'?briefing():state.phase==='bid'?bid():state.phase==='final'?finish():choicesPage(state.phase);
    document.getElementById('app').innerHTML=header()+main+footer();
    persist();
    if(scroll)document.getElementById('main-stage')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
  }
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('button[data-action]');if(!b)return;
    const action=b.dataset.action;
    if(action==='reset'){if(state.phase!=='brief'&&!confirm('İlerlemen sıfırlansın ve konferans yeniden başlasın mı?'))return;state=fresh();render(true);return;}
    if(action==='start'){state.phase='bid';render(true);return;}
    if(action==='submit-bid'){
      if(state.quote>BUDGET){state.negotiating=true;render(false);document.getElementById('bid-feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
      state.accepted=true;state.negotiating=false;state.phase='hotel';render(true);return;
    }
    if(action==='accept-counter'){state.quote=BUDGET;state.accepted=true;state.negotiating=false;state.phase='hotel';render(true);return;}
    if(action==='choose'){
      const key=b.dataset.section,idx=Number(b.dataset.index);
      if(!keys.includes(key)||!Number.isInteger(idx)||!((vendors[key]||incidents[key])?.items[idx]))return;
      state.choices[key]=idx;
      keys.filter(k=>phases.indexOf(k)>phases.indexOf(key)).forEach(k=>state.choices[k]=null);
      const next=phases.indexOf(key)+1;
      state.phase=phases[next]||'final';render(true);return;
    }
    if(action==='back'){
      const index=stageIndex();if(index>0&&index<=phases.indexOf('flight')){state.phase=phases[index-1];render(true)}return;
    }
    // Sonuçtan geriye dönerek sözleşmeyi değiştirmek yerine yeni oyun başlatılır.
  });
  document.addEventListener('input',ev=>{
    if(ev.target.id!=='price-range')return;
    state.quote=Number(ev.target.value);
    const offer=document.getElementById('quote-value');if(offer)offer.textContent=money(state.quote);
    const diff=document.getElementById('price-difference');if(diff)diff.textContent=money(state.quote-363000)+' fark';
    const metric=document.getElementById('metric-quote');if(metric)metric.textContent=money(state.quote);
    const profit=document.getElementById('metric-profit');if(profit)profit.textContent=money(state.quote-363000);
    state.negotiating=false;
    persist();
  });
  render();
})();
</script>
</body>
