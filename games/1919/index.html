let mode="home",sel=null,battle=null,loop=0,state=null,paused=false;
const app=document.getElementById("app"),e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const btn=(label,action,cls="")=>'<button class="'+cls+'" data-act="'+action+'">'+label+'</button>';
function header(){return '<header class="top"><div class="brand">1919 <span class="gold">✦</span> İSTİKLAL HARBİ<small>STRATEJİ · CEPHE · MÜCADELE</small></div><div class="controls">'+btn("Ana menü","home")+btn("Tarihsel Muharebeler","scenarios")+btn("Kaydet","save")+btn("Yükle","load")+'</div></header>'}
function home(){mode="home";stop();app.innerHTML=header()+'<section class="hero"><div class="eyebrow">1914 — 1922 / TARİHÎ STRATEJİ</div><h1>Bir milletin <span class="gold">kaderi.</span></h1><p>Stratejik haritada kolordularını yönet; kuşatma, takviye, diplomasi ve ikmal kararları al. Muharebelerde piyade, süvari ve topçu birliklerine gerçek zamanlı emir ver.</p><div class="actions">'+btn("Büyük Seferi Başlat","factions","primary")+btn("Tarihsel Muharebeler","scenarios")+'</div></section><div class="grid"><div class="tile"><strong>🗺️ Stratejik Sefer</strong><p>20 bölge, hareket, kaynak toplama, yapılar, cephe yönetimi ve sıra tabanlı kararlar.</p></div><div class="tile"><strong>⚔️ Taktik Muharebe</strong><p>Birlik seç, haritada hedef ver, ateş ettir, süvari ile kuşat ve siperlerde savun.</p></div><div class="tile"><strong>📜 Tarihsel Senaryolar</strong><p>Çanakkale’den Sakarya’ya altı ayrı oynanabilir meydan muharebesi.</p></div></div><p class="footer">Tarihsel olaylardan esinlenen oyunlaştırılmış bir kurgu; birebir tarihsel simülasyon değildir. Veriler bu tarayıcıda saklanır.</p>';wire()}
function factions(){mode="factions";app.innerHTML=header()+'<section class="hero"><div class="eyebrow">DEVLET SEÇİMİ</div><h1>Seferini seç.</h1><p class="muted">Türkiye 19 Mayıs 1919’da, diğer devletler uygun alternatif tarihlerde başlar. Bu sürümün stratejik haritası Anadolu ve yakın cepheler üzerinedir.</p></section><div class="grid">'+F.map(f=>'<button class="tile" data-faction="'+f.id+'"><span class="flag">'+f.flag+'</span><strong>'+f.name+'</strong><p>'+f.brief+'</p><span class="tag">'+f.year+'</span><span class="tag">'+f.bonus+'</span></button>').join("")+'</div>';wire()}
function scenarios(){mode="scenarios";stop();app.innerHTML=header()+'<section class="hero"><div class="eyebrow">TARİHSEL MUHAREBELER</div><h1>Altı cephe. <span class="gold">Altı karar.</span></h1><p>Bir senaryo seç, birliklerini yönet. Savaş alanı ve güç dengesi tarihsel olaylardan esinlenir.</p></section><div class="grid">'+SCENARIOS.map(s=>'<button class="tile" data-scenario="'+s.id+'"><span class="eyebrow">'+s.date+'</span><strong>'+s.name+'</strong><p>'+s.commander+' / '+s.enemy+'</p><span class="tag">'+s.weather+'</span><span class="tag">Muharebeye gir ↗</span></button>').join("")+'</div>';wire()}
function fresh(f){return {faction:f,turn:1,day:f==="tr"?"19 Mayıs 1919":"1 Ağustos "+(F.find(x=>x.id===f)?.year||1914),gold:250,supply:180,morale:68,selected:"Ankara",regions:P.map(p=>({...p})),log:["Karargâh kuruldu. Sefer başladı."],events:[],commander:0,wins:0,tech:0}}
function note(t){state.log.unshift(t);state.log=state.log.slice(0,30)}
function own(p){return p.owner===state.faction}
function region(id){return state.regions.find(p=>p.id===id)}
function connected(a,b){return edges.some(([x,y])=>x===a&&y===b||x===b&&y===a)}
function start(f){state=fresh(f);sel=state.selected;campaign()}
function mapSvg(){const bg='<rect width="1080" height="640" class="mapsea"/><path d="M14 130 Q90 65 214 116 T420 110 Q590 18 715 106 T1050 140 L1070 430 Q980 495 940 564 L810 592 667 542 492 596 310 558 139 494 18 410Z" fill="#6d7652" stroke="#adac80" stroke-width="3"/><path d="M80 380 Q260 340 390 402 T780 380 L900 442" fill="none" stroke="#516747" stroke-width="55" opacity=".35"/><path d="M15 195 Q240 188 410 180 T810 190" fill="none" stroke="#183e45" stroke-width="35"/>';
const routes=edges.map(([a,b])=>{let x=region(a),y=region(b);return '<line x1="'+x.x*10.55+'" y1="'+(x.y*5.7+20)+'" x2="'+y.x*10.55+'" y2="'+(y.y*5.7+20)+'" stroke="#d2cba1" opacity=".3" stroke-width="2"/>'}).join("");
const rail='<path class="rail" d="M430 315 L575 299 L425 415"/>';
return '<svg viewBox="0 0 1080 640" role="img" aria-label="Anadolu stratejik sefer haritası">'+bg+routes+rail+state.regions.map(p=>{const color=p.owner==="tr"?"#53866b":p.owner==="gr"?"#8b6456":p.owner==="fr"?"#7d789b":p.owner==="gb"?"#ad8870":p.owner==="ru"?"#9f6b6b":"#747b78";const x=p.x*10.55,y=p.y*5.7+20;return '<g data-province="'+p.id+'" tabindex="0" role="button" aria-label="'+p.name+', '+p.army+' asker"><circle class="province '+(sel===p.id?"selected":"")+'" cx="'+x+'" cy="'+y+'" r="'+(p.id==="Ankara"?19:15)+'" fill="'+color+'"/><text class="province-label" x="'+x+'" y="'+(y-23)+'" text-anchor="middle">'+p.name+'</text><text x="'+x+'" y="'+(y+4)+'" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" pointer-events="none">'+p.army+'</text></g>'}).join("")+'</svg>'}
function campaign(){if(!state)return home();mode="campaign";stop();sel=sel||"Ankara";const r=region(sel),f=F.find(x=>x.id===state.faction);app.innerHTML=header()+'<div class="statbar"><div class="stat">📜 <b>'+state.day+'</b> · Tur '+state.turn+'</div><div class="stat">💰 Altın <b>'+state.gold+'</b></div><div class="stat">📦 İkmal <b>'+state.supply+'</b></div><div class="stat">⚑ Moral <b>'+state.morale+'</b></div><div class="stat">🏆 Zafer <b>'+state.wins+'</b></div></div><div class="layout"><section><div class="panel"><div class="eyebrow">'+f.flag+' '+f.name+' / BÜYÜK SEFER</div><h2>Anadolu Cepheleri</h2><div class="mapwrap">'+mapSvg()+'</div><p class="muted" style="margin-top:8px">Şehir seç, birlik takviyesi yap veya komşu bir cepheye yürüyüş emri ver. Renkler: yeşil Türkiye · turuncu Yunanistan · mor Fransa · açık kahve Britanya.</p><div class="actions">'+btn("Sonraki Tur →","next","primary")+btn("Karargâh Kararları","decisions")+btn("Tarihsel Muharebeler","scenarios")+'</div></div><div class="panel section"><h3>📡 Telgrafhaneden Haberler</h3><div class="logs">'+state.log.map(t=>'<p>• '+e(t)+'</p>').join("")+'</div></div></section><aside><div class="panel"><div class="eyebrow">SEÇİLİ BÖLGE</div><h2>'+r.name+'</h2><p>Kontrol: <b>'+e(F.find(x=>x.id===r.owner)?.name||r.owner)+'</b></p><p>Birlik: <b>'+r.army+'</b> · Tahkimat: <b>'+r.fort+'</b> · İkmal noktası: <b>'+r.level+'</b></p><div class="actions">'+btn("＋ 10 Asker (40 altın)","recruit","primary")+btn("🛡 Siper İnşa (60 altın)","fort")+btn("📦 İkmal Hattı (50 altın)","supply")+'</div><hr style="border-color:#52614e"><label for="march">Komşu bölgeye hareket:</label><select id="march" style="width:100%;padding:10px;margin:10px 0;background:#26372d;color:#fff;border:1px solid #8a987f;border-radius:7px">'+edges.filter(([a,b])=>a===sel||b===sel).map(([a,b])=>{const id=a===sel?b:a,p=region(id);return '<option value="'+id+'">'+p.name+' — '+p.army+' asker ('+p.owner.toUpperCase()+')</option>'}).join("")+'</select>'+btn("⚔ Kolorduyu Sevk Et","march","primary")+'</div><div class="panel section"><div class="eyebrow">KOMUTANLIK</div><h3>'+COMMANDERS[state.commander%COMMANDERS.length]+'</h3><p class="muted">Komutan özel emri, bir sonraki muharebede birliklerin moralini artırır.</p>'+btn("Komutan Değiştir ↻","commander")+btn("Özel Emir (30 ikmal)","ability")+'</div></aside></div>';wire()}
function next(){state.turn++;state.gold+=state.regions.filter(own).length*8;state.supply+=state.regions.filter(own).length*3;state.morale=Math.max(25,Math.min(100,state.morale+(state.turn%3===0?2:-1)));const yr=state.faction==="tr"?1919:1914;const m=["Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık","Ocak","Şubat","Mart","Nisan"];state.day=m[(state.turn-1)%12]+" "+(yr+Math.floor((state.turn+3)/12));if(state.turn%3===0){const hostile=state.regions.filter(p=>p.owner!==state.faction&&p.army<75);if(hostile.length){const p=hostile[(state.turn*7)%hostile.length];p.army+=4;note(p.name+" cephesine düşman takviyesi ulaştı.")}}note("Tur "+state.turn+": Vergi ve ikmal gelirleri toplandı.");campaign()}
function action(a){if(a==="home")return home();if(a==="factions")return factions();if(a==="scenarios")return scenarios();if(a==="save"){if(!state)return alert("Önce bir sefer başlat.");localStorage.setItem("baba_1919_save_v1",JSON.stringify(state));return alert("Sefer bu cihazda kaydedildi.")}if(a==="load"){try{const x=JSON.parse(localStorage.getItem("baba_1919_save_v1"));if(!x||!Array.isArray(x.regions))throw Error();state=x;sel=x.selected||"Ankara";return campaign()}catch{return alert("Kaydedilmiş sefer bulunamadı.")}}if(!state)return;if(a==="next")return next();const p=region(sel);if(a==="recruit"){if(!own(p)||state.gold<40)return alert("Bölge size ait olmalı ve 40 altın gerekir.");state.gold-=40;p.army+=10;note(p.name+" bölgesinde 10 asker silah altına alındı.")}else if(a==="fort"){if(!own(p)||state.gold<60)return alert("Siper için bölge ve 60 altın gerekir.");state.gold-=60;p.fort++;note(p.name+" tahkimatı güçlendirildi.")}else if(a==="supply"){if(!own(p)||state.gold<50)return alert("İkmal için bölge ve 50 altın gerekir.");state.gold-=50;p.level++;state.supply+=30;note(p.name+" ikmal hattı genişletildi.")}else if(a==="commander"){state.commander++;note("Komutan: "+COMMANDERS[state.commander%COMMANDERS.length])}else if(a==="ability"){if(state.supply<30)return alert("30 ikmal gerekir.");state.supply-=30;state.morale=Math.min(100,state.morale+16);note("Başkomutanlık özel emri: birlik morali yükseldi.")}else if(a==="decisions")return decisions();else if(a==="march"){const dest=document.getElementById("march")?.value;if(!dest||!own(p)||p.army<12)return alert("Hareket için size ait bölgede en az 12 asker gerekir.");const target=region(dest);if(!connected(sel,dest))return;if(own(target)){let send=Math.floor(p.army*.5);p.army-=send;target.army+=send;note(p.name+" → "+target.name+": "+send+" asker sevk edildi.")}else return prebattle({origin:sel,target:dest,scenario:null});}campaign()}
function decisions(){const choices=[["Amasya Genelgesi","Milli birlik +12","amasya",30],["Erzurum ve Sivas Kongreleri","Moral +16","congress",45],["TBMM’nin Açılışı","Altın +110, ikmal +40","tbmm",50],["Tekâlif-i Milliye","İkmal +130, moral +8","tekalif",65],["Moskova Antlaşması","Altın +90, ikmal +70","moskova",50],["İmalat-ı Harbiye","Birlik takviyesi +6, teknoloji +1","imalat",75]];app.insertAdjacentHTML("beforeend",'<div class="overlay" id="modal"><div class="modal"><div class="eyebrow">KARARGÂH · DİPLOMASİ</div><h2>Millî Mücadele Kararları</h2><p class="muted">Bu kararlar tarihsel olayları oyun mekaniği olarak yorumlar.</p>'+choices.map(([name,desc,id,cost])=>'<button style="width:100%;text-align:left;margin:4px 0" data-decision="'+id+'"><b>'+name+'</b><br><small>'+desc+' · '+cost+' altın</small></button>').join("")+btn("Kapat","close")+'</div></div>');wire()}
function decision(id){const costs={amasya:30,congress:45,tbmm:50,tekalif:65,moskova:50,imalat:75};if(state.events.includes(id))return alert("Bu karar zaten uygulandı.");if(state.gold<costs[id])return alert("Altın yetersiz.");state.gold-=costs[id];state.events.push(id);if(id==="amasya")state.morale+=12;if(id==="congress")state.morale+=16;if(id==="tbmm"){state.gold+=110;state.supply+=40}if(id==="tekalif"){state.supply+=130;state.morale+=8}if(id==="moskova"){state.gold+=90;state.supply+=70}if(id==="imalat"){state.tech++;state.regions.filter(own).forEach(p=>p.army+=6)}state.morale=Math.min(100,state.morale);note("Karargâh kararı uygulandı: "+id);campaign()}
function prebattle(opts){const p=opts.target?region(opts.target):null,s=opts.scenario?SCENARIOS.find(x=>x.id===opts.scenario):null;const title=s?s.name:p.name+" Cephesi";app.insertAdjacentHTML("beforeend",'<div class="overlay" id="modal"><div class="modal"><div class="eyebrow">MUHAREBE EMRİ · HAZIRLIK</div><h2>'+title+'</h2><p>Komutan: '+(s?s.commander:COMMANDERS[state.commander%COMMANDERS.length])+'</p><p>Karşı Komutan: '+(s?s.enemy:"Düşman cephe komutanı")+'</p><div class="statbar"><span class="stat">Dost: <b>'+(s?100:region(opts.origin).army)+'</b></span><span class="stat">Düşman: <b>'+(s?100:p.army)+'</b></span><span class="stat">'+(s?s.weather:"Açık")+'</span></div><p class="muted">Birlik seçip savaş alanına dokunarak ya da tıklayarak hedef ver. Düşmana yaklaşınca ateş açılır.</p><div class="actions">'+btn("⚔ Muharebeyi Yönet","fight","primary")+btn("İptal","close")+'</div></div></div>');window.pendingBattle=opts;wire()}
function openScenario(id){if(!state)state=fresh("tr");prebattle({scenario:id})}
function stop(){if(loop)cancelAnimationFrame(loop);loop=0;battle=null}
function beginBattle(opts){document.getElementById("modal")?.remove();mode="battle";const s=opts.scenario?SCENARIOS.find(x=>x.id===opts.scenario):null;const origin=opts.origin?region(opts.origin):null,target=opts.target?region(opts.target):null;const strength=Math.max(30,Math.min(130,s?100:origin.army));battle={opts,s,origin:opts.origin,target:opts.target,t:0,done:false,selected:0,units:[],shots:[],particles:[],time:performance.now(),end:null};const types=["Piyade","Piyade","Süvari","Topçu"];for(let team=0;team<2;team++)for(let i=0;i<4;i++){let n=Math.round((team?Math.max(35,target?.army||90):strength)*(types[i]==="Topçu"?.15:types[i]==="Süvari"?.2:.32));battle.units.push({id:team*4+i,team,type:types[i],x:team?680:115,y:80+i*100+(team?25:0),tx:team?580:360,ty:80+i*100,hp:n,max:n,morale:80,ammo:100,cool:0,guard:false})}app.innerHTML=header()+'<div class="statbar"><div class="stat">⚔ <b>'+(s?s.name:region(opts.target).name+" Cephesi")+'</b></div><div class="stat">Dost: <b id="friendN">—</b></div><div class="stat">Düşman: <b id="enemyN">—</b></div><div class="stat">Süre: <b id="clock">00:00</b></div></div><div class="battle-layout"><div><div class="battlefield"><canvas id="field" width="800" height="500" aria-label="Taktik savaş alanı"></canvas></div><p class="notice">Birlik seç → haritada hedefe dokun. <span class="desktop-only">Klavye: 1–4 birlik, boşluk duraklat.</span> Mevzi tut ile siperde savun, hücum ile ileri atıl.</p><div class="actions">'+btn("⏸ Duraklat","pause")+btn("⚑ Mevzi Tut","guard")+btn("⚔ Hücum","charge","primary")+btn("↶ Geri Çekil","retreat")+'</div></div><aside class="panel"><div class="eyebrow">BİRLİK EMİRLERİ</div><h2>Kolordu</h2><div id="unitlist"></div><hr style="border-color:#52614e"><h3>Komutan Yeteneği</h3><p>Birlikleri toparlar; moral ve kısa süreli taarruz üstünlüğü verir.</p>'+btn("★ Başkomutanlık Emri","rally","primary")+'<p class="muted" id="battleinfo">Emir vermek için birlik seç.</p></aside></div>';wire();paintUnitList();paused=false;loop=requestAnimationFrame(tick)}
function paintUnitList(){if(!battle)return;const n=document.getElementById("unitlist");if(!n)return;n.innerHTML=battle.units.filter(x=>x.team===0).map((u,i)=>'<button class="unitbtn '+(battle.selected===i?"active":"")+'" data-unit="'+i+'"><span><b>'+(i+1)+'. '+u.type+'</b><br><small>'+Math.ceil(u.hp)+' / '+u.max+' asker</small></span><span style="width:55px"><div class="progress"><i style="width:'+Math.max(0,u.hp/u.max*100)+'%"></i></div></span></button>').join("");n.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{battle.selected=+b.dataset.unit;paintUnitList()})}
function battleAction(a){if(!battle)return;let u=battle.units[battle.selected];if(a==="pause"){paused=!paused;document.querySelector('[data-act="pause"]').textContent=paused?"▶ Devam":"⏸ Duraklat";return}if(a==="guard"){u.guard=true;u.tx=u.x;u.ty=u.y}if(a==="charge"){u.guard=false;u.tx=660;u.ty=u.y;u.morale=Math.min(100,u.morale+10)}if(a==="retreat"){u.guard=false;u.tx=45;u.ty=u.y}if(a==="rally"){battle.units.filter(x=>x.team===0).forEach(x=>x.morale=Math.min(100,x.morale+25));state.supply=Math.max(0,state.supply-15);battle.rally=battle.t+12}paintUnitList()}
function tick(now){if(!battle)return;let dt=Math.min(.04,(now-battle.time)/1000);battle.time=now;if(!paused&&!battle.done)updateBattle(dt);drawBattle();loop=requestAnimationFrame(tick)}
function updateBattle(dt){const b=battle;b.t+=dt;for(const u of b.units){if(u.hp<=0)continue;u.cool=Math.max(0,u.cool-dt);if(u.team===1){const f=b.units.filter(x=>x.team===0&&x.hp>0).sort((a,c)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(c.x-u.x,c.y-u.y))[0];if(f){u.tx=f.x+70;u.ty=f.y+(u.id%2?20:-20)}}let dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy),speed=u.type==="Süvari"?53:u.type==="Topçu"?11:30;if(!u.guard&&d>8){u.x+=dx/d*Math.min(d,speed*dt);u.y+=dy/d*Math.min(d,speed*dt)}const targets=b.units.filter(x=>x.team!==u.team&&x.hp>0);targets.sort((a,c)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(c.x-u.x,c.y-u.y));const t=targets[0];if(!t)continue;const dist=Math.hypot(t.x-u.x,t.y-u.y),range=u.type==="Topçu"?480:u.type==="Süvari"?65:220;if(dist<range&&u.cool<=0&&u.ammo>0){u.cool=u.type==="Topçu"?3.2:u.type==="Süvari"?.85:1.5;u.ammo--;const cover=t.guard?.65:1,bonus=u.team===0&&b.rally>b.t?1.5:1;const damage=(u.type==="Topçu"?8:u.type==="Süvari"?3.4:2.6)*(u.hp/u.max)*cover*bonus*(.7+Math.random()*.6);t.hp=Math.max(0,t.hp-damage);t.morale=Math.max(0,t.morale-damage*.9);b.shots.push({x:u.x,y:u.y,tx:t.x,ty:t.y,life:.2,team:u.team,boom:u.type==="Topçu"});if(t.morale<12){t.tx=t.team===0?0:800;t.guard=false}}}
for(const s of b.shots)s.life-=dt;b.shots=b.shots.filter(x=>x.life>0);const f=b.units.filter(x=>x.team===0).reduce((a,u)=>a+u.hp,0),e=b.units.filter(x=>x.team===1).reduce((a,u)=>a+u.hp,0);if(f<=2||e<=2||b.t>=240){b.done=true;b.end=f>e?"win":"lose";setTimeout(()=>finishBattle(b),500)}if(Math.floor(b.t*2)%2===0){const fn=document.getElementById("friendN"),en=document.getElementById("enemyN"),cl=document.getElementById("clock");if(fn){fn.textContent=Math.ceil(f);en.textContent=Math.ceil(e);cl.textContent=String(Math.floor(b.t/60)).padStart(2,"0")+":"+String(Math.floor(b.t%60)).padStart(2,"0")}}}
function drawBattle(){const c=document.getElementById("field");if(!c||!battle)return;const g=c.getContext("2d"),w=800,h=500;g.clearRect(0,0,w,h);g.fillStyle=battle.s?.id==="sarikamis"?"#a2b0a9":"#6d7550";g.fillRect(0,0,w,h);g.fillStyle="#566148";for(let i=0;i<11;i++){const x=i*89+28,y=60+Math.sin(i*2)*40;g.beginPath();g.ellipse(x,y,75,22,-.2,0,7);g.fill()}g.strokeStyle="#574d36";g.lineWidth=14;for(const x of [210,605]){g.beginPath();g.moveTo(x,16);for(let y=16;y<500;y+=30)g.lineTo(x+Math.sin(y*.04)*6,y);g.stroke()}g.lineWidth=2;g.setLineDash([8,6]);g.strokeStyle="#bdad76";g.beginPath();g.moveTo(400,0);g.lineTo(400,500);g.stroke();g.setLineDash([]);
for(const u of battle.units){if(u.hp<=0)continue;const col=u.team===0?"#d8ba82":"#bc5e51",count=Math.max(1,Math.min(16,Math.ceil(u.hp/4)));if(u.guard){g.fillStyle="#776448";g.fillRect(u.x-33,u.y+18,68,10)}for(let i=0;i<count;i++){const cols=4,px=u.x+(i%cols-1.5)*10,py=u.y+(Math.floor(i/cols)-1.5)*10;g.fillStyle=col;g.beginPath();g.arc(px,py,u.type==="Topçu"?5:3.5,0,7);g.fill()}if(u.type==="Topçu"){g.fillStyle="#252e27";g.fillRect(u.x-15,u.y-6,30,11);g.fillRect(u.x+12,u.y-3,22,4)}if(u.type==="Süvari"){g.strokeStyle="#382c26";g.strokeRect(u.x-16,u.y-10,32,20)}if(u.team===0&&battle.selected===u.id){g.strokeStyle="#fff1a7";g.lineWidth=2;g.beginPath();g.arc(u.x,u.y,32,0,7);g.stroke();g.setLineDash([4,4]);g.beginPath();g.moveTo(u.x,u.y);g.lineTo(u.tx,u.ty);g.stroke();g.setLineDash([])}g.fillStyle="#212b23";g.fillRect(u.x-26,u.y-40,52,6);g.fillStyle=u.team===0?"#91d49f":"#e0917f";g.fillRect(u.x-26,u.y-40,52*(u.hp/u.max),6)}
for(const s of battle.shots){g.strokeStyle=s.team===0?"#fff4a0":"#ffb5a1";g.lineWidth=s.boom?4:2;g.globalAlpha=Math.min(1,s.life*5);g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.tx,s.ty);g.stroke();g.globalAlpha=1;if(s.boom){g.fillStyle="#e1a64d";g.beginPath();g.arc(s.tx,s.ty,9,0,7);g.fill()}}
g.font="bold 14px system-ui";g.fillStyle="#f4e9ce";g.fillText("DOST KOLORDULAR",24,28);g.textAlign="right";g.fillText("KARŞI CEPHE",775,28);g.textAlign="left";if(paused){g.fillStyle="#13201aca";g.fillRect(0,0,w,h);g.fillStyle="#fff";g.font="bold 30px Georgia";g.fillText("DURAKLATILDI",275,245)}}
function finishBattle(b){if(battle!==b)return;cancelAnimationFrame(loop);loop=0;const victory=b.end==="win";const left=b.units.filter(x=>x.team===0).reduce((a,x)=>a+x.hp,0),enemy=b.units.filter(x=>x.team===1).reduce((a,x)=>a+x.hp,0);if(victory){state.wins++;state.gold+=65;state.supply+=35;if(b.target&&b.origin){const from=region(b.origin),to=region(b.target);from.army=Math.max(8,Math.ceil(left*.35));to.owner=state.faction;to.army=Math.max(10,Math.ceil(left*.65));sel=to.id;state.selected=to.id}}else if(b.origin){region(b.origin).army=Math.max(5,Math.floor(left))}note((victory?"Zafer":"Yenilgi")+" — "+(b.s?.name||region(b.target)?.name||"Cephe")+". Kalan kuvvet: "+Math.ceil(left));mode="result";app.innerHTML=header()+'<section class="hero"><div class="eyebrow">ANKARA TELGRAFHANESİ · HARP RAPORU</div><h1>'+(victory?"⚑ <span class='gold'>ZAFER</span>":"⚐ MUHAREBE KAYBEDİLDİ")+'</h1><p>'+(b.s?.name||region(b.target)?.name||"Cephe")+' muharebesi sonuçlandı.</p></section><div class="grid"><div class="panel"><h3>Dost askerleri</h3><h2>'+Math.ceil(left)+'</h2></div><div class="panel"><h3>Düşman askerleri</h3><h2>'+Math.ceil(enemy)+'</h2></div><div class="panel"><h3>Ganimet / kaynak</h3><h2>'+(victory?"+65 altın / +35 ikmal":"—")+'</h2></div></div><div class="actions section">'+btn("Sefer Haritasına Dön","campaign","primary")+btn("Yeni Muharebe","scenarios")+'</div>';battle=null;wire()}
function wire(){app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==="fight")return beginBattle(window.pendingBattle);if(a==="close"){document.getElementById("modal")?.remove();return}if(a==="campaign")return campaign();if(mode==="battle"&&["pause","guard","charge","retreat","rally"].includes(a))return battleAction(a);action(a)});app.querySelectorAll("[data-faction]").forEach(b=>b.onclick=()=>start(b.dataset.faction));app.querySelectorAll("[data-scenario]").forEach(b=>b.onclick=()=>openScenario(b.dataset.scenario));app.querySelectorAll("[data-province]").forEach(g=>{const f=()=>{sel=g.dataset.province;state.selected=sel;campaign()};g.onclick=f;g.onkeydown=x=>{if(x.key==="Enter"||x.key===" "){x.preventDefault();f()}}});app.querySelectorAll("[data-decision]").forEach(b=>b.onclick=()=>decision(b.dataset.decision));const cv=document.getElementById("field");if(cv)cv.onpointerdown=ev=>{if(!battle||battle.done)return;const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*800,y=(ev.clientY-r.top)/r.height*500,u=battle.units[battle.selected];if(u){u.tx=Math.max(15,Math.min(785,x));u.ty=Math.max(25,Math.min(480,y));u.guard=false}}}
document.addEventListener("keydown",ev=>{if(mode!=="battle"||!battle)return;if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;if(ev.key===" "){ev.preventDefault();battleAction("pause")}if(/^[1-4]$/.test(ev.key)){battle.selected=+ev.key-1;paintUnitList()}});
window.addEventListener("pagehide",()=>{if(state&&mode==="campaign")localStorage.setItem("baba_1919_autosave",JSON.stringify(state))});home();
</script><script src="upgrade.js?v=4"></script><script src="command.js?v=3"></script></body></html>
