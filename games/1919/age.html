6px;font-size:12px}.resources b{color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;flex:1;min-height:0}.maparea{display:flex;flex-direction:column;min-width:0}.toolbar{display:flex;gap:5px;padding:7px;background:#243c4c;overflow-x:auto}.toolbar button{font-size:11px;white-space:nowrap}.toolbar .selected{background:var(--gold);color:#112736}.viewport{position:relative;flex:1;min-height:240px;overflow:hidden;touch-action:none;background:#184257;cursor:grab}.viewport svg{width:100%;height:100%;display:block;user-select:none}.province{cursor:pointer;stroke:#f2e2c5;stroke-opacity:.63;stroke-width:1.4}.province:hover{filter:brightness(1.25)}.province{transition:fill 1.8s ease,filter .3s ease}.province.captured{animation:provinceCapture 1.8s ease-out}@keyframes provinceCapture{0%{filter:brightness(2.5) drop-shadow(0 0 12px #ffe39a)}35%{filter:brightness(1.8) drop-shadow(0 0 9px #ffe39a)}100%{filter:brightness(1)}}.province.active{stroke:#fff1a7;stroke-width:4}.province.target{stroke:#ffbe62;stroke-dasharray:8 5;stroke-width:3}.label{font:bold 13px system-ui;paint-order:stroke;stroke:#182d3c;stroke-width:3.5;fill:#fff5d5;pointer-events:none}.number{font:bold 12px system-ui;fill:#fff;pointer-events:none}.maptip{position:absolute;bottom:8px;left:9px;background:#162b39df;padding:6px 9px;border:1px solid #6a8794;border-radius:6px;font-size:11px}.bottom{display:flex;gap:6px;align-items:center;padding:8px;background:#182e3d;border-top:1px solid var(--line)}.bottom .spacer{flex:1}.side{background:#162d3d;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.tabs{display:flex;gap:3px;padding:5px;background:#112532}.tabs button{flex:1;font-size:10px;border:0;padding:9px 2px}.tabs .on{background:#49677c}.sidebody{overflow:auto;padding:13px}.sidebody h2{font-size:26px}.muted{font-size:12px;color:var(--muted)}.panel{border:1px solid #587487;background:#203b4c;border-radius:9px;padding:11px;margin-bottom:10px}.panel h3{color:var .army-count-bg{transform-box:fill-box;transform-origin:center;animation:armyReady 2.8s ease-in-out infinite}
.garrison{opacity:.9;filter:drop-shadow(0 1px 2px #08110f)}
.soldier-figure{transform-box:fill-box;transform-origin:center bottom;animation:soldierStep .72s ease-in-out infinite alternate}
.soldier-b{animation-delay:.18s}
.province-model{filter:drop-shadow(0 2px 2px #0b1512);pointer-events:none}
.province-model .model-count-bg{fill:#152923;stroke:#e8c887;stroke-width:1}
.model-count{fill:#fff2d1;font:700 7px system-ui;text-anchor:middle;pointer-events:none}
.model-barracks.build-active{transform-box:fill-box;transform-origin:center;animation:barracksBuild .7s ease-out}
.model-investment.build-active{transform-box:fill-box;transform-origin:center;animation:craneBuild .85s ease-out}
.model-market.build-active{transform-box:fill-box;transform-origin:center;animation:marketBuild .7s ease-out}
.model-farm.build-active{transform-box:fill-box;transform-origin:center;animation:farmBuild .85s ease-out}
.model-fort.build-active{transform-box:fill-box;transform-origin:center;animation:fortBuild .75s ease-out}
.model-festival.build-active{transform-box:fill-box;transform-origin:center;animation:festivalBurst 1.2s ease-out}
.march-trail{fill:none;stroke:#ffe3a0;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 12;opacity:.8;filter:drop-shadow(0 0 4px #e5b75b)}
.march-icon{font:700 15px system-ui;fill:#f8df9f}
.march-count{font:700 10px system-ui;fill:#172b25}
@keyframes armyReady{0%,100%{stroke:#e1c88d;stroke-width:1.5}50%{stroke:#fff0b2;stroke-width:2.4}}
@keyframes soldierStep{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes barracksBuild{0%{transform:scale(.25);opacity:.15}65%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
@keyframes craneBuild{0%{transform:translateY(11px) scaleY(.45);opacity:.1}55%{transform:translateY(-2px) scaleY(1.08)}100%{transform:translateY(0) scaleY(1);opacity:1}}
@keyframes marketBuild{0%{transform:scale(.2) rotate(-12deg);opacity:.1}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1);opacity:1}}
@keyframes farmBuild{0%{transform:scaleY(.1);transform-origin:bottom;opacity:.1}75%{transform:scaleY(1.12)}100%{transform:scaleY(1);opacity:1}}
@keyframes fortBuild{0%{transform:scaleY(.05);transform-origin:bottom;opacity:.15}70%{transform:scaleY(1.08)}100%{transform:scaleY(1);opacity:1}}
@keyframes festivalBurst{0%{transform:scale(.2) rotate(-8deg);opacity:.1}55%{transform:scale(1.22) rotate(5deg)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.army-count-bg,.soldier-figure,.build-active{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.province{stroke:#182d32;stroke-width:.6}.province.active{stroke:#efd29a;stroke-width:1.8}.world-troop{animation:worldIdle 3s ease-in-out infinite}@keyframes worldIdle{50%{translate:0 -1px}}.cards{max-height:65vh;overflow:auto}.cards [hidden]{display:none!important}#nation-filter{margin:6px;min-width:200px;max-width:100%;padding:9px;background:#102835;border:1px solid #8f846a;color:#fff}#difficulty{padding:9px;background:#102835;border:1px solid #8f846a;color:#fff}#map-search{flex:1;min-width:150px;max-width:240px;padding:7px 9px;background:#112835;color:#fff;border:1px solid #8b7653;border-radius:4px}@media(max-width:700px){#map-search{min-width:140px}}.endgame-summary{max-width:760px}.endgame-summary .stats{grid-template-columns:repeat(4,1fr);margin:12px 0}@media(max-width:560px){.top{flex-wrap:wrap;justify-content:center}.top nav{flex-wrap:wrap;justify-content:center}.endgame-summary .stats{grid-template-columns:repeat(2,1fr)}.panel{overflow-wrap:anywhere}}.game{min-height:0}.viewport{background:#142a39}.top,.resources,.side,.toolbar{background:#222d30;border-color:#8d7c55}button{border-radius:3px}.hero{background:linear-gradient(120deg,#182527,#56604b)}@media(prefers-reduced-motion:reduce){.world-troop{animation:none}}</style><link rel="stylesheet" href="game-layout.css?v=1"><link rel="stylesheet" href="enhance.css?v=1"></head><body><div id="app"></div><script src="country-meta.js?v=1"></script><script src="geo-utils.js?v=1"></script><script src="strategy-time.js?v=1"></script><script src="age.js?v=12"></script><script src="enhance.js?v=3"></script><script src="../../js/vendor/topojson-client.min.js"></script><script src="world.js?v=9"></script></body></html>
